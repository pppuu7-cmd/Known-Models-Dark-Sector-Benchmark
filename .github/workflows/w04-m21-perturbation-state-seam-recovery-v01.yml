name: W04 M21 perturbation-state seam recovery v0.1

on:
  push:
    paths:
      - '.github/workflows/w04-m21-perturbation-state-seam-recovery-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install analyzer dependency
        run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.2.6
      - name: Download immutable parent BLOCKED aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-perturbation-state-branch-signature-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34895647832
      - name: Verify recovery authorization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('parent/M21_PERTURBATION_STATE_BRANCH_SIGNATURE_RESULT.json')
          d=json.loads(p.read_text())
          assert d.get('classification')=='M21_PERTURBATION_STATE_BRANCH_SIGNATURE_BLOCKED', d
          err=d.get('error','')
          assert 'invalid a coordinate' in err, err
          assert d.get('physical_falsification') is False
          print(json.dumps({'parent_classification':d['classification'],'parent_error':err},indent=2))
          PY
      - name: Download immutable six scientific lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m21-pert-state-*
          path: lanes
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34895647832
      - name: Apply frozen seam-preserving recovery classifier
        run: |
          set -euo pipefail
          python3 verification/m21/perturbation_state_branch_signature_seam_recovery.py lanes verification/m21/m21_perturbation_state_gate_config.json M21_PERTURBATION_STATE_BRANCH_SIGNATURE_RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-perturbation-state-seam-recovery-v01
          retention-days: 90
          path: M21_PERTURBATION_STATE_BRANCH_SIGNATURE_RESULT.json
