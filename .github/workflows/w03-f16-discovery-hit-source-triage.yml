name: W03 F16 discovery-hit exact-source triage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w03-f16-discovery-hit-source-triage.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: f16-provider-discovery-aggregate
          path: parent
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34794527520
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: m
        name: Freeze repository-deduplicated candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('parent/f16_provider_discovery_aggregate.json'))
          by={}
          for h in d.get('unique_code_hits',[]):
            repo=(h.get('repository') or '').strip()
            if not repo or repo.lower()=='pppuu7-cmd/known-models-dark-sector-benchmark': continue
            item={'repository':repo,'path':h.get('path') or '','hit_url':h.get('html_url') or ''}
            old=by.get(repo)
            if old is None or item['hit_url'] < old['hit_url']: by[repo]=item
          items=[by[k] for k in sorted(by,key=str.lower)][:20]
          print('matrix='+json.dumps({'include':items},separators=(',',':')))
          PY

  audit:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' && needs.prepare.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact pin and audit matched source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repository }}
          PATH_HIT: ${{ matrix.path }}
          HIT_URL: ${{ matrix.hit_url }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,base64,hashlib,re
          repo=os.environ['REPO']; path=os.environ['PATH_HIT']; hit=os.environ['HIT_URL']; tok=os.environ['GH_TOKEN']
          hdr={'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'KMDSB-F16-source-triage'}
          def get(url):
            req=urllib.request.Request(url,headers=hdr)
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return r.status,json.loads(r.read().decode())
            except Exception as e: return None,{'error':repr(e)}
          out={'schema':'KMDSB.W03.F16DiscoveryHitSourceTriage.v0.1','repository':repo,'matched_path':path,'hit_url':hit,'classification':'F16_SOURCE_HIT_AUDIT_INFRASTRUCTURE_BLOCKED','protocol':'protocol/W03_F16_DISCOVERY_HIT_SOURCE_TRIAGE_v0.1.md'}
          st,meta=get('https://api.github.com/repos/'+repo)
          if st==200:
            branch=meta.get('default_branch'); out['default_branch']=branch
            stc,cm=get('https://api.github.com/repos/'+repo+'/commits/'+urllib.parse.quote(branch,safe=''))
            if stc==200:
              sha=cm.get('sha'); out['exact_commit']=sha
              u='https://api.github.com/repos/'+repo+'/contents/'+urllib.parse.quote(path,safe='/')+'?ref='+sha
              stf,fd=get(u)
              if stf==200 and isinstance(fd,dict) and fd.get('content'):
                raw=base64.b64decode(fd['content']); text=raw.decode('utf-8','replace'); low=text.lower()
                solver=any(x in low for x in ['camb','class','cosmomc'])
                rvm=any(x in low for x in ['running vacuum','running_vacuum','rho_lambda','lambda(h)','lambda_h'])
                inverse=any(x in low for x in ['h^-2','h**-2','/h^2','/ h^2','h0^4'])
                hdep=(bool(re.search(r'\bh0?\b',low)) and any(x in low for x in ['nu','vacuum','lambda']))
                pert=any(x in low for x in ['perturb','delta','conservation','interaction','transfer','q_mu','continuity'])
                out.update({'classification':'F16_SOURCE_HIT_FETCHED_TRIAGE_ONLY','source_fetch_status':stf,'source_size':len(raw),'source_sha256':hashlib.sha256(raw).hexdigest(),'signals':{'solver_ecosystem':solver,'running_vacuum_token':rvm,'h_dependent_law_hint':hdep,'inverse_h_special_rvm_hint':inverse,'perturbation_conservation_hint':pert},'priority':'HIGHER_SOURCE_REVIEW_PRIORITY' if ((solver and rvm) or inverse) else 'LOWER_SOURCE_REVIEW_PRIORITY'})
              else:
                out.update({'classification':'F16_SOURCE_HIT_METADATA_ONLY','source_fetch_status':stf,'source_fetch_error':fd})
          safe=re.sub(r'[^A-Za-z0-9_.-]+','_',repo)
          open('out/'+safe+'.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f16-source-triage-${{ strategy.job-index }}
          path: out/*.json
          if-no-files-found: error

  aggregate:
    needs: [prepare,audit]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f16-source-triage-*
          path: lanes
          merge-multiple: true
      - name: Apply frozen triage aggregate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json
          rows=[]
          for f in sorted(glob.glob('lanes/*.json')):
            try: rows.append(json.load(open(f)))
            except Exception: pass
          high=[r for r in rows if r.get('priority')=='HIGHER_SOURCE_REVIEW_PRIORITY']
          out={'schema':'KMDSB.W03.F16DiscoveryHitSourceTriageAggregate.v0.1','classification':'F16_EXACT_SOURCE_TRIAGE_COMPLETE_NO_K0_PROMOTION','parent_run':34794527520,'audited_repository_count':len(rows),'higher_priority_count':len(high),'higher_priority_candidates':[{'repository':r.get('repository'),'exact_commit':r.get('exact_commit'),'matched_path':r.get('matched_path'),'signals':r.get('signals')} for r in high],'all_results':rows,'K0_promoted':False,'K1_promoted':False,'physical_falsification':False}
          open('f16_source_triage_aggregate.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'classification':out['classification'],'audited_repository_count':len(rows),'higher_priority_count':len(high),'higher_priority_candidates':out['higher_priority_candidates']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f16-source-triage-aggregate
          path: f16_source_triage_aggregate.json
          if-no-files-found: error
