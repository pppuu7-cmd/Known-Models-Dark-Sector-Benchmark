name: W03 M13b K3C1 independent critical-density background closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3c1-independent-background-closure.yml'

permissions:
  contents: write

jobs:
  k3c1-background:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute prospectively frozen K3C1 background closure
        run: |
          set -euo pipefail
          python3 verification/m13b/k3c1_independent_critical_density_background.py \
            --output waves/wave_03_expanded_dark_energy/M13B_K3C1_INDEPENDENT_BACKGROUND_CLOSURE_RESULT.json
      - name: Verify fail-closed provenance guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('waves/wave_03_expanded_dark_energy/M13B_K3C1_INDEPENDENT_BACKGROUND_CLOSURE_RESULT.json')
          r=json.loads(p.read_text())
          assert r['schema']=='KMDSB.W03.M13b.K3C1IndependentCriticalDensityBackground.v0.1'
          assert r['author_normalization_map_claimed'] is False
          assert r['published_V0_reproduced'] is False
          assert r['original_provider_reproduced'] is False
          assert r['K3_state_ceiling']=='PARTIAL'
          assert r['K4_promoted'] is False
          assert r['K5_promoted'] is False
          assert r['physical_falsification'] is False
          print(r['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m13b-k3c1-independent-background-closure
          path: waves/wave_03_expanded_dark_energy/M13B_K3C1_INDEPENDENT_BACKGROUND_CLOSURE_RESULT.json
          retention-days: 90
      - name: Persist immutable K3C1 result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add waves/wave_03_expanded_dark_energy/M13B_K3C1_INDEPENDENT_BACKGROUND_CLOSURE_RESULT.json
          if git diff --cached --quiet; then
            echo 'K3C1 result already canonical.'
          else
            git commit -m 'record M13b K3C1 independent background closure result'
            git push
          fi
