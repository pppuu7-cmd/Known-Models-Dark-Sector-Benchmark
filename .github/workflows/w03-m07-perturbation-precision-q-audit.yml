name: W03 M07 perturbation precision q convergence audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m07-perturbation-precision-q-audit.yml'

jobs:
  q-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMEGA_SCF_TARGET: '0.682686955086854'
      SHOOT_REL_TOL: '1.0e-13'
      Q_REL_DIFF_MAX: '0.05'
      Q_ANGLE_MAX_DEG: '2.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Fetch and build pinned official CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          make -j2

      - name: Write baseline and tight perturbation configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out_base out_tight logs
          write_common () {
            local file="$1"
            local tight="$2"
            cat > "$file" <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_fld = 0
          reio_parametrization = reio_none
          output = mPk,mTk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_shooting_deltax_rel = ${SHOOT_REL_TOL}
          EOF
            if [ "$tight" = "yes" ]; then
              cat >> "$file" <<EOF
          tol_perturbations_integration = 1.0e-8
          perturbations_sampling_stepsize = 0.01
          EOF
            fi
          }
          write_common cfg/base_common.ini no
          write_common cfg/tight_common.ini yes

          make_case () {
            local tier="$1"; local common="$2"; local outdir="$3"; local lam="$4"; local tag="$5"
            local phi=1.0
            local Aseed
            Aseed=$(python3 -c 'import math,sys; lam=float(sys.argv[1]); Om=float(sys.argv[2]); h=0.67; H0=100*h/299792.458; phi=1.0; print(f"{3*Om*H0*H0*math.exp(lam*phi)-1.0:.17g}")' "$lam" "$OMEGA_SCF_TARGET")
            cp "$common" "cfg/${tier}_${tag}.ini"
            cat >> "cfg/${tier}_${tag}.ini" <<EOF
          Omega_scf = ${OMEGA_SCF_TARGET}
          scf_parameters = ${lam},0.0,${Aseed},0.0,1.0,0.0
          attractor_ic_scf = no
          scf_tuning_index = 2
          root = ${GITHUB_WORKSPACE}/${outdir}/${tag}_
          EOF
          }

          for tier in base tight; do
            if [ "$tier" = base ]; then common=cfg/base_common.ini; outdir=out_base; else common=cfg/tight_common.ini; outdir=out_tight; fi
            cp "$common" "cfg/${tier}_ref.ini"
            cat >> "cfg/${tier}_ref.ini" <<EOF
          Omega_scf = 0
          root = ${GITHUB_WORKSPACE}/${outdir}/ref_
          EOF
            make_case "$tier" "$common" "$outdir" 0.0 l0
            make_case "$tier" "$common" "$outdir" 0.025 l0025
            make_case "$tier" "$common" "$outdir" 0.075 l0075
          done

      - name: Run both precision tiers
        shell: bash
        run: |
          set +e
          for tier in base tight; do
            for tag in ref l0 l0025 l0075; do
              ./class_public/class "cfg/${tier}_${tag}.ini" > "logs/${tier}_${tag}.log" 2>&1
              echo "$?" > "logs/${tier}_${tag}.exit"
            done
          done
          exit 0

      - name: Analyze both precision tiers and q convergence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for tier in base tight; do
            python3 code/w03_m07_quintessence_probe.py \
              --directory "out_${tier}" \
              --case REF_LCDM:ref_:nan \
              --case SCF_SPLIT_L0:l0_:0.0 \
              --case M07_L0025:l0025_:0.025 \
              --case M07_L0075:l0075_:0.075 \
              --json "${tier}_result.json"
          done
          python3 - <<'PY'
          import json,math,numpy as np
          out={"schema":"KMDSB-W03-M07-q-precision-v0.1","tiers":{}}
          for tier in ('base','tight'):
              d=json.load(open(f'{tier}_result.json'))
              by={x['lambda']:np.array(x['response_vector_lnP'],float) for x in d['comparisons_to_LCDM'] if x['lambda'] not in (None,0.0)}
              a=by[0.025]/(0.025**2); b=by[0.075]/(0.075**2)
              cos=float(np.dot(a,b)/(np.linalg.norm(a)*np.linalg.norm(b)))
              cos=max(-1,min(1,cos))
              angle=math.degrees(math.acos(cos))
              rel=float(np.linalg.norm(a-b)/np.linalg.norm(b))
              out['tiers'][tier]={"qscaled_rel_difference_0025_vs_0075":rel,"qscaled_angle_deg":angle,"qscaled_norm_0025":float(np.linalg.norm(a)),"qscaled_norm_0075":float(np.linalg.norm(b))}
          json.dump(out,open('q_precision_result.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Enforce preregistered tight-tier q convergence gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for tier in base tight; do for tag in ref l0 l0025 l0075; do test "$(cat logs/${tier}_${tag}.exit)" = "0"; done; done
          python3 - "$Q_REL_DIFF_MAX" "$Q_ANGLE_MAX_DEG" <<'PY'
          import json,sys
          rmax,amax=map(float,sys.argv[1:])
          d=json.load(open('q_precision_result.json'))['tiers']['tight']
          print(d)
          if d['qscaled_rel_difference_0025_vs_0075']>rmax: raise SystemExit('tight q relative-difference gate failed')
          if d['qscaled_angle_deg']>amax: raise SystemExit('tight q angle gate failed')
          print('M07_TIGHT_PERTURBATION_Q_CONVERGENCE=PASS')
          PY

      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo "SHOOT_REL_TOL=${SHOOT_REL_TOL}"
            echo 'TIGHT_TOL_PERTURBATIONS_INTEGRATION=1e-8'
            echo 'TIGHT_PERTURBATIONS_SAMPLING_STEPSIZE=0.01'
            echo "Q_REL_DIFF_MAX=${Q_REL_DIFF_MAX}"
            echo "Q_ANGLE_MAX_DEG=${Q_ANGLE_MAX_DEG}"
          } > q_precision_provenance.txt

      - name: Upload immutable q precision bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m07-perturbation-precision-q-audit
          path: |
            base_result.json
            tight_result.json
            q_precision_result.json
            q_precision_provenance.txt
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
