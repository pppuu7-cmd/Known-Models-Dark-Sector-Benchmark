name: W04 M21 l400 edge absolute sufficiency v0.1

on:
  workflow_run:
    workflows: ['W04 M21 l400 analysis successors v0.1']
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RUN: '34907528331'

jobs:
  edge-sufficiency:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download signed-convolution result from triggering workflow
        id: cancel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-convolution-sign-cancellation-v01
          path: cancel
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - name: Decide frozen activation
        id: gate
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('cancel/M21_L400_CONVOLUTION_SIGN_CANCELLATION_RESULT.json')
          active=False
          if p.exists():
            d=json.load(open(p)); active=d.get('classification')=='M21_L400_CONVOLUTION_EDGE_CORRECTION_LOCALIZED_WITH_SCOPE'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('active='+('true' if active else 'false')+'\n')
          print('active',active)
          PY
      - name: Download clean recovery case artifacts
        if: ${{ steps.gate.outputs.active == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen absolute sufficiency audit
        if: ${{ steps.gate.outputs.active == 'true' }}
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_edge_absolute_sufficiency.py \
            components \
            cancel/M21_L400_CONVOLUTION_SIGN_CANCELLATION_RESULT.json \
            M21_L400_EDGE_ABSOLUTE_SUFFICIENCY_RESULT.json
      - name: Materialize non-authorized result
        if: ${{ steps.gate.outputs.active != 'true' }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          pathlib.Path('M21_L400_EDGE_ABSOLUTE_SUFFICIENCY_RESULT.json').write_text(json.dumps({
            'schema':'KMDSB.W04.M21.L400EdgeAbsoluteSufficiency.v0.1',
            'protocol':'protocol/W04_M21_L400_EDGE_ABSOLUTE_SUFFICIENCY_v0.1.md',
            'classification':'M21_L400_EDGE_ABSOLUTE_SUFFICIENCY_NOT_AUTHORIZED',
            'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False
          },indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-edge-absolute-sufficiency-v01
          path: M21_L400_EDGE_ABSOLUTE_SUFFICIENCY_RESULT.json
          if-no-files-found: error
          retention-days: 90
