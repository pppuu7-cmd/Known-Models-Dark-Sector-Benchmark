name: One-shot KMDSB M18 state sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sync-20260910-m18.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize M18 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          census=Path('matrices/model_family_census.csv')
          lines=census.read_text().splitlines()
          repl='F18,ghost condensate / kinetic vacuum branch,dark_energy,B,M18,BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER_SEARCH,W03,noncanonical scalar around kinetic condensate with distinctive sound-speed/stability structure,"CLASS_GSF model-1 author DGF point executes, but prospectively defined lambda=0 condensate reference branch exits 139 while LCDM and author controls pass; provider source shooting has an explicit f1~0 bracketing bug and evaluates f1/fabs(f1), so K1 is provider-specifically blocked; seek independent implementation or author-supported regular reference prescription; not a physical M18 failure"'
          lines=[repl if x.startswith('F18,') else x for x in lines]
          census.write_text('\n'.join(lines)+'\n')

          mat=Path('matrices/mandatory_properties_matrix.csv')
          lines=mat.read_text().splitlines()
          repl='F18,M18,PASS_WITH_SCOPE,BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER_SEARCH,"pinned CLASS_GSF model-1 provenance and author point are executable; prospective lambda=0 P_X=0/w=-1 condensate reference branch segfaults (exit 139) while LCDM+author controls pass. Source shooting explicitly flags f1~0 bracketing bug and contains f1/fabs(f1); no IC tuning or third-party patch is authorized. Independent implementation/reference prescription required; no physics falsification"'
          lines=[repl if x.startswith('F18,') else x for x in lines]
          mat.write_text('\n'.join(lines)+'\n')

          state=Path('recovery/STATE.md')
          s=state.read_text()
          marker='## 8. Current frontier\n'
          section='''## 7b. M18 ghost-condensate / dilatonic-ghost reference route — provider-specific K1 blocker\n\nPinned `KunhaoZhong/CLASS_GSF@07e015246c4b40f4e22bb50c9a0a63a621bb61f7`, model 1. Source implements `P=-X+c1 exp(lambda phi) X^2`; the committed author DGF point uses lambda=.2 and executes. A prospective diagnostic reference was derived before execution: lambda=0 gives shift-symmetric `P=-X+c1 X^2`, whose stationary condensate locus `P_X=0` implies `c1 X=1/2` and `w=-1`.\n\nRun `34435874904` was infrastructure-only: build PASS, then a literal output-root harness mismatch stopped before cases. Plumbing was fixed without changing lambda/IC/shooting physics. Run `34435998290`: LCDM exit 0, unchanged author DGF exit 0, lambda-zero reference exit 139 with no lambda-zero products. Canonical result: `waves/wave_03_expanded_dark_energy/M18_GHOST_CONDENSATE_REFERENCE_PROBE_RESULT.json`; audit: `models/ghost_condensate/audit.md`; immutable artifact: `w03-m18-ghost-condensate-reference-probe`.\n\nThe pinned shooting source itself comments `BUG: problem if the guess is very good (f1~0)` and for `fabs(f1)<1e-5` evaluates a step containing `f1/fabs(f1)`. Therefore the symmetric reference route is classified `BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER`, not physical ghost-condensate failure. Do not post-hoc tune ICs or patch the external solver to force K1. Search an independent implementation or author-supported numerically regular reference prescription.\n\n'''
          if '## 7b. M18 ghost-condensate' not in s:
              s=s.replace(marker,section+marker)
          s=s.replace('- F16-F18 remain W03 Tier-B queue.','- F16-F17 remain W03 Tier-B queue.\n- F18/M18 is now `BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER_SEARCH`: author DGF executes, but the prospectively defined lambda=0 condensate K1 path hits a provider shooting singularity; independent implementation/reference required.')
          s=s.replace('4. In parallel continue M13b and M15 genuine-provider searches; do not repurpose Scherrer or CPL as coverage shortcuts.\n5. Keep M11b CLASS_GSF terminal and search only independently justified covariant DE routes.', '4. In parallel continue M13b and M15 genuine-provider searches; do not repurpose Scherrer or CPL as coverage shortcuts.\n5. M18: seek a different public implementation or author-supported numerically regular condensate reference; do not patch/tune CLASS_GSF post hoc.\n6. Keep M11b CLASS_GSF terminal and search only independently justified covariant DE routes.')
          state.write_text(s)

          restore=Path('recovery/RESTORE_FROM_NEW_CHAT.md')
          s=restore.read_text()
          add='''\n### M18 ghost-condensate update (2026-09-10)\nPinned CLASS_GSF model 1 author DGF is executable, but the prospectively defined lambda=0 condensate reference (`P_X=0 -> w=-1`) fails with exit 139 in run `34435998290` while LCDM and unchanged author controls pass. The provider shooting source explicitly flags a very-good-guess `f1~0` bracketing bug and uses `f1/fabs(f1)`. Treat as `BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER`, not physics failure. Do not tune ICs or patch provider post hoc; seek independent implementation or author-supported regular reference. See `models/ghost_condensate/audit.md`.\n'''
          if '### M18 ghost-condensate update (2026-09-10)' not in s:
              s += add
          restore.write_text(s)

          log=Path('logs/research_log.md')
          s=log.read_text()
          add='''\n\n### M18 ghost-condensate reference gate\nPinned `KunhaoZhong/CLASS_GSF@07e015246c4b40f4e22bb50c9a0a63a621bb61f7` model 1. Source-level K1 candidate was frozen prospectively: at lambda=0, `P=-X+c1 X^2`, and the stationary `P_X=0` locus gives `w=-1`. First Actions run `34435874904` stopped before physics on an output-root harness mismatch; build passed. Plumbing-only repair preserved the frozen physical cases. Run `34435998290` then gave LCDM exit 0, unchanged author DGF exit 0, lambda-zero reference exit 139. The provider shooting code explicitly documents an `f1~0` bracketing bug and uses `f1/fabs(f1)` in that regime. Classification: `BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER`; K0 `PASS_WITH_SCOPE`, K1 blocked, K2-K9 not tested. No physical M18 failure and no post-hoc IC/source patch authorized.\n'''
          if '### M18 ghost-condensate reference gate' not in s:
              s += add
          log.write_text(s)

          meth=Path('protocol/FUTURE_MODEL_CONSTRUCTION_METHODOLOGY_v0.2.md')
          s=meth.read_text()
          add='''\n\n### Reference-path regularity rule (M18-derived)\nA mathematically exact symmetry/decoupling reference is not sufficient if the numerical implementation is singular precisely on that locus. Before using a reference for family promotion, require both a physically justified map and a numerically regular executable path. If a third-party shooting algorithm is singular at an exact symmetry point, classify the provider/reference as blocked and seek an independent implementation or author-supported prescription; do not perturb the reference, retune initial conditions, or patch the solver after seeing the failure merely to manufacture a passing control.\n'''
          if '### Reference-path regularity rule (M18-derived)' not in s:
              s += add
          meth.write_text(s)
          PY

          rm .github/workflows/one-shot-sync-20260910-m18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md protocol/FUTURE_MODEL_CONSTRUCTION_METHODOLOGY_v0.2.md .github/workflows/one-shot-sync-20260910-m18.yml
          git commit -m 'Synchronize M18 reference-provider blocker'
          git push origin HEAD:main
