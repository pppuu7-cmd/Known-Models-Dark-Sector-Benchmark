name: W03 M13b K3A partial-closure ledger sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3a-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical K3A result and synchronize ledgers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('.')
          result_path=root/'waves/wave_03_expanded_dark_energy/M13B_INDEPENDENT_K3A_EQUATION_CLOSURE_RESULT.json'
          r=json.loads(result_path.read_text())
          assert r['classification']=='M13B_INDEPENDENT_K3A_EQUATION_CLOSURE_PASS_WITH_SCOPE'
          assert r['all_required_checks_pass'] is True
          assert r['implementation_provenance']=='independent_KMDSB_verification'
          assert r['original_provider_reproduced'] is False
          assert r['K3_canonical_promotion'] is False
          marker='M13B_INDEPENDENT_K3A_EQUATION_CLOSURE_PASS_WITH_SCOPE'

          p=root/'matrices/mandatory_properties_matrix.csv'
          rows=list(csv.DictReader(p.open(newline='',encoding='utf-8'))); fields=list(rows[0].keys())
          for row in rows:
              if row['family_id']=='F13':
                  row['K3_conservation_gauge_closure']='PARTIAL'
                  row['coverage_state']='K0_K1_PASS_K2_PARTIAL_K3_PARTIAL_INDEPENDENT_EQUATION_CLOSURE_K3B_OPEN'
                  add=(' Independent KMDSB K3A equation-closure verifier passes all frozen sign, continuity, potential-derivative and crossing-regularity identities. '
                       'At exact kinetic cancellation rho_DE+p_DE=(phi_prime^2-psi_prime^2)/a^2=0 while direct delta_phi/delta_psi KG coefficients remain finite; the effective theta_DE denominator vanishes and is therefore diagnostic rather than a fundamental crossing variable. '
                       'Classification '+marker+'; Actions run 34780696853, job 103787057577, artifact 10325027180. This is independent equation closure only, not reproduction of the nonpublic Goh-Taylor CLASS implementation and not a self-consistent Einstein-Boltzmann K3 PASS. K3B remains required; K4/K5 stay closed.')
                  if marker not in row['notes']:
                      row['notes'] += add
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p=root/'matrices/model_family_census.csv'
          rows=list(csv.DictReader(p.open(newline='',encoding='utf-8'))); fields=list(rows[0].keys())
          for row in rows:
              if row['family_id']=='F13':
                  row['status']='BACKGROUND_TRUE_CROSSING_K1_PASS_K3A_INDEPENDENT_EQUATION_CLOSURE_PASS_K3B_OPEN'
                  add=(' Independent K3A equation closure now passes with scope (run 34780696853; artifact 10325027180): canonical/phantom stress-energy signs, background continuity, common tanh-potential derivatives and direct-field crossing regularity are verified. '
                       'This upgrades strict K3 evidence to PARTIAL only. Goh-Taylor original code provenance remains unavailable; K3B self-consistent metric/Einstein/Boltzmann embedding is open and K4/K5 are not promoted.')
                  if marker not in row['notes']:
                      row['notes'] += add+' '+marker
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          block='''\n\n## 2026-09-13 — M13b independent K3A equation closure PASS_WITH_SCOPE\n- Renewed public-provider reconnaissance found no immutable public Goh-Taylor quintom CLASS source and no alternative source-complete public two-field perturbation provider; background-only code hits remain insufficient for K3.\n- Independent-verification protocol: `protocol/W03_M13B_INDEPENDENT_K3A_EQUATION_CLOSURE_PREREGISTRATION_v0.1.md`. This implementation is explicitly not the authors' original provider.\n- Actions run `34780696853`, job `103787057577`, artifact `10325027180` (`sha256:cca8c7883551c8f37a314e8b669b3a7e90fbce17d72bdad348e3c39fd22619b0`) passes every frozen identity. Canonical result: `waves/wave_03_expanded_dark_energy/M13B_INDEPENDENT_K3A_EQUATION_CLOSURE_RESULT.json`.\n- Key crossing result: `rho_DE+p_DE=(phi_prime^2-psi_prime^2)/a^2`; at equal nonzero kinetic magnitudes the direct field KG system remains finite while the effective-fluid `theta_DE` denominator vanishes. Therefore direct field variables, not `theta_DE`, are the required crossing coordinates.\n- Canonical M13/F13 K3 is now `PARTIAL` only for independent equation/sign/continuity closure. No original-provider reproduction and no Einstein-Boltzmann K3 PASS are claimed. K3B is the next authorized gate; K4/K5 remain closed. Physical falsification=false.\n'''
          for fn in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
              q=root/fn; txt=q.read_text(encoding='utf-8')
              if marker not in txt:
                  q.write_text(txt.rstrip()+block+'\n',encoding='utf-8')
          PY
      - name: Commit synchronized M13b K3A state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          if git diff --cached --quiet; then
            echo 'M13b K3A state already synchronized.'
          else
            git commit -m 'sync M13b independent K3A partial closure'
            git push
          fi
