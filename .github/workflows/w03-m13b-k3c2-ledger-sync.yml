name: W03 M13b K3C2 perturbation-bridge ledger sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3c2-ledger-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical K3C2 result and synchronize ledgers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('.')
          rp=root/'waves/wave_03_expanded_dark_energy/M13B_K3C2_INDEPENDENT_PERTURBATION_BRIDGE_RESULT.json'
          r=json.loads(rp.read_text())
          cls='M13B_K3C2_INDEPENDENT_COSMOLOGY_PERTURBATION_BRIDGE_PASS_WITH_SCOPE'
          assert r['classification']==cls and r['all_required_checks_pass'] is True
          assert r['full_Boltzmann_hierarchy'] is False
          assert r['author_model_reproduced'] is False
          assert r['author_normalization_map_claimed'] is False
          assert r['K3_state_ceiling']=='PARTIAL'
          assert r['K4_promoted'] is False and r['K5_promoted'] is False
          assert r['physical_falsification'] is False
          marker='M13B_K3C2_COSMOLOGY_PERTURBATION_BRIDGE_PASS_2026_09_13'

          m1=r['modes']['khat_1']; m10=r['modes']['khat_10']
          c1=r['mode_checks']['khat_1']; c10=r['mode_checks']['khat_10']
          assert all(v is True for k,v in c1.items() if isinstance(v,bool))
          assert all(v is True for k,v in c10.items() if isinstance(v,bool))

          p=root/'matrices/mandatory_properties_matrix.csv'
          rows=list(csv.DictReader(p.open(newline='',encoding='utf-8'))); fields=list(rows[0].keys())
          for row in rows:
              if row['family_id']=='F13':
                  row['K3_conservation_gauge_closure']='PARTIAL'
                  row['coverage_state']='K0_K1_PASS_K2_PARTIAL_K3_PARTIAL_INDEPENDENT_COSMOLOGY_PERTURBATION_BRIDGE_PASS_FULL_BOLTZMANN_AND_AUTHOR_UNIT_BINDING_OPEN'
                  add=(' '+marker+': exact K3C1 critical-density background was extended to a same-realization standard-GR Newtonian-gauge perturbation bridge with direct canonical/phantom field perturbations plus pressureless matter and perfect radiation. Both frozen modes khat=1 and khat=10 pass every finite/constraint/refinement/coupling gate and retain the exact K3C1 crossing. For khat=1 the fine max normalized residuals are C00=2.2160517409795537e-12 and C0i=1.5345203856780278e-13; max coarse/fine perturbation endpoint mismatch is 4.136270107245643e-11. For khat=10 max endpoint mismatch is 3.496675242252953e-10 and all frozen C00/C0i preservation/refinement gates pass. Scalar perturbations are dynamically sourced in both modes; no D, rho+p or theta_DE crossing denominator is used. This is not a full photon/neutrino Boltzmann hierarchy and not author-model reproduction; K3 remains PARTIAL. K4/K5 remain closed. Run 34782092368 artifact 10325278852 sha256:bd7cbf9964be9201ab76c08bc72f4107f7b81a46f2b0ab50cc8994732f35dcc4.')
                  if marker not in row['notes']:
                      row['notes'] += add
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)

          p=root/'matrices/model_family_census.csv'
          rows=list(csv.DictReader(p.open(newline='',encoding='utf-8'))); fields=list(rows[0].keys())
          for row in rows:
              if row['family_id']=='F13':
                  row['status']='K1_BACKGROUND_TRUE_CROSSING_PASS_K3_PARTIAL_INDEPENDENT_COSMOLOGY_PERTURBATION_BRIDGE_PASS_FULL_BOLTZMANN_AUTHOR_UNIT_MAP_OPEN'
                  add=(' '+marker+': two-mode independent cosmology perturbation bridge on the exact K3C1 normalization preserves 00/0i Einstein constraints and converges across the crossing with direct field variables. Full source-complete Boltzmann hierarchy and original author normalization/source map remain open, so K3 stays PARTIAL.')
                  if marker not in row['notes']:
                      row['notes'] += add
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows)

          block='''\n\n## 2026-09-13 — M13b K3C2 independent cosmology perturbation bridge PASS_WITH_SCOPE\n- Canonical classification: `M13B_K3C2_INDEPENDENT_COSMOLOGY_PERTURBATION_BRIDGE_PASS_WITH_SCOPE`; result `waves/wave_03_expanded_dark_energy/M13B_K3C2_INDEPENDENT_PERTURBATION_BRIDGE_RESULT.json`.\n- Run `34782092368`, artifact `10325278852`, digest `sha256:bd7cbf9964be9201ab76c08bc72f4107f7b81a46f2b0ab50cc8994732f35dcc4`.\n- The exact K3C1 background (`U0=0.3362232603714306`, crossing `z=1.1978720736725847`) is unchanged. Direct canonical/phantom perturbations, Phi, pressureless matter and perfect radiation are evolved for `khat=1` and `khat=10`.\n- Both modes satisfy every frozen gate. For `khat=1`, fine max normalized residuals are `C00=2.2160517409795537e-12`, `C0i=1.5345203856780278e-13`; maximum coarse/fine endpoint perturbation mismatch is `4.136270107245643e-11`. For `khat=10`, maximum endpoint mismatch is `3.496675242252953e-10`; all C00/C0i preservation and refinement gates pass. Scalar perturbations are dynamically sourced in both modes.\n- No evolution denominator uses `D`, `rho_DE+p_DE`, or `theta_DE`; the crossing remains represented by direct field variables.\n- Scope boundary: radiation is a perfect fluid with zero anisotropic stress; there is no photon/neutrino hierarchy, recombination, transfer-function prediction, observation operator, or original Goh-Taylor solver/unit reproduction. Therefore K3 remains `PARTIAL`, not PASS; K4/K5 remain closed.\n- Next authorized gate: full independent Einstein-Boltzmann provider/adapter build search using K3C1/K3C2 as regression controls. Physical falsification=false.\n'''
          for fn in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
              q=root/fn; txt=q.read_text(encoding='utf-8')
              if marker not in txt:
                  q.write_text(txt.rstrip()+block+'\n',encoding='utf-8')
          PY
      - name: Commit synchronized K3C2 state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          if git diff --cached --quiet; then
            echo 'M13b K3C2 state already synchronized.'
          else
            git commit -m 'sync M13b K3C2 perturbation bridge pass'
            git push
          fi
