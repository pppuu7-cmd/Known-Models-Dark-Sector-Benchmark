name: W04 M21 CMB precision stage2 subgroup decomposition v0.1

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "W04 M21 CMB precision-component decomposition recovery v0.2"
    types:
      - completed

permissions:
  actions: read
  contents: read

env:
  PARENT_RUN_ID: '34869857740'
  CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
  OMP_NUM_THREADS: '1'

jobs:
  activation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      count: ${{ steps.gate.outputs.count }}
      parents: ${{ steps.gate.outputs.parents }}
    steps:
      - uses: actions/checkout@v4

      - name: Download terminal parent component aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-cmb-precision-component-decomposition-recovery-v02
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.PARENT_RUN_ID }}

      - id: gate
        name: Enforce preregistered parent activation and build subgroup matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p=Path('parent/M21_CMB_PRECISION_COMPONENT_DECOMPOSITION_RECOVERY_RESULT.json')
          d=json.loads(p.read_text())
          assert d.get('provider')=='lesgourg/class_public@e85808324f51fc694d12e3ed7439552a3c3f9540'
          assert d.get('classification')=='M21_CMB_REFERENCE_PRECISION_COMPONENT_SUFFICIENCY_IDENTIFIED', d.get('classification')
          groups=d.get('groups',{})
          sufficient={'GROUP_REMOVES_EXCURSION','GROUP_REDUCES_EXCURSION'}
          mapping={
            'G1':['G1A','G1B','G1C'],
            'G2':['G2A','G2B','G2C'],
            'G3':['G3A','G3B'],
          }
          parents=[g for g in ('G1','G2','G3') if groups.get(g,{}).get('classification') in sufficient]
          subgroups=[sg for g in parents for sg in mapping[g]]
          assert subgroups, 'parent aggregate has no sufficient group despite sufficiency classification'
          include=[{'subgroup':sg,'case':case} for sg in subgroups for case in ('ref','f2','f3','f4')]
          matrix={'include':include}
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as f:
            f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
            f.write('count='+str(len(include))+'\n')
            f.write('parents='+','.join(parents)+'\n')
          print(json.dumps({'activated_parents':parents,'activated_subgroups':subgroups,'lane_count':len(include)},indent=2))
          PY

  subgroup:
    needs: activation
    if: needs.activation.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.activation.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Execute preregistered stage2 subgroup lane
        run: |
          set -euo pipefail
          bash verification/m21/run_component_stage2_lane_v01.sh '${{ matrix.subgroup }}' '${{ matrix.case }}'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-stage2-${{ matrix.subgroup }}-${{ matrix.case }}
          path: |
            lane_meta.json
            provider_rc.txt
            stage2_${{ matrix.subgroup }}.pre
            stage2_${{ matrix.subgroup }}_merge_manifest.json
            m21_cases/${{ matrix.case }}.ini
            output/${{ matrix.case }}*.dat
            run_${{ matrix.case }}.log
            build_${{ matrix.case }}.log
          retention-days: 90

  aggregate:
    needs: [activation, subgroup]
    if: always() && needs.activation.result == 'success' && needs.subgroup.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install analyzer dependency
        run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.2.6

      - name: Download stage2 subgroup artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m21-stage2-*-*
          path: components

      - name: Download immutable terminal parent aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-cmb-precision-component-decomposition-recovery-v02
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Assemble stage2 products and apply frozen subgroup classifier
        run: |
          set -euo pipefail
          mkdir -p products meta
          shopt -s nullglob
          dirs=(components/m21-stage2-*-*)
          test "${#dirs[@]}" -gt 0
          for d in "${dirs[@]}"; do
            b="${d##*/}"
            rest="${b#m21-stage2-}"
            sg="${rest%-*}"
            c="${rest##*-}"
            sl=$(printf '%s' "$sg" | tr 'A-Z' 'a-z')
            mkdir -p "products/$sl" "meta/$sl"
            test -f "$d/lane_meta.json"
            cp "$d/lane_meta.json" "meta/$sl/$c.json"
            find "$d" -type f \
              \( -name "${c}_cl.dat" -o -name "${c}_*_cl.dat" \
                 -o -name "${c}_pk.dat" -o -name "${c}_*_pk.dat" \
                 -o -name "${c}_background.dat" -o -name "${c}_*_background.dat" \) \
              -exec cp {} "products/$sl/" \;
          done
          python3 verification/m21/cmb_precision_stage2_subgroup_decomposition.py \
            products \
            meta \
            parent/M21_CMB_PRECISION_COMPONENT_DECOMPOSITION_RECOVERY_RESULT.json \
            M21_CMB_PRECISION_STAGE2_SUBGROUP_DECOMPOSITION_RESULT.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-cmb-precision-stage2-subgroup-decomposition-v01
          path: M21_CMB_PRECISION_STAGE2_SUBGROUP_DECOMPOSITION_RESULT.json
          retention-days: 90
