name: W04 M21 l400 late-source predicate ULP audit v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m21-l400-late-source-predicate-ulp-audit-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
  RECOVERY_RUN: '34907528331'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enforce structural parent authority
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('waves/wave_04_dark_matter/M21_L400_TRANSFER_CONVOLUTION_RECOVERY_TERMINAL.json'))
          assert d['run_id']==34907528331
          assert d['classification']=='M21_L400_TRANSFER_SPIKE_CONVOLUTION_ACCUMULATION_WITH_SCOPE'
          assert d['physical_falsification'] is False
          PY
      - name: Exact-source diagnostic patch preflight
        run: |
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$PIN"
          test "$(git -C class rev-parse HEAD)" = "$PIN"
          python3 verification/m21/apply_l400_late_source_predicate_diag.py class/source/transfer.c patch_manifest.json
          test "$(git -C class diff --name-only)" = 'source/transfer.c'
          git -C class diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: m21-l400-late-source-predicate-preflight-v01
          path: patch_manifest.json
          if-no-files-found: error
          retention-days: 90

  case:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case_id: [ref, f2, f3, f4]
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable matching clean recovery parent
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-conv-case-${{ matrix.case_id }}-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Execute one independent predicate case
        id: execute
        continue-on-error: true
        run: bash verification/m21/run_l400_late_source_predicate_case_v01.sh '${{ matrix.case_id }}' parent
      - name: Preserve case metadata
        if: always()
        run: |
          if [ -f case_meta.json ]; then mv case_meta.json '${{ matrix.case_id }}_case_meta.json'; fi
      - name: Materialize blocker metadata if needed
        if: always()
        env:
          CASE_ID: ${{ matrix.case_id }}
          OUTCOME: ${{ steps.execute.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['CASE_ID']+'_case_meta.json')
          if not p.exists():
            p.write_text(json.dumps({'schema':'KMDSB.W04.M21.L400LateSourcePredicateCase.v0.1','protocol':'protocol/W04_M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_v0.1.md','case':os.environ['CASE_ID'],'authority_clean':False,'execution_outcome':os.environ['OUTCOME'],'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-late-source-predicate-${{ matrix.case_id }}-v01
          path: |
            ${{ matrix.case_id }}_case_meta.json
            late_source_${{ matrix.case_id }}.dat
            l400_late_source_predicate_patch_manifest.json
            late_source_P400_ON_TAIL_OFF_profile_manifest.json
            case_status.tsv
            run_${{ matrix.case_id }}.log
            build.log
            output/*_cl.dat
          if-no-files-found: warn
          retention-days: 90
      - name: Fail blocked case after evidence upload
        if: always()
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python3 - <<'PY'
          import json,os
          if json.load(open(os.environ['CASE_ID']+'_case_meta.json')).get('authority_clean') is not True: raise SystemExit(1)
          PY

  aggregate:
    needs: [preflight,case]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download predicate components
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-late-source-predicate-*-v01
          path: predicate_components
      - name: Download immutable clean recovery components
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: recovery_components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Apply frozen predicate/endpoint classifier
        id: analyze
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_late_source_predicate_ulp_audit.py \
            predicate_components recovery_components \
            M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_RESULT.json
      - name: Materialize aggregate blocker if needed
        if: always()
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          if [ ! -f M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_RESULT.json ]; then
            python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_RESULT.json').write_text(json.dumps({'schema':'KMDSB.W04.M21.L400LateSourcePredicateULPAudit.v0.1','protocol':'protocol/W04_M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_v0.1.md','classification':'M21_L400_LATE_SOURCE_PREDICATE_AUDIT_BLOCKED','analysis_outcome':os.environ['OUTCOME'],'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False},indent=2,sort_keys=True)+'\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-late-source-predicate-ulp-audit-v01
          path: M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_RESULT.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail only after artifact upload if blocked
        if: always()
        run: |
          python3 - <<'PY'
          import json
          if json.load(open('M21_L400_LATE_SOURCE_PREDICATE_ULP_AUDIT_RESULT.json')).get('classification','').endswith('_BLOCKED'): raise SystemExit(1)
          PY
