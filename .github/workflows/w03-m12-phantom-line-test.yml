name: W03 M12 phantom response-line audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m12-phantom-line-test.yml'
      - 'code/w03_m12_phantom_line_test.py'
      - 'protocol/W03_M12_PHANTOM_PREREGISTRATION_V0_1.md'

permissions:
  contents: write

jobs:
  phantom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check numpy
      - name: Build pinned CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2
      - name: Write cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out logs
          cat > cfg/base.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_perturbations_integration = 1e-8
          perturbations_sampling_stepsize = 0.01
          EOF
          cp cfg/base.ini cfg/lcdm.ini; echo "root = ${GITHUB_WORKSPACE}/out/lcdm_" >> cfg/lcdm.ini
          make_f(){ local tag="$1" w="$2"; cp cfg/base.ini cfg/${tag}.ini; cat >> cfg/${tag}.ini <<EOF
          Omega_Lambda = 0
          fluid_equation_of_state = CLP
          w0_fld = ${w}
          wa_fld = 0
          cs2_fld = 1
          use_ppf = yes
          root = ${GITHUB_WORKSPACE}/out/${tag}_
          EOF
          }
          make_f fld0 -1.0
          make_f np1 -0.999
          make_f np2 -0.998
          make_f ph1 -1.001
          make_f ph2 -1.002
      - name: Run and analyze
        shell: bash
        run: |
          set +e
          for tag in lcdm fld0 np1 np2 ph1 ph2; do ./class_public/class cfg/${tag}.ini > logs/${tag}.log 2>&1; echo "$?" > logs/${tag}.exit; done
          set -e
          for tag in lcdm fld0 np1 np2 ph1 ph2; do test "$(cat logs/${tag}.exit)" = 0 || { cat logs/${tag}.log; exit 2; }; done
          python3 code/w03_m12_phantom_line_test.py --directory out --json m12_phantom.json
          python3 - <<'PY'
          import json
          d=json.load(open('m12_phantom.json')); bad=[k for k,v in d['hard_gates'].items() if not v]
          if bad: raise SystemExit('M12 hard gate failure: '+','.join(bad))
          print('M12_CLASSIFICATION='+d['classification'])
          PY
      - name: Persist result race-safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main; git reset --hard origin/main
          mkdir -p waves/wave_03_expanded_dark_energy models/phantom_dark_energy
          cp m12_phantom.json waves/wave_03_expanded_dark_energy/M12_PHANTOM_LINE_RESULT.json
          cp m12_phantom.json models/phantom_dark_energy/result.json
          git add waves/wave_03_expanded_dark_energy/M12_PHANTOM_LINE_RESULT.json models/phantom_dark_energy/result.json
          if ! git diff --cached --quiet; then git commit -m 'Record M12 phantom response-line result'; git push origin HEAD:main; fi
      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m12-phantom-line-test
          path: |
            m12_phantom.json
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
