name: W04 M21 l400 support-domain extension v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m21-l400-support-domain-extension-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RUN: '34907528331'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Enforce terminal recovery authority
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('waves/wave_04_dark_matter/M21_L400_TRANSFER_CONVOLUTION_RECOVERY_TERMINAL.json'))
          assert d['run_id']==34907528331
          assert d['head_sha']=='2338fb5a4ee92c8b94a1583089465e42d164f439'
          assert d['classification']=='M21_L400_TRANSFER_SPIKE_CONVOLUTION_ACCUMULATION_WITH_SCOPE'
          assert d['artifact_digest']=='sha256:ba86f18e1a57f4b8dd16652976e0d015fb912fdaaca5848685476bf64017883e'
          assert d['physical_falsification'] is False
          PY
      - name: Download immutable recovery aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-transfer-convolution-decomposition-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Download immutable clean case diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen support-domain audit
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_support_domain_extension.py \
            components \
            parent/M21_L400_TRANSFER_CONVOLUTION_DECOMPOSITION_RESULT.json \
            M21_L400_SUPPORT_DOMAIN_EXTENSION_RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-support-domain-extension-v01
          path: M21_L400_SUPPORT_DOMAIN_EXTENSION_RESULT.json
          if-no-files-found: error
          retention-days: 90
