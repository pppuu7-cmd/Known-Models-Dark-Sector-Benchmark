name: W04 M25 m0 l_logstep convergence ladder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m25-m0-l-logstep-convergence-ladder.yml']
permissions:
  contents: write
  actions: read
jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        logstep: ['1.10','1.08','1.06','1.04','1.03','1.026','1.02']
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: w04-m25-k1-abundance-decoupling
          path: original
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34548988620
      - uses: actions/download-artifact@v4
        with:
          name: m25-ncdm-nofluid-m0
          path: baseline
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34551925134
      - name: Build pinned CLASS and frozen profile
        shell: bash
        run: |
          set -euo pipefail
          cp -a original/m25_k1_cases m25_k1_cases
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class/include/common.h'); s=p.read_text()
          assert s.count('#define _QUADRATURE_MAX_ 250')==1 and s.count('#define _QUADRATURE_MAX_BG_ 800')==1
          p.write_text(s.replace('#define _QUADRATURE_MAX_ 250','#define _QUADRATURE_MAX_ 4000').replace('#define _QUADRATURE_MAX_BG_ 800','#define _QUADRATURE_MAX_BG_ 4000'))
          PY
          make -C class -j2 > build.log 2>&1
          cat > profile.pre <<EOF
          tol_ncdm_bg = 1e-6
          tol_ncdm = 1e-6
          ncdm_fluid_approximation = 3
          l_logstep = ${{ matrix.logstep }}
          EOF
      - name: Execute four m0 cases two-at-a-time
        shell: bash
        run: |
          mkdir -p class/output logs parts
          printf '%s\n' ref e2 e3 e4 | xargs -P 2 -I{} bash -c '
            s="$1"; id="$s"; [ "$s" = ref ] || id="m0_${s}"
            set +e
            (cd class && ./class "../m25_k1_cases/${id}.ini" ../profile.pre > "../logs/${id}.log" 2>&1)
            printf "%d\n" "$?" > "parts/${s}.status"
          ' _ {}
          python3 - <<'PY'
          import json
          from pathlib import Path
          d={'build':0}; d.update({p.stem:int(p.read_text()) for p in Path('parts').glob('*.status')}); Path('status.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - name: Analyze ladder point
        shell: bash
        env:
          LOGSTEP: ${{ matrix.logstep }}
        run: |
          python3 verification/m25/m25_k1_precision_floor_diagnostic.py class m0 pk_ref status.json raw.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('raw.json')); b=json.load(open('baseline/result.json')); cmb=['CMB_TT','CMB_EE','CMB_TE']
          curves={k:[float(x) for x in r['blocks'][k]['r95']] for k in cmb}
          eta3={k:curves[k][1] for k in cmb}; base={k:float(b['blocks'][k]['r95'][1]) for k in cmb}
          improve={k:(base[k]/eta3[k] if eta3[k]>0 else float('inf')) for k in cmb}
          collapse=all(improve[k]>=5 for k in cmb)
          flat={k:(max(curves[k])/max(min(curves[k]),1e-300)) for k in cmb}; flatpass=all(flat[k]<=2.0 for k in cmb)
          r.update({'schema':'KMDSB.M25.M0LLogstepConvergencePoint.v1','preregistration':'protocol/W04_M25_M0_L_LOGSTEP_CONVERGENCE_LADDER_PREREGISTRATION_v0.1.md','l_logstep':float(os.environ['LOGSTEP']),'cmb_r95_curves':curves,'eta_0p003_p95':eta3,'baseline_eta_0p003_p95':base,'improvement_factors':improve,'excursion_collapse':collapse,'floor_spread_ratios':flat,'floor_flatness':flatpass,'K1_promoted':False,'K4_promoted':False,'physical_falsification':False})
          open('result.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m25-m0-l-logstep-${{ matrix.logstep }}
          path: |
            profile.pre
            build.log
            status.json
            result.json
            logs/
            class/output/
          retention-days: 90
  aggregate:
    needs: ladder
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m25-m0-l-logstep-*
          path: collected
      - name: Persist convergence summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          rs=sorted(rs,key=lambda r:r['l_logstep'],reverse=True)
          by={r['l_logstep']:r for r in rs}; fine=True; diffs={}
          for ch in ['CMB_TT','CMB_EE','CMB_TE']:
              vals=[]
              for j in range(3):
                  a=by.get(1.026,{}).get('cmb_r95_curves',{}).get(ch,[None]*3)[j]; b=by.get(1.02,{}).get('cmb_r95_curves',{}).get(ch,[None]*3)[j]
                  if a is None or b is None: d=float('inf')
                  else: d=2*abs(a-b)/(abs(a)+abs(b)+1e-300)
                  vals.append(d); fine &= d<=0.25
              diffs[ch]=vals
          r1026=by.get(1.026,{}); r102=by.get(1.02,{})
          stable=bool(len(rs)==7 and r1026.get('excursion_collapse') and r1026.get('floor_flatness') and r102.get('excursion_collapse') and r102.get('floor_flatness') and fine)
          s={'schema':'KMDSB.M25.M0LLogstepConvergenceLadder.Summary.v1','preregistration':'protocol/W04_M25_M0_L_LOGSTEP_CONVERGENCE_LADDER_PREREGISTRATION_v0.1.md','points':[{'l_logstep':r['l_logstep'],'eta_0p003_p95':r.get('eta_0p003_p95'),'improvement_factors':r.get('improvement_factors'),'excursion_collapse':r.get('excursion_collapse'),'floor_spread_ratios':r.get('floor_spread_ratios'),'floor_flatness':r.get('floor_flatness')} for r in rs],'fine_pair_symmetric_relative_differences':diffs,'fine_pair_stability':fine,'stable_floor_localization':stable,'classification':'M25_M0_L_LOGSTEP_STABLE_NUMERICAL_FLOOR_LOCALIZED' if stable else 'M25_M0_L_LOGSTEP_NUMERICAL_FLOOR_NOT_ESTABLISHED','K1_promoted':False,'K4_promoted':False,'physical_falsification':False,'Pk_gate':'OPEN_SEPARATE'}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n'); print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          cp /tmp/summary.json waves/wave_04_dark_matter/M25_M0_L_LOGSTEP_CONVERGENCE_LADDER_SUMMARY.json
          cp /tmp/summary.json models/resonant_sterile_neutrino_wdm/M25_M0_L_LOGSTEP_CONVERGENCE_LADDER_SUMMARY.json
          git add waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          git diff --cached --quiet || { git commit -m 'Record M25 m0 l_logstep convergence ladder'; git pull --rebase origin main; git push origin HEAD:main; }
