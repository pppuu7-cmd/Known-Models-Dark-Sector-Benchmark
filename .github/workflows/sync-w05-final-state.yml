name: Sync canonical W05 state and readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-w05-final-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize matrix and census from canonical W05 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          mp=Path('matrices/mandatory_properties_matrix.csv')
          with mp.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          by={r['benchmark_id']:r for r in rows}

          r=by['M29']
          r['K0_provenance']='PASS_WITH_SCOPE'
          r['K1_reference_limit']='PASS_WITH_SCOPE'
          r['K2_physical_geometry']='OPEN'
          r['K3_conservation_gauge_closure']='BLOCKED_IMPLEMENTATION'
          r['K4_numerical_robustness']='BLOCKED_NUMERICAL'
          for k in ['K5_multichannel_rank','K6_nearest_family_manifold','K7_common_observation_space','K8_quotient_novelty','K9_prospective_holdout']:
              r[k]='OPEN'
          r['coverage_state']='K0_K1_PASS_K3_IMPLEMENTATION_K4_FINAL_NUMERICAL_NOT_ESTABLISHED'
          r['notes']=('Brans-Dicke: pinned hi_class K0 and omega_BD->GR K1 PASS_WITH_SCOPE. K3 remains BLOCKED_IMPLEMENTATION because the required Newtonian-gauge scalar-MG branch is unavailable in the pinned provider. K4b localized the large P(k) discrepancy to high-k grid sampling; K4c showed the remaining TT comparison requires the full core precision profile. Prospectively frozen K4d final acceptance against a tighter independent super-reference preserves the original thresholds: omega_BD=1e4 passes background/P(k)/TT, while omega_BD=15 passes background and P(k) but TT fails (max 0.0070813266 > 0.005; RMS 0.0037116457 > 0.001) and fails the <=20% non-increase rule. K4 therefore remains BLOCKED_NUMERICAL / NOT_ESTABLISHED. No physical falsification; K2/K5-K9 remain open. Canonical K4d run 34638814940.')

          r=by['M32']
          r['K0_provenance']='BLOCKED_IMPLEMENTATION'
          for k in ['K1_reference_limit','K2_physical_geometry','K3_conservation_gauge_closure','K4_numerical_robustness','K5_multichannel_rank','K6_nearest_family_manifold','K7_common_observation_space','K8_quotient_novelty','K9_prospective_holdout']:
              r[k]='OPEN'
          r['coverage_state']='K0_BLOCKED_PROVIDER_BUILD_K1_K9_OPEN'
          r['notes']=('DGP: pinned nat-woodcock/EFT-Ramses provider provenance explicitly identifies self-accelerating/normal-branch DGP and Vainshtein machinery, but the exact-pin provider-native GNU MPI build exits 2 while reading amr_parameters.mod with Unexpected EOF. Canonical classification M32_K0_BLOCKED_PROVIDER_BUILD. This is a provider/build boundary, not physical falsification and not a production DGP cosmology execution; K1-K9 remain open.')

          with mp.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          cp=Path('matrices/model_family_census.csv')
          with cp.open(newline='',encoding='utf-8') as f:
              cr=list(csv.DictReader(f)); cf=list(cr[0].keys())
          cb={r['benchmark_id_or_representation']:r for r in cr}
          updates={
            'M29':('K0_K1_PASS_K3_IMPLEMENTATION_K4_NUMERICAL_NOT_ESTABLISHED','Pinned hi_class K0 and Brans-Dicke GR-limit K1 pass. K3 is provider-gauge implementation blocked. K4b localized P(k) to grid sampling; K4c required full-core precision; final K4d passes omega_BD=1e4 but fails frozen TT robustness thresholds at omega_BD=15. No physical falsification.'),
            'M30':('K0_TWO_PROVIDER_PASS_K1_K9_OPEN','K0 PASS_WITH_SCOPE from pinned hi_class Horndeski execution independently corroborated by pinned EFTCAMB native RPH versus GR control; K1-K9 open.'),
            'M31':('K0_EFFECTIVE_BH_PASS_COVARIANT_GLPV_OPEN','Pinned hi_class effective beyond-Horndeski arm gives K0 PASS_WITH_SCOPE. Covariant GLPV/DHOST closure and K1-K9 remain open.'),
            'M32':('K0_BLOCKED_PROVIDER_BUILD_K1_K9_OPEN','Pinned EFT-Ramses DGP/Vainshtein provenance is established, but provider-native GNU MPI build is blocked by amr_parameters.mod Unexpected EOF. Not physical falsification; no production DGP cosmology execution yet.'),
            'M33':('K0_COVARIANT_GALILEON_PROVIDER_PASS_K1_K9_OPEN','Pinned hi_class native cubic/covariant Galileon arm executes with finite cosmological outputs and active response; K0 PASS_WITH_SCOPE, K1-K9 open.'),
            'M40':('K0_HORAVA_EFTCAMB_PROVIDER_PASS_K1_K9_OPEN','Pinned EFTCAMB native low-energy Horava arm and GR control execute with complete finite output bundles; K0 PASS_WITH_SCOPE, K1-K9 open.')
          }
          for mid,(state,note) in updates.items():
              if mid in cb:
                  cb[mid]['status']=state
                  cb[mid]['notes']=note
          with cp.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=cf); w.writeheader(); w.writerows(cr)
          PY
      - name: Recompute readiness snapshot
        run: python3 verification/audit_matrix_readiness.py
      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add matrices/mandatory_properties_matrix.csv matrices/model_family_census.csv audits/KMDSB_READINESS_SNAPSHOT.json
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize W05 canonical states and readiness'
          git push
