name: Sync F18 v0.2 source review

on:
  push:
    branches: [main]
    paths:
      - 'waves/wave_03_expanded_dark_energy/F18_CODE_BIASED_PROVIDER_DISCOVERY_SOURCE_REVIEW_RESULT.md'
      - '.github/workflows/sync-f18-v02-source-review-20260914.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize F18 ledgers
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          cls='F18_CODE_BIASED_DISCOVERY_NO_INDEPENDENT_SOURCE_COMPLETE_PROVIDER_AFTER_MANUAL_REVIEW'
          prov='run 34820792370; aggregate artifact 10337808801; sha256:d824ba2afdcac0020e15228504f0eeeb986d0049e0a46ba5fcd43753b4cb4e78; source-review commit b415b5ab51e0a6f90c38141249c9279a28d8bcd7'
          note=(' Code-biased F18 v0.2 discovery completed all eight frozen lanes, but manual exact-source review rejected the mechanically promoted SOURCE_COMPLETE_REVIEW set as unrelated/review-analysis/non-provider code. '
                'No independent source-complete ghost-condensate background+linear-perturbation provider with a regular condensate reference map was found. '
                f'Classification {cls}; {prov}; K0/K1 not promoted; physical_falsification=false.')

          p=Path('matrices/model_family_census.csv')
          rows=list(csv.DictReader(p.open())); fields=list(rows[0].keys())
          found=False
          for r in rows:
            if r['family_id']=='F18':
              found=True
              r['status']='BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER_SEARCH'
              if cls not in r['notes']:
                r['notes'] += note
          if not found: raise SystemExit('F18 missing in census')
          with p.open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          p=Path('matrices/mandatory_properties_matrix.csv')
          rows=list(csv.DictReader(p.open())); fields=list(rows[0].keys())
          found=False
          for r in rows:
            if r['family_id']=='F18':
              found=True
              if cls not in r.get('notes',''):
                r['notes'] = r.get('notes','') + note
          if not found: raise SystemExit('F18 missing in mandatory matrix')
          with p.open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          section='''\n\n### 2026-09-14 — F18 code-biased independent-provider discovery v0.2 source review\nAction run `34820792370` completed all eight frozen code-biased lanes and the aggregate mechanically returned `F18_CODE_BIASED_SOURCE_COMPLETE_CANDIDATE_FOUND`. Manual exact-source review rejected the promoted set as unrelated Persistence-Theory/CPL code, matter-bounce verification, review-analysis scripts, or lexical/non-cosmology collisions. No independent source-complete ghost-condensate background+linear-perturbation provider with a documented regular condensate reference map was identified. Canonical classification: `F18_CODE_BIASED_DISCOVERY_NO_INDEPENDENT_SOURCE_COMPLETE_PROVIDER_AFTER_MANUAL_REVIEW`. Aggregate artifact `10337808801`, digest `sha256:d824ba2afdcac0020e15228504f0eeeb986d0049e0a46ba5fcd43753b4cb4e78`; source-review commit `b415b5ab51e0a6f90c38141249c9279a28d8bcd7`. Keep F18 `BLOCKED_IMPLEMENTATION_REFERENCE_PROVIDER_SEARCH`; K0/K1 not promoted; no physical falsification. Do not spend further capacity on broad lexical F18 search unless a new independently justified implementation or author-supported regular reference prescription appears.\n'''
          for fn in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
            q=Path(fn); txt=q.read_text()
            if cls not in txt:
              q.write_text(txt+section)
          PY
      - name: Commit synchronized ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          if git diff --cached --quiet; then
            echo 'No ledger changes needed'
          else
            git commit -m 'sync F18 v0.2 source-review blocker'
            git push
          fi
