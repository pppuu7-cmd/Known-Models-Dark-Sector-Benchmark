name: W03 M13b K3D2-B mapping-certified tau implementation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w03-m13b-k3d2b-mapping-certified-tau-implementation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

jobs:
  source_guard:
    name: S certified tau source guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact frozen stack and audit certified seam
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('result/cert_tau.json').read_text())
          s=Path('provider/source/perturbations.c').read_text()
          checks={
            'only_perturbations_changed':m.get('changed_files')==['source/perturbations.c'],
            'conditional_qfields':m.get('conditional_qfields') is True,
            'expected_12_ulps':m.get('expected_certified_tau_ulps')==12,
            'uses_actual_background_path':m.get('certification_uses_background_at_tau') is True,
            'predecessor_left_required':m.get('requires_predecessor_not_right_owned') is True,
            'candidate_right_required':m.get('requires_candidate_right_owned') is True,
            'vector_init_exact_boundary':m.get('vector_init_boundary_unchanged') is True,
            'state_unchanged':m.get('state_vector_unchanged') is True,
            'no_equation_change':m.get('changes_open_interval_equations') is False,
            'no_tolerance_change':m.get('changes_tolerances') is False,
            'no_solver_change':m.get('changes_solver_family') is False,
            'no_einstein_change':m.get('changes_einstein_sources') is False,
            'no_boltzmann_change':m.get('changes_boltzmann_hierarchy_equations') is False,
            'provisional_tau_seam_removed':'interval_start_kmdsb = nextafter(tau_handoff_kmdsb' not in s,
          }
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedTauSourceGuard.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_TAU_SOURCE_GUARD_PASS' if ok else 'M13B_K3D2B_CERTIFIED_TAU_SOURCE_GUARD_FAIL','B1_B2_B3_evaluated':False,'physical_falsification':False}
          Path('result/source_guard.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-source-guard
          path: result
          retention-days: 90

  null_control:
    name: N certified tau disabled strict null
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build upstream and certified recovered provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git base
          git -C base checkout -q "$CLASS_PIN"
          cp -a base recovered
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py recovered --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py recovered --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py recovered --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py recovered --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py recovered --manifest result/cert_tau.json
          make -C base -j2 class > result/base_build.log 2>&1
          make -C recovered -j2 class > result/recovered_build.log 2>&1
      - name: Run identical disabled controls
        shell: bash
        run: |
          set -euo pipefail
          for mode in base recovered; do
            cat > result/${mode}.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.12
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${mode}_
          EOF
            set +e
            (cd ${mode} && ./class "$GITHUB_WORKSPACE/result/${mode}.ini") > result/${mode}_stdout.txt 2> result/${mode}_stderr.txt
            rc=$?
            set -e
            echo "$rc" > result/${mode}_rc.txt
          done
      - name: Frozen strict-null gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import bisect,json,math,re
          O=Path('out'); R=Path('result')
          def one(p):
            q=sorted(O.glob(p)); assert len(q)==1,(p,q); return q[0]
          def rows(p): return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          rc0=int((R/'base_rc.txt').read_text()); rc1=int((R/'recovered_rc.txt').read_text())
          checks={'base_rc_zero':rc0==0,'recovered_rc_zero':rc1==0}; data={}
          if rc0==0 and rc1==0:
            a=rows(one('base*_pk.dat')); b=rows(one('recovered*_pk.dat')); bx=[r[0] for r in b]; by=[r[1] for r in b]
            def li(x):
              i=bisect.bisect_left(bx,x)
              if i==0:return by[0]
              if i>=len(bx):return by[-1]
              x0,x1=bx[i-1],bx[i]; y0,y1=by[i-1],by[i]
              f=(math.log(x)-math.log(x0))/(math.log(x1)-math.log(x0)); return math.exp(math.log(y0)+f*(math.log(y1)-math.log(y0)))
            common=[r for r in a if bx[0]<=r[0]<=bx[-1]]
            l2=math.sqrt(sum((r[1]-li(r[0]))**2 for r in common)/max(sum(r[1]**2 for r in common),1e-300))
            finite=bool(common) and all(r[0]>0 and r[1]>0 and all(math.isfinite(x) for x in r) for r in a+b)
            def H0(p):
              ls=p.read_text().splitlines(); h=[l for l in ls if l.lstrip().startswith('#') and 'H [1/Mpc]' in l and 'z' in l]; assert len(h)==1
              t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',h[0].lstrip('#').strip())}; rr=rows(p); q=min(rr,key=lambda z:abs(z[t['z']])); return q[t['H [1/Mpc]']]
            hb=H0(one('base*_background.dat')); hr=H0(one('recovered*_background.dat')); hd=abs(hb-hr)/max(abs(hb),abs(hr),1e-300)
            checks.update({'finite_positive_pk':finite,'pk_L2_le_1e_10':l2<=1e-10,'H0_rel_le_1e_12':hd<=1e-12}); data={'pk_normalized_L2':l2,'H0_relative_difference':hd}
          else:
            checks.update({'finite_positive_pk':False,'pk_L2_le_1e_10':False,'H0_rel_le_1e_12':False})
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedTauNull.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_TAU_NULL_PASS' if ok else 'M13B_K3D2B_CERTIFIED_TAU_NULL_FAIL','B1_B2_B3_evaluated':False,'physical_falsification':False,**data}
          (R/'null_result.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-null
          path: result
          retention-days: 90

  enabled:
    name: E certified tau ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: default
            precision: none
            prefix: cd
          - label: reference
            precision: cl_ref.pre
            prefix: cr
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build certified recovered CLASS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Execute unchanged enabled probe
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk,dTk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${{ matrix.prefix }}_
          EOF
          set +e
          if [ '${{ matrix.precision }}' = 'none' ]; then
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          else
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" '${{ matrix.precision }}') > result/stdout.txt 2> result/stderr.txt
          fi
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
      - name: Frozen implementation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,math,re
          R=Path('result'); O=Path('out'); lane='${{ matrix.label }}'; p='${{ matrix.prefix }}'
          rc=int((R/'provider_rc.txt').read_text()); diag=(R/'stdout.txt').read_text(errors='replace')+'\n'+(R/'stderr.txt').read_text(errors='replace'); low=diag.lower()
          checks={'provider_rc_zero':rc==0,'no_minimum_step':('step size too small' not in low and 'stepsize underflow' not in low),'runtime_cert_12':('KMDSB_CERT_TAU ulps=12' in diag)}
          pk=sorted(O.glob(p+'*_pk.dat')); fs=sorted(O.glob(p+'*_perturbations_k*_s.dat')); checks.update({'one_pk':len(pk)==1,'two_trajectories':len(fs)==2})
          data={'provider_rc':rc,'solver_lane':lane}
          if rc==0 and len(pk)==1 and len(fs)==2:
            def rows(q): return [[float(x) for x in l.split()] for l in q.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
            pr=rows(pk[0]); checks['pk_finite_positive']=bool(pr) and all(r[0]>0 and r[1]>0 and all(math.isfinite(x) for x in r) for r in pr)
            hierarchy=True; finiteall=True; nonzero=True; modes=[]
            for f in fs:
              ls=f.read_text().splitlines(); hs=[l for l in ls if l.lstrip().startswith('#') and 'delta_qcf_S' in l and 'delta_qpf_S' in l]; assert len(hs)==1,(f,hs)
              t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}; req=['delta_qcf_S','delta_prime_qcf_S','delta_qpf_S','delta_prime_qpf_S']; hierarchy=hierarchy and all(k in t for k in req)
              rr=rows(f); finite=bool(rr) and all(all(math.isfinite(x) for x in r) for r in rr); finiteall=finiteall and finite
              qcf=max([abs(r[t['delta_qcf_S']]) for r in rr]+[abs(r[t['delta_prime_qcf_S']]) for r in rr]); qpf=max([abs(r[t['delta_qpf_S']]) for r in rr]+[abs(r[t['delta_prime_qpf_S']]) for r in rr]); nonzero=nonzero and qcf>0 and qpf>0; modes.append({'file':f.name,'rows':len(rr),'qcf_max':qcf,'qpf_max':qpf})
            checks.update({'hierarchy_columns_present':hierarchy,'all_trajectory_values_finite':finiteall,'qcf_qpf_nonzero':nonzero}); data.update({'pk_rows':len(pr),'modes':modes})
          else:
            checks.update({'pk_finite_positive':False,'hierarchy_columns_present':False,'all_trajectory_values_finite':False,'qcf_qpf_nonzero':False})
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedTauEnabledLane.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_TAU_ENABLED_PASS' if ok else 'M13B_K3D2B_CERTIFIED_TAU_ENABLED_FAIL','B1_B2_B3_evaluated':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False,**data}
          (R/'lane_result.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-${{ matrix.label }}
          path: |
            result
            out
          retention-days: 90

  verdict:
    name: V certified tau implementation verdict
    needs:
      - source_guard
      - null_control
      - enabled
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-source-guard
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-null
          path: null
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-default
          path: default
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-reference
          path: reference
      - name: Freeze implementation verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('source/source_guard.json').read_text()); n=json.loads(Path('null/null_result.json').read_text()); d=json.loads(Path('default/result/lane_result.json').read_text()); r=json.loads(Path('reference/result/lane_result.json').read_text())
          checks={'source_guard_pass':s['all_required_checks_pass'],'strict_null_pass':n['all_required_checks_pass'],'default_pass':d['all_required_checks_pass'],'reference_pass':r['all_required_checks_pass']}; ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedTauImplementationVerdict.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_MAPPING_CERTIFIED_TAU_IMPLEMENTATION_PASS_WITH_SCOPE' if ok else 'M13B_K3D2B_MAPPING_CERTIFIED_TAU_IMPLEMENTATION_NOT_ESTABLISHED','authorizes_full_B1_B2_B3_regression':ok,'B1_B2_B3_evaluated':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False}
          Path('verdict.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-verdict
          path: verdict.json
          retention-days: 90
