name: W03 M13b K3D2-E RK error component audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w03-m13b-k3d2e-rk-error-component-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

jobs:
  source_guard:
    name: S component-probe source guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reference stack and diagnostic component probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result
          sha256sum provider/cl_ref.pre > result/cl_ref_before.sha256
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2c_apply_self_consistent_gauge_ivp.py provider --manifest result/fixed_ivp.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/output_diag.json
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry.json
          python3 verification/m13b/k3d2b_apply_direct_mode_failure_trace.py provider --manifest result/failure_trace.json
          python3 verification/m13b/k3d2e_apply_rk_error_component_probe.py provider --manifest result/component_probe.json
          sha256sum provider/cl_ref.pre > result/cl_ref_after.sha256
          set +e
          make -C provider -j2 class > result/build.log 2>&1
          brc=$?
          set -e
          echo "$brc" > result/build_rc.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          R=Path('result'); M=json.loads((R/'component_probe.json').read_text()); C=json.loads((R/'cert_tau.json').read_text()); F=json.loads((R/'fixed_ivp.json').read_text()); pre=Path('provider/cl_ref.pre').read_text()
          checks={
            'build_rc_zero':int((R/'build_rc.txt').read_text())==0,
            'cl_ref_unchanged':(R/'cl_ref_before.sha256').read_text()==(R/'cl_ref_after.sha256').read_text(),
            'cl_ref_RK':bool(re.search(r'^\s*evolver\s*=\s*0\s*$',pre,re.M)),
            'cl_ref_tol_1e_6':bool(re.search(r'^\s*tol_perturbations_integration\s*=\s*1\.e-6\s*$',pre,re.M)),
            'certified_12_ulps':C.get('expected_certified_tau_ulps')==12,
            'fixed_point_unchanged':F.get('algorithm')=='pure_undamped_picard' and F.get('max_iterations')==16 and F.get('identity_raw_tolerance')==1e-12,
            'diagnostic_only':M.get('diagnostic_only') is True,
            'original_errmax_preserved':M.get('preserves_original_errmax_calculation') is True,
            'duplicate_scan_only':M.get('duplicate_component_scan_only') is True,
            'no_equation_change':M.get('changes_equations') is False,
            'no_state_change':M.get('changes_state_vector') is False,
            'no_tolerance_change':M.get('changes_tolerances') is False,
            'no_minimum_change':M.get('changes_minimum_variation') is False,
            'no_solver_logic_change':M.get('changes_solver_logic') is False,
            'no_solver_family_change':M.get('changes_solver_family') is False,
          }
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2ERKErrorComponentSourceGuard.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2E_COMPONENT_PROBE_SOURCE_GUARD_PASS' if ok else 'M13B_K3D2E_COMPONENT_PROBE_SOURCE_GUARD_FAIL','physical_falsification':False}
          (R/'source_guard.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2e-component-source-guard
          path: result
          retention-days: 90

  reference:
    name: R exact cl_ref component-attribution execution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact instrumented reference provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2c_apply_self_consistent_gauge_ivp.py provider --manifest result/fixed_ivp.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/output_diag.json
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry.json
          python3 verification/m13b/k3d2b_apply_direct_mode_failure_trace.py provider --manifest result/failure_trace.json
          python3 verification/m13b/k3d2e_apply_rk_error_component_probe.py provider --manifest result/component_probe.json
          set +e
          make -C provider -j2 class > result/build.log 2>&1
          echo "$?" > result/build_rc.txt
          set -e
      - name: Execute exact cl_ref.pre unchanged
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/ref_
          EOF
          if [ "$(cat result/build_rc.txt)" -ne 0 ]; then
            echo 125 > result/provider_rc.txt; : > result/stdout.txt; : > result/stderr.txt; exit 0
          fi
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2e-component-reference-raw
          path: |
            result
            out
          retention-days: 90

  analyze:
    name: A frozen RK component attribution verdict
    needs:
      - source_guard
      - reference
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2e-component-source-guard
          path: lanes/source
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2e-component-reference-raw
          path: lanes/reference
      - name: Parse first/final Cash-Karp dominant components
        shell: bash
        run: |
          set -euo pipefail
          source_guard_file=$(find lanes/source -name source_guard.json -type f | head -1)
          test -n "$source_guard_file"
          mkdir -p result
          python3 verification/m13b/k3d2e_parse_rk_error_components.py \
            --result lanes/reference/result \
            --source-guard "$source_guard_file" \
            --out result/component_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2e-component-audit
          path: result
          retention-days: 90
