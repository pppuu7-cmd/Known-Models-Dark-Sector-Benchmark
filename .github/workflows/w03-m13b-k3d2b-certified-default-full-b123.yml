name: W03 M13b K3D2-B certified default full B1 B2 B3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w03-m13b-k3d2b-certified-default-full-b123.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

jobs:
  source_audit:
    name: S certified default scientific source audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact certified scientific stack
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          bg=Path('provider/source/background.c').read_text(); pt=Path('provider/source/perturbations.c').read_text()
          A=json.loads(Path('result/adapter.json').read_text()); C=json.loads(Path('result/cert_tau.json').read_text()); D=json.loads(Path('result/diag.json').read_text())
          checks={
            'upstream_scf_preserved':A['upstream_scf_lines_byte_sequence_preserved'],
            'four_background_handoff_guards':bg.count('a <= exp(log(1./6.))')==4,
            'two_perturbation_handoff_guards':pt.count('a <= exp(log(1./6.))')==2,
            'certified_exact_12_ulps':C.get('expected_certified_tau_ulps')==12,
            'certified_background_at_tau':C.get('certification_uses_background_at_tau') is True,
            'state_unchanged':C.get('state_vector_unchanged') is True,
            'qcf_force_sign':'- a*dV_qcf(pba,y[pba->index_bi_phi_qcf])/H;' in bg,
            'qpf_force_sign':'+ a*dV_qpf(pba,y[pba->index_bi_psi_qpf])/H;' in bg,
            'qcf_mass_sign':'(k2 + a2*pvecback[pba->index_bg_ddV_qcf])*y[pv->index_pt_phi_qcf]' in pt,
            'qpf_mass_sign':'(k2 - a2*pvecback[pba->index_bg_ddV_qpf])*y[pv->index_pt_psi_qpf]' in pt,
            'diagnostics_output_only':D['output_only'] and not D['changes_rhs'] and not D['changes_state_vector'] and not D['changes_einstein_sources'] and not D['changes_boltzmann_hierarchy'] and not D['changes_background'],
          }
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedDefaultFullSourceAudit.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_DEFAULT_FULL_SOURCE_AUDIT_PASS' if ok else 'M13B_K3D2B_CERTIFIED_DEFAULT_FULL_SOURCE_AUDIT_FAIL','physical_falsification':False}
          Path('result/source_audit.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-default-source-audit
          path: result
          retention-days: 90

  default_full:
    name: D certified default full scientific run
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact certified scientific provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run frozen full Boltzmann cosmology
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/default_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then cat result/stderr.txt; cat result/stdout.txt; exit "$rc"; fi
      - name: Run unchanged frozen B1 B2 B3 verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/m13b/k3d2b_verify_full_default.py --out out --result result --canonical waves/wave_03_expanded_dark_energy/M13B_K3C2_INDEPENDENT_PERTURBATION_BRIDGE_RESULT.json --prefix default
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-default-full
          path: |
            result
            out
          retention-days: 90

  verdict:
    name: V certified default B1 B2 B3 verdict
    needs:
      - source_audit
      - default_full
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-default-source-audit
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-default-full
          path: default
      - name: Freeze default-only scientific classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          S=json.loads(Path('source/source_audit.json').read_text())
          D=json.loads(Path('default/result/default_verify.json').read_text())
          checks={'source_audit':S['all_required_checks_pass'],'B1':D['B1']['all_required_checks_pass'],'B2_default':D['B2_default']['all_required_checks_pass'],'B3':D['B3']['all_required_checks_pass']}
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedDefaultFullB123Verdict.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_DEFAULT_FULL_B123_PASS_WITH_SCOPE' if ok else 'M13B_K3D2B_CERTIFIED_DEFAULT_FULL_B123_GAP','default_B1_B2_B3_evaluated':True,'default_B1_B2_B3_pass':ok,'reference_precision_robustness_established':False,'full_two_precision_regression_established':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'author_model_reproduced':False,'published_V0_reproduced':False,'author_normalization_map_claimed':False,'physical_falsification':False}
          Path('verdict.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-default-full-verdict
          path: verdict.json
          retention-days: 90
