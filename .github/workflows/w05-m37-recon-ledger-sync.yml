name: W05 M37 recon ledger sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w05-m37-recon-ledger-sync.yml'
      - 'verification/ledger_sync/w05_m37_recon_sync.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply deterministic ledger patch
        run: python3 verification/ledger_sync/w05_m37_recon_sync.py
      - name: Commit synchronized ledgers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync M37 and provider reconnaissance evidence'
          git pull --rebase origin main
          git push origin HEAD:main
