name: W03 M07 small-lambda order audit tight precision

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m07-small-lambda-order-tight.yml'

jobs:
  order-tight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMEGA_SCF_TARGET: '0.682686955086854'
      SHOOT_REL_TOL: '1.0e-13'
      OMEGA_TOL: '1.0e-6'
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Fetch and build pinned official CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2
      - name: Write unchanged grid at independently validated tight perturbation tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out logs
          cat > cfg/common.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_fld = 0
          reio_parametrization = reio_none
          output = mPk,mTk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_shooting_deltax_rel = ${SHOOT_REL_TOL}
          tol_perturbations_integration = 1.0e-8
          perturbations_sampling_stepsize = 0.01
          input_verbose = 1
          EOF
          cp cfg/common.ini cfg/ref.ini
          cat >> cfg/ref.ini <<EOF
          Omega_scf = 0
          root = ${GITHUB_WORKSPACE}/out/ref_
          EOF
          make_scf () {
            local lam="$1"; local tag="$2"; local Aseed
            Aseed=$(python3 -c 'import math,sys; lam=float(sys.argv[1]); Om=float(sys.argv[2]); h=0.67; H0=100*h/299792.458; print(f"{3*Om*H0*H0*math.exp(lam)-1.0:.17g}")' "$lam" "$OMEGA_SCF_TARGET")
            cp cfg/common.ini "cfg/${tag}.ini"
            cat >> "cfg/${tag}.ini" <<EOF
          Omega_scf = ${OMEGA_SCF_TARGET}
          scf_parameters = ${lam},0.0,${Aseed},0.0,1.0,0.0
          attractor_ic_scf = no
          scf_tuning_index = 2
          root = ${GITHUB_WORKSPACE}/out/${tag}_
          EOF
          }
          make_scf 0.0 l0
          make_scf 0.005 l0005
          make_scf 0.010 l0010
          make_scf 0.020 l0020
          make_scf 0.040 l0040
      - name: Run all cases
        shell: bash
        run: |
          set +e
          for tag in ref l0 l0005 l0010 l0020 l0040; do
            ./class_public/class "cfg/${tag}.ini" > "logs/${tag}.log" 2>&1
            echo "$?" > "logs/${tag}.exit"
          done
          exit 0
      - name: Analyze with unchanged preregistered order criteria
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 code/w03_m07_quintessence_probe.py \
            --directory out \
            --case REF_LCDM:ref_:nan \
            --case SCF_SPLIT_L0:l0_:0.0 \
            --case M07_L0005:l0005_:0.005 \
            --case M07_L0010:l0010_:0.010 \
            --case M07_L0020:l0020_:0.020 \
            --case M07_L0040:l0040_:0.040 \
            --json tight_order_probe_result.json
          python3 code/w03_m07_small_lambda_order_audit.py tight_order_probe_result.json --json tight_order_result.json
      - name: Enforce unchanged science gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for tag in ref l0 l0005 l0010 l0020 l0040; do test "$(cat logs/${tag}.exit)" = 0; done
          test -f tight_order_result.json
          python3 - <<'PY'
          import json
          d=json.load(open('tight_order_result.json'))
          if d['verdict']!='PASS_WITH_SCOPE': raise SystemExit(d['verdict'])
          print('M07_TIGHT_SMALL_LAMBDA_ORDER=PASS_WITH_SCOPE')
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo 'TOL_PERTURBATIONS_INTEGRATION=1e-8'
            echo 'PERTURBATIONS_SAMPLING_STEPSIZE=0.01'
            echo 'SCIENCE_GATES=unchanged_from_M07_SMALL_LAMBDA_ORDER_PREREGISTRATION'
            echo 'PRECISION_JUSTIFICATION_RUN=34359536106'
          } > tight_order_provenance.txt
      - name: Upload immutable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m07-small-lambda-order-tight
          path: |
            tight_order_probe_result.json
            tight_order_result.json
            tight_order_provenance.txt
            cfg/
            logs/
            waves/wave_03_expanded_dark_energy/M07_SMALL_LAMBDA_ORDER_PREREGISTRATION.md
            waves/wave_03_expanded_dark_energy/M07_SMALL_LAMBDA_TIGHT_RERUN_PROTOCOL.md
          if-no-files-found: error
          retention-days: 90
