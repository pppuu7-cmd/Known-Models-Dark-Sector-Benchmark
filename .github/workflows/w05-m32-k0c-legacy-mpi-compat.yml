name: W05 M32 DGP K0c legacy MPI compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w05-m32-k0c-legacy-mpi-compat.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROVIDER_PIN: 849ddb716041316d0e223ba22badc0d630b72435
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen GNU MPI toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran openmpi-bin libopenmpi-dev
      - name: Exact-pin clean serial build with frozen legacy compatibility flag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m32k0c
          git clone -q https://github.com/nat-woodcock/EFT-Ramses.git provider
          cd provider
          git checkout -q --detach "$PROVIDER_PIN"
          ACTUAL=$(git rev-parse HEAD)
          echo "$ACTUAL" > ../m32k0c/provider_head.txt
          if [ "$ACTUAL" = "$PROVIDER_PIN" ]; then echo 0 > ../m32k0c/pin_test_exit.txt; else echo 1 > ../m32k0c/pin_test_exit.txt; fi
          if grep -Eqi 'self-accelerating DGP|normal-branch DGP|DGP braneworld' README.md; then echo 0 > ../m32k0c/dgp_provenance_exit.txt; else echo 1 > ../m32k0c/dgp_provenance_exit.txt; fi
          gfortran --version | head -1 > ../m32k0c/gfortran_version.txt
          mpif90 --version | head -1 > ../m32k0c/mpif90_version.txt
          cd bin
          find . -maxdepth 1 -type f \( -name '*.o' -o -name '*.mod' \) -printf '%f %s\n' | sort > ../../m32k0c/tracked_build_products_before.txt
          rm -f -- *.o *.mod
          set +e
          make \
            F90='mpif90 -frecord-marker=4 -O3 -ffree-line-length-none -g -fbacktrace' \
            FFLAGS='-x f95-cpp-input $(DEFINES) -fallow-argument-mismatch' \
            > ../../m32k0c/build_stdout.log 2> ../../m32k0c/build_stderr.log
          RC=$?
          set -e
          echo "$RC" > ../../m32k0c/build_exit_code.txt
          if test -x ramses3d; then echo 0 > ../../m32k0c/executable_test_exit.txt; else echo 1 > ../../m32k0c/executable_test_exit.txt; fi
          find . -maxdepth 1 -type f \( -name '*.o' -o -name '*.mod' -o -name 'ramses3d' \) -printf '%f %s\n' | sort > ../../m32k0c/build_products_after_make.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m32-k0c-legacy-mpi-compat-probe
          path: m32k0c
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m32-k0c-legacy-mpi-compat-probe
          path: m32k0c
      - name: Frozen K0c classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('m32k0c')
          def iv(n,d=999):
              try:return int((p/n).read_text().strip())
              except:return d
          pin=(p/'provider_head.txt').read_text().strip() if (p/'provider_head.txt').exists() else None
          exact=pin=='849ddb716041316d0e223ba22badc0d630b72435'
          prov=iv('dgp_provenance_exit.txt')==0
          rc=iv('build_exit_code.txt')
          exe=iv('executable_test_exit.txt')==0
          if not exact or not prov:
              c='M32_K0C_BLOCKED_PROVENANCE'
          elif rc!=0 or not exe:
              c='M32_K0C_LEGACY_MPI_COMPAT_STILL_BLOCKED'
          else:
              c='M32_K0C_PROVIDER_BUILD_RECOVERED_WITH_GNU_LEGACY_COMPAT'
          out={
            'schema':'m32_dgp_k0c_legacy_mpi_compat_v0.1',
            'provider':'nat-woodcock/EFT-Ramses',
            'provider_commit':'849ddb716041316d0e223ba22badc0d630b72435',
            'classification':c,
            'checks':{'exact_pin':exact,'dgp_provenance':prov,'build_exit_code':rc,'native_executable_exists':exe},
            'compiler_compatibility_flag':'-fallow-argument-mismatch',
            'K0_promoted':False,
            'physical_falsification':False,
            'scope':'build-only compiler-compatibility recovery; no source or physics change; native DGP production execution and reference/control still required before K0 promotion'
          }
          q=pathlib.Path('waves/wave_05_modified_gravity/M32_K0C_LEGACY_MPI_COMPAT_RESULT.json')
          q.parent.mkdir(parents=True,exist_ok=True)
          q.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m32-k0c-legacy-mpi-compat-aggregate
          path: |
            waves/wave_05_modified_gravity/M32_K0C_LEGACY_MPI_COMPAT_RESULT.json
            m32k0c/build_stdout.log
            m32k0c/build_stderr.log
            m32k0c/gfortran_version.txt
            m32k0c/mpif90_version.txt
            m32k0c/tracked_build_products_before.txt
            m32k0c/build_products_after_make.txt
          retention-days: 30
