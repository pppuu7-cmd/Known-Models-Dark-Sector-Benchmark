name: W03 F18 independent ghost-condensate provider discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-f18-independent-ghost-condensate-provider-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL: protocol/W03_F18_INDEPENDENT_GHOST_CONDENSATE_PROVIDER_DISCOVERY_v0.1.md

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {lane: 0, q: '"ghost condensate" CLASS cosmology'}
          - {lane: 1, q: '"ghost condensate" CAMB cosmology'}
          - {lane: 2, q: '"dilatonic ghost condensate" code'}
          - {lane: 3, q: '"P=-X" "X^2" cosmology'}
          - {lane: 4, q: '"P_X" "ghost condensate" perturbation'}
          - {lane: 5, q: '"ghost condensate" Boltzmann perturbation'}
          - {lane: 6, q: '"kinetic condensate" cosmology perturbation'}
          - {lane: 7, q: '"dilatonic ghost" CLASS_GSF'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen source search
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          QUERY: ${{ matrix.q }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import base64,json,os,re,time,urllib.error,urllib.parse,urllib.request
          lane=int(os.environ['LANE']); q=os.environ['QUERY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'KMDSB-F18'}
          def get(url,attempts=6):
              last=None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: return json.load(r)
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code not in (403,429): raise
                      time.sleep(float(e.headers.get('Retry-After') or min(60,5*(2**i))))
                  except Exception as e:
                      last=e; time.sleep(min(30,3*(i+1)))
              raise last
          try: sr=get('https://api.github.com/search/code?q='+urllib.parse.quote(q)+'&per_page=20')
          except Exception as e:
              json.dump({'lane':lane,'query':q,'status':'SEARCH_ERROR','error':repr(e),'candidates':[]},open(f'out/lane_{lane}.json','w'),indent=2); raise SystemExit(0)
          cand=[]
          for item in sr.get('items',[]):
              repo=item['repository']['full_name']; path=item['path']
              try:
                  obj=get(item['url']); text=base64.b64decode(obj.get('content','')).decode('utf-8','replace') if obj.get('encoding')=='base64' else ''
              except Exception as e:
                  cand.append({'repository':repo,'path':path,'priority':'FETCH_BLOCKED','fetch_error':repr(e)}); continue
              low=text.lower()
              law=bool(re.search(r'ghost[ _-]?condens|dilatonic[ _-]?ghost|kinetic[ _-]?condens|p[_ ]?x|p\s*=\s*-\s*x',low))
              cosmo=bool(re.search(r'cosmolog|friedmann|hubble|omega[_ ]?[mcd]|background',low))
              perturb=bool(re.search(r'perturb|boltzmann|synchronous|newtonian gauge|class|camb',low))
              executable=bool(re.search(r'def |class |subroutine|module |#include|int main|double |float |numpy|scipy',text,re.I))
              toy=bool(re.search(r'\btoy\b|scaffolding|not implemented|placeholder',low))
              lineage=('class_gsf' in low or 'kunhaozhong/class_gsf' in low)
              source_complete=law and cosmo and perturb and executable and not toy and not lineage
              priority='SOURCE_COMPLETE_REVIEW' if source_complete else ('PROVENANCE_LEAD' if law and cosmo and not lineage else 'REJECT')
              cand.append({'repository':repo,'path':path,'html_url':item.get('html_url'),'blob_sha':item.get('sha'),'signals':{'law':law,'cosmology':cosmo,'perturbation':perturb,'executable':executable,'toy':toy,'same_class_gsf_lineage':lineage},'priority':priority})
          json.dump({'lane':lane,'query':q,'status':'OK','total_count':sr.get('total_count',0),'candidates':cand},open(f'out/lane_{lane}.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f18-provider-lane-${{ matrix.lane }}
          path: out/lane_${{ matrix.lane }}.json

  aggregate:
    if: always()
    needs: [search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f18-provider-lane-*
          path: lanes
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json
          rows=[json.load(open(p)) for p in sorted(glob.glob('lanes/lane_*.json'))]
          allc=sum((r.get('candidates',[]) for r in rows),[])
          sc=[x for x in allc if x.get('priority')=='SOURCE_COMPLETE_REVIEW']; leads=[x for x in allc if x.get('priority')=='PROVENANCE_LEAD']
          errors=[r for r in rows if r.get('status')!='OK']; missing=max(0,8-len(rows))
          if sc: cl='F18_INDEPENDENT_PROVIDER_SOURCE_COMPLETE_CANDIDATE_FOUND'
          elif leads: cl='F18_INDEPENDENT_PROVIDER_PROVENANCE_LEADS_ONLY'
          elif len(errors)+missing==8: cl='F18_INDEPENDENT_PROVIDER_DISCOVERY_INFRASTRUCTURE_BLOCKED'
          else: cl='F18_INDEPENDENT_PROVIDER_NO_QUALIFYING_PUBLIC_SOURCE_IN_FROZEN_TRANCHE'
          out={'schema':'KMDSB.W03.F18IndependentProviderDiscovery.v0.1','protocol':'protocol/W03_F18_INDEPENDENT_GHOST_CONDENSATE_PROVIDER_DISCOVERY_v0.1.md','classification':cl,'source_complete_candidates':sc,'provenance_leads':leads,'lane_results':rows,'missing_lane_count':missing,'search_error_count':len(errors),'K0_promoted':False,'K1_promoted':False,'physical_falsification':False}
          json.dump(out,open('f18_provider_discovery_aggregate.json','w'),indent=2)
          print(json.dumps({'classification':cl,'source_complete':len(sc),'leads':len(leads),'errors':len(errors),'missing':missing},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f18-independent-provider-discovery-aggregate
          path: f18_provider_discovery_aggregate.json
