name: W03 M13b K3D2-B background and full-Boltzmann lanes

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2b-background-boltzmann.yml'
      - 'protocol/W03_M13B_K3D2B_ENABLED_TWO_FIELD_COSMOLOGY_REGRESSION_v0.1.md'

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

permissions:
  contents: write

jobs:
  default_run:
    name: B1 + B2 default enabled qcf+qpf
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-pin adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/patch_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run frozen enabled cosmology
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          overwrite_root = yes
          root = $GITHUB_WORKSPACE/out/default_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then
            echo 'ENABLED STDERR:'; cat result/stderr.txt
            echo 'ENABLED STDOUT:'; cat result/stdout.txt
            exit "$rc"
          fi
      - name: Frozen B1 background gates and B2 default finiteness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,math,json,os
          out=pathlib.Path('out')
          bg=sorted(out.glob('default*_background.dat')); pk=sorted(out.glob('default*_pk.dat')); cl=sorted(out.glob('default*_cl.dat'))
          assert len(bg)==len(pk)==len(cl)==1,(bg,pk,cl)

          def table(path):
              rows=[]; header=[]
              for line in path.read_text().splitlines():
                  if line.lstrip().startswith('#'):
                      header.append(line)
                  elif line.strip():
                      rows.append([float(x) for x in line.split()])
              assert rows
              return header,rows
          hlines,rows=table(bg[0])
          # CLASS background title line uses numbered '<n>:<title>' tokens.
          joined=' '.join(x.lstrip('#').strip() for x in hlines)
          pairs=[]
          for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',joined):
              pairs.append((int(m.group(1))-1,m.group(2).strip()))
          titles={title:i for i,title in pairs}
          def idx_exact(name):
              if name in titles:return titles[name]
              raise AssertionError((name,sorted(titles)))
          iz=idx_exact('z'); iH=idx_exact('H [1/Mpc]')
          ix=idx_exact('phi_qcf'); ixp=idx_exact("phi'_qcf")
          iy=idx_exact('psi_qpf'); iyp=idx_exact("psi'_qpf")
          irq=idx_exact('(.)rho_qcf'); irp=idx_exact('(.)rho_qpf')
          ipq=idx_exact('(.)p_qcf'); ipp=idx_exact('(.)p_qpf')
          H0=67.15/299792.458
          pts=[]
          for r in rows:
              z=r[iz]; a=1/(1+z); H=r[iH]
              p=r[ixp]/(a*H); q=r[iyp]/(a*H)
              pts.append({'z':z,'a':a,'H':H,'E':H/H0,'x':r[ix],'p':p,'y':r[iy],'q':q,'D':p*p-q*q,'rhoqcf':r[irq],'rhoqpf':r[irp],'pqcf':r[ipq],'pqpf':r[ipp]})
          pts.sort(key=lambda d:d['z'])
          def interp(z,key):
              candidates=pts
              for a,b in zip(candidates[:-1],candidates[1:]):
                  if a['z']<=z<=b['z']:
                      if b['z']==a['z']: return a[key]
                      f=(z-a['z'])/(b['z']-a['z']); return a[key]+f*(b[key]-a[key])
              raise AssertionError(('z outside table',z,pts[0]['z'],pts[-1]['z']))
          z5={k:interp(5.0,k) for k in ('x','p','y','q','D','E')}
          today=min(pts,key=lambda d:abs(d['z']))
          # Find negative-to-positive D crossing while time moves from z=5 toward 0.
          evo=[p for p in pts if 0<=p['z']<=5]
          evo.sort(key=lambda d:d['z'],reverse=True)
          crosses=[]
          for a,b in zip(evo[:-1],evo[1:]):
              if a['D']<0<=b['D']:
                  f=(-a['D'])/(b['D']-a['D']) if b['D']!=a['D'] else 0
                  crosses.append(a['z']+f*(b['z']-a['z']))
          near49={k:interp(4.9,k) for k in ('D',)}
          OmegaDE=(today['rhoqcf']+today['rhoqpf'])/(today['H']*today['H'])
          ref={'zx':1.1978720736725847,'x':1.3910277872721561,'p':0.3117003532815687,'y':0.7979144626637236,'q':-0.02751848184245475,'OmegaDE':0.6885076999845492}
          checks={
            'provider_rc_zero':pathlib.Path('result/provider_rc.txt').read_text().strip()=='0',
            'finite_background':all(all(math.isfinite(v) for v in p.values()) and p['H']>0 for p in pts),
            'z5_x_frozen':abs(z5['x']-0.92)<=2e-4,
            'z5_y_frozen':abs(z5['y']-1.02)<=2e-4,
            'z5_p_small':abs(z5['p'])<=2e-3,
            'z5_q_small':abs(z5['q'])<=2e-3,
            'one_crossing':len(crosses)==1,
            'crossing_matches_K3C1':len(crosses)==1 and abs(crosses[0]-ref['zx'])<=0.02,
            'today_x_matches':abs(today['x']-ref['x'])<=5e-3,
            'today_y_matches':abs(today['y']-ref['y'])<=5e-3,
            'today_p_matches':abs(today['p']-ref['p'])<=5e-3,
            'today_q_matches':abs(today['q']-ref['q'])<=2e-3,
            'E0_closure':abs(today['E']-1)<=3e-3,
            'OmegaDE0_closure':abs(OmegaDE-ref['OmegaDE'])<=3e-3,
            'phantom_phase_after_start':near49['D']<0,
            'quintessence_phase_today':today['D']>0,
          }
          # CMB/Pk default finiteness
          _,pkrows=table(pk[0]); _,clrows=table(cl[0])
          checks.update({
            'pk_finite_positive':all(len(r)>=2 and all(math.isfinite(x) for x in r) and r[0]>0 and r[1]>0 for r in pkrows),
            'cl_finite':all(all(math.isfinite(x) for x in r) for r in clrows),
            'cl_tt_ee_nonnegative':all((len(r)<3) or (r[1]>=-1e-30 and r[2]>=-1e-30) for r in clrows),
          })
          assert all(checks.values()),{'failed':[k for k,v in checks.items() if not v],'z5':z5,'today':today,'crosses':crosses,'OmegaDE':OmegaDE}
          result={'schema':'KMDSB.W03.M13b.K3D2BDefaultBackgroundBoltzmann.v0.1','provider_commit':os.environ['CLASS_PIN'],'checks':checks,'all_required_checks_pass':True,'background_file':str(bg[0]),'pk_file':str(pk[0]),'cl_file':str(cl[0]),'z5':z5,'today':today,'crossings_z':crosses,'Omega_DE0':OmegaDE,'pk_rows':len(pkrows),'cl_rows':len(clrows)}
          pathlib.Path('result/default_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-default
          path: |
            result/
            out/
          retention-days: 90

  reference_precision_run:
    name: B2 reference-precision enabled qcf+qpf
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-pin adapter and run cl_ref.pre
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/patch_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          overwrite_root = yes
          root = $GITHUB_WORKSPACE/out/ref_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then echo 'REF STDERR:'; cat result/stderr.txt; echo 'REF STDOUT:'; cat result/stdout.txt; exit "$rc"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-reference
          path: |
            result/
            out/
          retention-days: 90

  compare_precision:
    name: B2 frozen default-vs-reference precision gates
    needs: [default_run, reference_precision_run]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: k3d2b-default, path: default_art}
      - uses: actions/download-artifact@v4
        with: {name: k3d2b-reference, path: ref_art}
      - name: Compare spectra and background
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,math,json,re
          def one(root,pattern):
              x=sorted(pathlib.Path(root).glob(pattern)); assert len(x)==1,(root,pattern,x); return x[0]
          def rows(p):
              out=[]
              for l in p.read_text().splitlines():
                  if l.strip() and not l.lstrip().startswith('#'): out.append([float(x) for x in l.split()])
              assert out; return out
          def l2(a,b,col=1,ell_range=None):
              aa=[];bb=[]
              assert len(a)==len(b)
              for x,y in zip(a,b):
                  if ell_range and not (ell_range[0]<=x[0]<=ell_range[1]): continue
                  assert abs(x[0]-y[0])<=1e-12*max(1,abs(x[0]),abs(y[0]))
                  aa.append(x[col]);bb.append(y[col])
              return math.sqrt(sum((x-y)**2 for x,y in zip(aa,bb))/max(sum(x*x for x in aa),1e-300))
          dpk=rows(one('default_art/out','default*_pk.dat')); rpk=rows(one('ref_art/out','ref*_pk.dat'))
          dcl=rows(one('default_art/out','default*_cl.dat')); rcl=rows(one('ref_art/out','ref*_cl.dat'))
          pk_l2=l2(dpk,rpk,1); tt_l2=l2(dcl,rcl,1,(30,1200))

          def bgdiag(path):
              lines=path.read_text().splitlines(); hdr=' '.join(x.lstrip('#').strip() for x in lines if x.lstrip().startswith('#'))
              titles={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hdr)}
              data=[[float(x) for x in l.split()] for l in lines if l.strip() and not l.lstrip().startswith('#')]
              iz=titles['z']; iH=titles['H [1/Mpc]']; ix=titles['phi_qcf']; ixp=titles["phi'_qcf"]; iy=titles['psi_qpf']; iyp=titles["psi'_qpf"]
              pts=[]
              for r in data:
                  z=r[iz]; a=1/(1+z); H=r[iH]; p=r[ixp]/(a*H);q=r[iyp]/(a*H);pts.append((z,r[ix],p,r[iy],q,p*p-q*q))
              pts.sort()
              today=min(pts,key=lambda x:abs(x[0]))
              evo=[x for x in pts if 0<=x[0]<=5]; evo.sort(reverse=True)
              c=[]
              for a,b in zip(evo[:-1],evo[1:]):
                  if a[5]<0<=b[5]:
                      f=(-a[5])/(b[5]-a[5]); c.append(a[0]+f*(b[0]-a[0]))
              assert len(c)==1
              return {'today':today,'cross':c[0]}
          db=bgdiag(one('default_art/out','default*_background.dat')); rb=bgdiag(one('ref_art/out','ref*_background.dat'))
          bgmax=max(abs(db['today'][i]-rb['today'][i]) for i in range(1,5)); crossdiff=abs(db['cross']-rb['cross'])
          checks={'pk_L2_le_5e_3':pk_l2<=5e-3,'tt_L2_le_5e_3':tt_l2<=5e-3,'crossing_diff_le_2e_3':crossdiff<=2e-3,'today_field_velocity_diff_le_1e_3':bgmax<=1e-3}
          assert all(checks.values()),(checks,pk_l2,tt_l2,crossdiff,bgmax)
          r={'schema':'KMDSB.W03.M13b.K3D2BPrecisionRegression.v0.1','checks':checks,'all_required_checks_pass':True,'pk_normalized_L2':pk_l2,'tt_normalized_L2_ell30_1200':tt_l2,'crossing_z_abs_difference':crossdiff,'max_today_field_velocity_abs_difference':bgmax}
          pathlib.Path('precision_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2b-precision-comparison
          path: precision_result.json
          retention-days: 90
