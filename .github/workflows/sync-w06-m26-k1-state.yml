name: Sync W06 M26 K1 state

on:
  push:
    paths:
      - '.github/workflows/sync-w06-m26-k1-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M26 K1 classification
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('matrices/mandatory_properties_matrix.csv')
          rows=list(csv.DictReader(p.open(newline='',encoding='utf-8')))
          fields=list(rows[0].keys())
          found=False
          for r in rows:
              if r['benchmark_id']=='M26':
                  found=True
                  r['K1_reference_limit']='PARTIAL'
                  r['coverage_state']='K0_PASS_K1_NOT_ESTABLISHED_DUAL_CHANNEL_K2_K9_OPEN'
                  note='W06 PBH K1 dual-channel run 34656476133 aggregate artifact 10285776102: K1 PARTIAL / NOT_ESTABLISHED. Evaporation and disk-accretion fraction-to-zero arms are both BLOCKED_IMPLEMENTATION at the provider/output boundary; physical_falsification=false. Scope remains energy injection only; PBH discreteness/Poisson/isocurvature open.'
                  if note not in r['notes']:
                      r['notes']=(r['notes']+' | '+note).strip(' |')
          if not found:
              raise SystemExit('missing M26 row')
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          PY
      - name: Recompute readiness
        run: python3 verification/audit_matrix_readiness.py
      - name: Commit and push atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/mandatory_properties_matrix.csv audits/KMDSB_READINESS_SNAPSHOT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync M26 PBH K1 partial classification and readiness'
          git pull --rebase origin main
          git push origin HEAD:main
