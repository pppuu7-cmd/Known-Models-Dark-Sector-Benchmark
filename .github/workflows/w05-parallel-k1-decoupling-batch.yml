name: W05 parallel K1 decoupling batch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w05-parallel-k1-decoupling-batch.yml'
      - 'verification/k1/decoupling_ladder.py'
      - 'protocol/W05_PARALLEL_K1_DECOUPLING_BATCH_PREREGISTRATION_v0.1.md'

jobs:
  m24-ethos-k1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y build-essential python3-numpy
      - name: Build exact CLASS
        run: |
          git clone -q https://github.com/lesgourg/class_public.git provider
          cd provider && git checkout -q --detach "$PIN" && test "$(git rev-parse HEAD)" = "$PIN" && make -j2 >/dev/null
          git rev-parse HEAD > ../m24_provider_commit.txt
      - name: Execute frozen interaction ladder
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/k1_m24"; mkdir -p "$BASE"
          run_arm () {
            label="$1"; aval="$2"; d="$BASE/$label"; mkdir -p "$d/out"
            cat > "$d/run.ini" <<EOF
          h = 0.675
          omega_b = 0.0222
          omega_cdm = 0.1197
          A_s = 2.196e-9
          n_s = 0.9655
          tau_reio = 0.06
          N_ur = 3.046
          f_idm = 1
          N_idr = 0.4290
          a_idm_dr = $aval
          nindex_idm_dr = 4
          idr_nature = free_streaming
          b_idr = 0
          alpha_idm_dr = 1.5
          beta_idr = 1.5
          output = tCl,mPk
          lensing = no
          non linear = none
          P_k_max_h/Mpc = 20
          z_pk = 0
          l_max_scalars = 2500
          gauge = synchronous
          overwrite_root = yes
          root = $d/out/run_
          EOF
            set +e; ./provider/class "$d/run.ini" > "$d/stdout.txt" 2> "$d/stderr.txt"; echo $? > "$d/exit.txt"; set -e
          }
          run_arm ref 0
          run_arm a1e6 1e6
          run_arm a1e5 1e5
          run_arm a1e4 1e4
          run_arm a1e3 1e3
      - name: Classify M24 K1
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,pathlib
          base=pathlib.Path('k1_m24')
          arms=[]
          for label,x in [('a1e6',1e6),('a1e5',1e5),('a1e4',1e4),('a1e3',1e3)]:
              d=base/label
              arms.append({'label':label,'x':x,'cl':glob.glob(str(d/'out/*_cl.dat'))[0],'pk':glob.glob(str(d/'out/*_pk.dat'))[0],'exit':int((d/'exit.txt').read_text())})
          pathlib.Path('m24_arms.json').write_text(json.dumps(arms))
          PY
          REFCL=$(find k1_m24/ref/out -name '*_cl.dat' | head -1); REFPK=$(find k1_m24/ref/out -name '*_pk.dat' | head -1)
          python3 verification/k1/decoupling_ladder.py --model M24 --provider-commit "$(cat m24_provider_commit.txt)" --expected-commit "$PIN" --reference-cl "$REFCL" --reference-pk "$REFPK" --arms-json m24_arms.json --out m24_k1_result.json --scope 'native CLASS ETHOS IDM-DR scalar closure; a_idm_dr -> 0 reference limit only'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m24-k1-decoupling-ladder
          path: |
            m24_k1_result.json
            m24_arms.json
            m24_provider_commit.txt
            k1_m24/

  m35-aether-k1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PIN: d9a20bd0c7b7a6c8957410fd245ed06b30b915c1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y build-essential gfortran python3-numpy
      - name: Build exact CLASS_LVDM
        run: |
          git clone -q --branch LVDM https://github.com/Michalychforever/CLASS_LVDM.git provider
          cd provider && git checkout -q "$PIN" && test "$(git rev-parse HEAD)" = "$PIN" && make -j2 class >/dev/null
          git rev-parse HEAD > ../m35_provider_commit.txt
      - name: Prepare and execute frozen gravity-scale ladder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider/output k1_m35
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('provider')
          ref=(p/'lcdm.ini').read_text()
          ref=re.sub(r'(?m)^\s*root\s*=.*$', 'root = output/k1ref_', ref)
          (p/'k1ref.ini').write_text(ref)
          src=(p/'Misha.ini').read_text()
          for label,s in [('s1',1.0),('s01',0.1),('s001',0.01),('s0001',0.001)]:
              t=src
              vals={'alpha':0.05*s,'beta':0.25*s,'lambda':-0.1*s,'Y_dm':0.0}
              for k,v in vals.items():
                  t=re.sub(rf'(?m)^\s*{re.escape(k)}\s*=.*$', f'{k} = {v:.12g}', t)
              t=re.sub(r'(?m)^\s*root\s*=.*$', f'root = output/k1{label}_', t)
              (p/f'k1{label}.ini').write_text(t)
          PY
          set +e
          (cd provider && ./class k1ref.ini > ../k1_m35/ref.stdout 2> ../k1_m35/ref.stderr); echo $? > k1_m35/ref.exit
          for label in s1 s01 s001 s0001; do
            (cd provider && ./class "k1${label}.ini" > "../k1_m35/${label}.stdout" 2> "../k1_m35/${label}.stderr"); echo $? > "k1_m35/${label}.exit"
          done
          set -e
      - name: Classify M35 K1
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,pathlib
          arms=[]
          for label,x in [('s1',1.0),('s01',0.1),('s001',0.01),('s0001',0.001)]:
              arms.append({'label':label,'x':x,'cl':glob.glob(f'provider/output/k1{label}*cl.dat')[0],'pk':glob.glob(f'provider/output/k1{label}*pk.dat')[0],'exit':int(pathlib.Path(f'k1_m35/{label}.exit').read_text())})
          pathlib.Path('m35_arms.json').write_text(json.dumps(arms))
          PY
          REFCL=$(find provider/output -name 'k1ref*cl.dat' | head -1); REFPK=$(find provider/output -name 'k1ref*pk.dat' | head -1)
          python3 verification/k1/decoupling_ladder.py --model M35 --provider-commit "$(cat m35_provider_commit.txt)" --expected-commit "$PIN" --reference-cl "$REFCL" --reference-pk "$REFPK" --arms-json m35_arms.json --out m35_k1_result.json --scope 'pinned CLASS_LVDM preferred-frame/LV gravity scalar-sector route; uniform gravity-parameter scaling toward provider lcdm reference'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m35-k1-decoupling-ladder
          path: |
            m35_k1_result.json
            m35_arms.json
            m35_provider_commit.txt
            k1_m35/
            provider/output/k1*

  m37-ft-k1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PIN: 74e6a8679cdc233fb339c67127ed0921ba547894
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y build-essential python3-numpy
      - name: Build exact fT provider
        run: |
          git clone -q https://github.com/Speeddemon5050/Modified-CLASS-fT-Exact-.git provider
          cd provider && git checkout -q "$PIN" && test "$(git rev-parse HEAD)" = "$PIN" && make -j2 >/dev/null
          git rev-parse HEAD > ../m37_provider_commit.txt
      - name: Execute frozen n_fT ladder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p provider/output k1_m37
          run_arm () {
            label="$1"; n="$2"
            cat > "provider/k1${label}.ini" <<EOF
          H0 = 67.36
          omega_b = 0.02237
          omega_cdm = 0.1200
          N_ur = 3.044
          N_ncdm = 0
          tau_reio = 0.0544
          A_s = 2.100e-9
          n_s = 0.9649
          output = tCl,mPk
          l_max_scalars = 2500
          P_k_max_h/Mpc = 1.0
          z_pk = 0
          n_fT = $n
          root = output/k1${label}_
          overwrite_root = yes
          EOF
            set +e; (cd provider && ./class "k1${label}.ini" > "../k1_m37/${label}.stdout" 2> "../k1_m37/${label}.stderr"); echo $? > "k1_m37/${label}.exit"; set -e
          }
          run_arm ref 0.0
          run_arm n01 0.1
          run_arm n001 0.01
          run_arm n0001 0.001
          run_arm n00001 0.0001
      - name: Classify M37 K1 with provenance guard
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,pathlib
          arms=[]
          for label,x in [('n01',0.1),('n001',0.01),('n0001',0.001),('n00001',0.0001)]:
              arms.append({'label':label,'x':x,'cl':glob.glob(f'provider/output/k1{label}*cl.dat')[0],'pk':glob.glob(f'provider/output/k1{label}*pk.dat')[0],'exit':int(pathlib.Path(f'k1_m37/{label}.exit').read_text())})
          pathlib.Path('m37_arms.json').write_text(json.dumps(arms))
          PY
          REFCL=$(find provider/output -name 'k1ref*cl.dat' | head -1); REFPK=$(find provider/output -name 'k1ref*pk.dat' | head -1)
          python3 verification/k1/decoupling_ladder.py --model M37 --provider-commit "$(cat m37_provider_commit.txt)" --expected-commit "$PIN" --reference-cl "$REFCL" --reference-pk "$REFPK" --arms-json m37_arms.json --out m37_k1_result.json --scope 'exact-pin f(T) CLASS route; n_fT -> 0 reference limit; K0 publication/author provenance remains open' --k0-provenance-open
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m37-k1-decoupling-ladder
          path: |
            m37_k1_result.json
            m37_arms.json
            m37_provider_commit.txt
            k1_m37/
            provider/output/k1*
