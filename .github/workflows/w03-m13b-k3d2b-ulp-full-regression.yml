name: W03 M13b K3D2-B U1 full regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3d2b-ulp-full-regression.yml'
  workflow_dispatch:

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

permissions:
  contents: read

jobs:
  source_audit:
    name: S recovered source audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact frozen stack and audit
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/ulp.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          bg=Path('provider/source/background.c').read_text(); pt=Path('provider/source/perturbations.c').read_text()
          A=json.loads(Path('result/adapter.json').read_text()); R=json.loads(Path('result/restart.json').read_text()); U=json.loads(Path('result/ulp.json').read_text()); D=json.loads(Path('result/diag.json').read_text())
          checks={
            'upstream_scf_preserved':A['upstream_scf_lines_byte_sequence_preserved'],
            'conditional_restart':R['conditional_qfields'] and R['disabled_branch_preserves_original_call'],
            'four_floating_background_guards':bg.count('a <= exp(log(1./6.))')==4,
            'two_original_perturbation_guards':pt.count('a < 1./6.')==2,
            'U1_only':U['post_handoff_ulps']==1 and U['same_state_vector'] and U['first_segment_endpoint_unchanged'],
            'qcf_force_sign':'- a*dV_qcf(pba,y[pba->index_bi_phi_qcf])/H;' in bg,
            'qpf_force_sign':'+ a*dV_qpf(pba,y[pba->index_bi_psi_qpf])/H;' in bg,
            'qcf_mass_sign':'(k2 + a2*pvecback[pba->index_bg_ddV_qcf])*y[pv->index_pt_phi_qcf]' in pt,
            'qpf_mass_sign':'(k2 - a2*pvecback[pba->index_bg_ddV_qpf])*y[pv->index_pt_psi_qpf]' in pt,
            'diagnostics_output_only':D['output_only'] and not D['changes_rhs'] and not D['changes_state_vector'] and not D['changes_einstein_sources'] and not D['changes_boltzmann_hierarchy'] and not D['changes_background'],
          }
          out={'schema':'KMDSB.W03.M13b.K3D2BU1FullSourceAudit.v0.1','checks':checks,'all_required_checks_pass':all(checks.values())}
          Path('result/source_audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True)); assert out['all_required_checks_pass'],out
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2b-u1-source-audit
          path: result/
          retention-days: 90

  run:
    name: ${{ matrix.label }} full CLASS
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            prefix: default
            precision: none
          - label: reference
            prefix: ref
            precision: cl_ref.pre
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact frozen U1 adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/ulp.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run ${{ matrix.label }} full Boltzmann cosmology
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${{ matrix.prefix }}_
          EOF
          set +e
          if [ "${{ matrix.precision }}" = "none" ]; then
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          else
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" "${{ matrix.precision }}") > result/stdout.txt 2> result/stderr.txt
          fi
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then cat result/stderr.txt; cat result/stdout.txt; exit "$rc"; fi
      - name: Default frozen B1+B2+B3 verify
        if: matrix.label == 'default'
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/m13b/k3d2b_verify_full_default.py --out out --result result --canonical waves/wave_03_expanded_dark_energy/M13B_K3C2_INDEPENDENT_PERTURBATION_BRIDGE_RESULT.json --prefix default
      - name: Reference finite-output guard
        if: matrix.label == 'reference'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,math
          def rows(p): return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          pk=sorted(Path('out').glob('ref*_pk.dat')); cl=sorted(Path('out').glob('ref*_cl.dat')); bg=sorted(Path('out').glob('ref*_background.dat'))
          checks={'one_pk':len(pk)==1,'one_cl':len(cl)==1,'one_background':len(bg)==1}
          if all(checks.values()):
            checks['pk_finite_positive']=all(r[0]>0 and r[1]>0 and all(math.isfinite(x) for x in r) for r in rows(pk[0])); checks['cl_finite']=all(all(math.isfinite(x) for x in r) for r in rows(cl[0]))
          out={'schema':'KMDSB.W03.M13b.K3D2BReferenceFinite.v0.1','checks':checks,'all_required_checks_pass':all(checks.values())}; Path('result/reference_verify.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(out); assert out['all_required_checks_pass']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-u1-${{ matrix.prefix }}
          path: |
            result/
            out/
          retention-days: 90

  precision_compare:
    name: P frozen default vs cl_ref
    needs: run
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-default
          path: d
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-ref
          path: r
      - name: Frozen precision comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat d/result/provider_rc.txt)" = 0
          test "$(cat r/result/provider_rc.txt)" = 0
          python3 verification/m13b/k3d2b_verify_precision_compare.py --default-root d/out --ref-root r/out --result precision_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-u1-precision
          path: precision_result.json
          retention-days: 90

  verdict:
    name: V K3D2-B full verdict
    needs: [source_audit, run, precision_compare]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-source-audit
          path: s
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-default
          path: d
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-ref
          path: r
      - uses: actions/download-artifact@v4
        with:
          name: k3d2b-u1-precision
          path: p
      - name: Freeze classification from existing gates only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          S=json.loads(Path('s/result/source_audit.json').read_text()); D=json.loads(Path('d/result/default_verify.json').read_text()); R=json.loads(Path('r/result/reference_verify.json').read_text()); P=json.loads(Path('p/precision_result.json').read_text())
          checks={'source_audit':S['all_required_checks_pass'],'B1':D['B1']['all_required_checks_pass'],'B2_default':D['B2_default']['all_required_checks_pass'],'B3':D['B3']['all_required_checks_pass'],'reference_finite':R['all_required_checks_pass'],'precision':P['all_required_checks_pass']}; ok=all(checks.values())
          out={'schema':'KMDSB.W03.M13b.K3D2BU1FullVerdict.v0.1','classification':('M13B_K3D2B_ENABLED_FULL_BOLTZMANN_COSMOLOGY_REGRESSION_PASS_WITH_SCOPE' if ok else 'M13B_K3D2B_ENABLED_FULL_BOLTZMANN_COSMOLOGY_REGRESSION_GAP'),'checks':checks,'all_required_checks_pass':ok,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'author_model_reproduced':False,'published_V0_reproduced':False,'author_normalization_map_claimed':False,'physical_falsification':False,'seam_ulps':1}
          Path('K3D2B_U1_FULL_VERDICT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True)); assert ok,out
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-u1-full-verdict
          path: K3D2B_U1_FULL_VERDICT.json
          retention-days: 90
