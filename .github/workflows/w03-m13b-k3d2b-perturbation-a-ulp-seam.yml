name: W03 M13b K3D2-B perturbation a-ULP seam recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3d2b-perturbation-a-ulp-seam.yml'
  workflow_dispatch:

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

permissions:
  contents: read

jobs:
  lanes:
    name: A${{ matrix.ulps }} ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {ulps: 1, label: default, prefix: a1d, precision: none}
          - {ulps: 1, label: reference, prefix: a1r, precision: cl_ref.pre}
          - {ulps: 2, label: default, prefix: a2d, precision: none}
          - {ulps: 2, label: reference, prefix: a2r, precision: cl_ref.pre}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-pin recovered qfield CLASS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_perturbation_a_ulp_seam.py provider --ulps ${{ matrix.ulps }} --manifest result/a_ulp.json
          python3 verification/m13b/k3d2b_apply_output_diagnostics.py provider --manifest result/diag.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run frozen enabled lane
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk,dTk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${{ matrix.prefix }}_
          EOF
          set +e
          if [ '${{ matrix.precision }}' = none ]; then
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          else
            (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" '${{ matrix.precision }}') > result/stdout.txt 2> result/stderr.txt
          fi
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
      - name: Frozen per-lane implementation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,math,re
          res=Path('result'); out=Path('out'); rc=int((res/'provider_rc.txt').read_text()); diag=((res/'stdout.txt').read_text(errors='replace')+'\n'+(res/'stderr.txt').read_text(errors='replace')).lower()
          checks={'provider_rc_zero':rc==0,'no_minimum_step':('step size too small' not in diag and 'stepsize underflow' not in diag)}; data={'provider_rc':rc,'a_ulps':${{ matrix.ulps }},'lane':'${{ matrix.label }}'}
          pk=sorted(out.glob('${{ matrix.prefix }}*_pk.dat')); fs=sorted(out.glob('${{ matrix.prefix }}*_perturbations_k*_s.dat')); bg=sorted(out.glob('${{ matrix.prefix }}*_background.dat'))
          checks['one_pk']=len(pk)==1; checks['two_trajectories']=len(fs)==2; checks['one_background']=len(bg)==1
          if rc==0 and len(pk)==1 and len(fs)==2 and len(bg)==1:
            pr=[[float(x) for x in l.split()] for l in pk[0].read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
            checks['pk_finite_positive']=bool(pr) and all(r[0]>0 and r[1]>0 and all(math.isfinite(x) for x in r) for r in pr)
            modes=[]; maxfield=0.; hierarchy=True; qnon=True; allfinite=True
            for f in fs:
              ls=f.read_text().splitlines(); hs=[l for l in ls if l.lstrip().startswith('#') and 'delta_qcf_S' in l and 'delta_qpf_S' in l]; assert len(hs)==1,(f,hs)
              t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}; req=['delta_g','theta_g','delta_ur','theta_ur','shear_ur','delta_qcf_S','delta_prime_qcf_S','delta_qpf_S','delta_prime_qpf_S']; hierarchy=hierarchy and all(k in t for k in req)
              rr=[[float(x) for x in l.split()] for l in ls if l.strip() and not l.lstrip().startswith('#')]; finite=bool(rr) and all(all(math.isfinite(x) for x in r) for r in rr); allfinite=allfinite and finite
              qcf=max([abs(r[t['delta_qcf_S']]) for r in rr]+[abs(r[t['delta_prime_qcf_S']]) for r in rr]); qpf=max([abs(r[t['delta_qpf_S']]) for r in rr]+[abs(r[t['delta_prime_qpf_S']]) for r in rr]); maxfield=max(maxfield,qcf,qpf); qnon=qnon and qcf>0 and qpf>0; modes.append({'file':f.name,'rows':len(rr),'qcf_max':qcf,'qpf_max':qpf,'today_raw':[rr[-1][t[x]] for x in ['delta_qcf_S','delta_prime_qcf_S','delta_qpf_S','delta_prime_qpf_S']]})
            checks.update({'hierarchy_columns_present':hierarchy,'all_trajectory_values_finite':allfinite,'qcf_qpf_dynamically_nonzero':qnon,'direct_qfields_below_0p1':maxfield<0.1})
            data.update({'modes':modes,'max_direct_qfield_amplitude':maxfield,'pk_rows':len(pr)})
          else:
            checks.update({'pk_finite_positive':False,'hierarchy_columns_present':False,'all_trajectory_values_finite':False,'qcf_qpf_dynamically_nonzero':False,'direct_qfields_below_0p1':False})
          ok=all(checks.values()); obj={'schema':'KMDSB.W03.M13b.K3D2BPerturbationAULPSeamLane.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':('M13B_K3D2B_PERTURBATION_A_ULP_LANE_PASS' if ok else 'M13B_K3D2B_PERTURBATION_A_ULP_LANE_BLOCKED'),'B1_B2_B3_evaluated':False,'physical_falsification':False,**data}; (res/'lane_result.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-a${{ matrix.ulps }}-${{ matrix.label }}
          path: |
            result/
            out/
          retention-days: 90

  verdict:
    name: A1/A2 barrier and frozen sensitivity
    needs: [lanes]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: m13b-k3d2b-a1-default, path: a1d}
      - uses: actions/download-artifact@v4
        with: {name: m13b-k3d2b-a1-reference, path: a1r}
      - uses: actions/download-artifact@v4
        with: {name: m13b-k3d2b-a2-default, path: a2d}
      - uses: actions/download-artifact@v4
        with: {name: m13b-k3d2b-a2-reference, path: a2r}
      - name: Frozen verdict and default-lane sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import bisect,json,math,re
          roots={k:Path(k) for k in ('a1d','a1r','a2d','a2r')}
          lane={k:json.loads((v/'result/lane_result.json').read_text()) for k,v in roots.items()}
          checks={k:v['all_required_checks_pass'] for k,v in lane.items()}; data={}
          def one(root,pat):
            a=sorted((root/'out').glob(pat)); assert len(a)==1,(root,pat,a); return a[0]
          def rows(p): return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          if all(checks.values()):
            p1=rows(one(roots['a1d'],'a1d*_pk.dat')); p2=rows(one(roots['a2d'],'a2d*_pk.dat')); x2=[r[0] for r in p2]; y2=[r[1] for r in p2]
            def li(x):
              i=bisect.bisect_left(x2,x)
              if i==0:return y2[0]
              if i>=len(x2):return y2[-1]
              x0,x1=x2[i-1],x2[i]; y0,y1=y2[i-1],y2[i]; f=(math.log(x)-math.log(x0))/(math.log(x1)-math.log(x0)); return math.exp(math.log(y0)+f*(math.log(y1)-math.log(y0)))
            common=[r for r in p1 if x2[0]<=r[0]<=x2[-1]]; pk_l2=math.sqrt(sum((r[1]-li(r[0]))**2 for r in common)/max(sum(r[1]**2 for r in common),1e-300))
            def head_rows(p):
              ls=p.read_text().splitlines(); hs=[l for l in ls if l.lstrip().startswith('#')]; h=next(l for l in hs if 'z' in l and 'H [1/Mpc]' in l); t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',h.lstrip('#').strip())}; return t,[[float(x) for x in l.split()] for l in ls if l.strip() and not l.lstrip().startswith('#')]
            def bg_today(root,prefix):
              t,r=head_rows(one(root,prefix+'*_background.dat')); q=min(r,key=lambda z:abs(z[t['z']])); H=q[t['H [1/Mpc]']]; vals=[]
              for candidates in [('phi_qcf','phi_qcf'),('phi_prime_qcf','phi_prime_qcf'),('psi_qpf','psi_qpf'),('psi_prime_qpf','psi_prime_qpf')]:
                key=next((k for k in t if candidates[0] in k),None); vals.append(None if key is None else q[t[key]])
              return H,vals
            h1,b1=bg_today(roots['a1d'],'a1d'); h2,b2=bg_today(roots['a2d'],'a2d'); hrel=abs(h1-h2)/max(abs(h1),abs(h2),1e-300)
            bd=[0. if x is None or y is None else abs(x-y) for x,y in zip(b1,b2)]; bgmax=max(bd)
            # Same B3 primordial normalization is a single scalar per mode.  The A1/A2
            # seam sensitivity is invariant to using the same frozen scalar on both lanes;
            # compare corresponding today raw direct variables after common scaling=1 here.
            # No per-variable fitting/sign/phase operation is introduced.
            f1=sorted((roots['a1d']/'out').glob('a1d*_perturbations_k*_s.dat')); f2=sorted((roots['a2d']/'out').glob('a2d*_perturbations_k*_s.dat')); assert len(f1)==len(f2)==2
            dd=[]
            for x,y in zip(f1,f2):
              def last4(p):
                ls=p.read_text().splitlines(); h=next(l for l in ls if l.lstrip().startswith('#') and 'delta_qcf_S' in l); t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',h.lstrip('#').strip())}; rr=rows(p); return [rr[-1][t[k]] for k in ['delta_qcf_S','delta_prime_qcf_S','delta_qpf_S','delta_prime_qpf_S']]
              u,v=last4(x),last4(y); dd.extend(abs(a-b) for a,b in zip(u,v))
            dmax=max(dd)
            checks.update({'pk_L2_le_1e_7':pk_l2<=1e-7,'H0_rel_le_1e_10':hrel<=1e-10,'background_today_qfields_le_1e_8':bgmax<=1e-8,'today_direct_qfields_common_scale_abs_le_1e_7':dmax<=1e-7}); data.update({'pk_normalized_L2':pk_l2,'H0_relative_difference':hrel,'background_today_qfield_max_abs_difference':bgmax,'today_direct_qfield_common_scale_max_abs_difference':dmax})
          else:
            checks.update({'pk_L2_le_1e_7':False,'H0_rel_le_1e_10':False,'background_today_qfields_le_1e_8':False,'today_direct_qfields_common_scale_abs_le_1e_7':False})
          ok=all(checks.values()); o={'schema':'KMDSB.W03.M13b.K3D2BPerturbationAULPSeamVerdict.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':('M13B_K3D2B_PERTURBATION_A_ULP_SEAM_IMPLEMENTATION_PASS_WITH_SCOPE' if ok else 'M13B_K3D2B_PERTURBATION_A_ULP_SEAM_BLOCKED'),'next_authorized_gate':('A1 frozen full B1/B2/B3 regression' if ok else None),'B1_B2_B3_evaluated':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False,**data}; Path('verdict.json').write_text(json.dumps(o,indent=2,sort_keys=True)+'\n'); print(json.dumps(o,indent=2,sort_keys=True)); assert ok,o
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-a-ulp-verdict
          path: verdict.json
          retention-days: 90
