name: W04 M27 DDM D04 reference recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m27-ddm-energy-transfer-d04-reference-recovery.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m27-transfer-d*-y*-g*
          path: collected
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34555747835
      - name: Apply frozen D04 reference recovery to immutable artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          protocol='protocol/W04_M27_DDM_ENERGY_TRANSFER_D04_REFERENCE_RECOVERY_PREREGISTRATION_v0.1.md'
          ladder=json.loads(Path('waves/wave_04_dark_matter/M27_N1_COMOVING_D_SUPPORT_LADDER_SUMMARY.json').read_text())
          refs={}
          for gs in ('0.03','0.3','3.0'):
              s=ladder['slices'][gs]['D04']
              refs[float(gs)]={
                  'H_p95': None,
                  'parent_p95': None,
                  'D04_p95': float(s['p95']),
                  'D_amp_norm_max_abs': float(ladder['D_amplitude_normalized_max_abs'][gs]),
              }
          # H and parent residuals come from the independent conditioning audit.
          cond=json.loads(Path('waves/wave_04_dark_matter/M27_N1_REFERENCE_CONDITIONING_AUDIT_SUMMARY.json').read_text())
          for gs,r in cond['residuals'].items():
              refs[float(gs)]['H_p95']=float(r['H_p95'])
              refs[float(gs)]['parent_p95']=float(r['parent_p95'])
          recovered=[]
          for p in sorted(Path('collected').glob('*/result.json')):
              r=json.loads(p.read_text())
              g=float(r['Gamma0_over_Hstar'])
              rr=refs[g]
              refpass=(rr['H_p95']<=1e-7 and rr['parent_p95']<=1e-7 and rr['D04_p95']<=1e-7 and rr['D_amp_norm_max_abs']<=1e-8)
              gates=dict(r.get('gates',{}))
              original_ref=bool(gates.get('n1_reference',False))
              unchanged={k:bool(v) for k,v in gates.items() if k!='n1_reference'}
              all_other=bool(unchanged) and all(unchanged.values())
              cls='M27_DDM_COSMOLOGICAL_ENERGY_TRANSFER_PASS_WITH_D04_REFERENCE_SCOPE' if refpass and all_other else 'M27_DDM_COSMOLOGICAL_ENERGY_TRANSFER_NOT_ESTABLISHED_AFTER_D04_RECOVERY'
              recovered.append({
                  'delta':r['delta'],'y':r['y'],'Gamma0_over_Hstar':g,
                  'original_classification':r.get('classification'),
                  'original_n1_reference':original_ref,
                  'recovered_n1_D04_reference':refpass,
                  'reference_metrics':rr,
                  'unchanged_ensemble_gates':unchanged,
                  'classification':cls,
                  'source_integral_relative_residual':r.get('source_integral_relative_residual'),
              })
          assert len(recovered)==27, len(recovered)
          allpass=all(x['classification']=='M27_DDM_COSMOLOGICAL_ENERGY_TRANSFER_PASS_WITH_D04_REFERENCE_SCOPE' for x in recovered)
          out={
              'schema':'KMDSB.M27.DDMEnergyTransferD04ReferenceRecovery.v1',
              'preregistration':protocol,
              'source_solver_run_id':34555747835,
              'n_results':len(recovered),
              'n_pass':sum(x['classification']=='M27_DDM_COSMOLOGICAL_ENERGY_TRANSFER_PASS_WITH_D04_REFERENCE_SCOPE' for x in recovered),
              'reference_by_Gamma0_over_Hstar':{str(k):v for k,v in refs.items()},
              'children':{f"d={x['delta']}:y={x['y']}:g={x['Gamma0_over_Hstar']}":x['classification'] for x in recovered},
              'max_source_integral_relative_residual':max(float(x['source_integral_relative_residual']) for x in recovered),
              'classification':'M27_DDM_27_BRANCH_ENERGY_TRANSFER_PASS_WITH_D04_REFERENCE_SCOPE' if allpass else 'M27_DDM_ENERGY_TRANSFER_NOT_ESTABLISHED_AFTER_D04_RECOVERY',
              'K1_promoted':False,'K4_promoted':False,'physical_falsification':False,
              'perturbation_gate':'OPEN',
              'recovered_results':recovered,
          }
          Path('result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(Path('result.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m27-d04-reference-recovery
          path: result.json
          retention-days: 90
      - name: Persist canonical recovered summary
        shell: bash
        run: |
          cp result.json /tmp/result.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/dynamical_dark_matter
          cp /tmp/result.json waves/wave_04_dark_matter/M27_DDM_ENERGY_TRANSFER_D04_REFERENCE_RECOVERY_RESULT.json
          cp /tmp/result.json models/dynamical_dark_matter/M27_DDM_ENERGY_TRANSFER_D04_REFERENCE_RECOVERY_RESULT.json
          git add waves/wave_04_dark_matter models/dynamical_dark_matter
          git diff --cached --quiet || { git commit -m 'Record M27 D04 reference recovery'; git pull --rebase origin main; git push origin HEAD:main; }
