name: W03 F18 code-biased provider discovery v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-f18-code-biased-provider-discovery-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL: protocol/W03_F18_CODE_BIASED_PROVIDER_DISCOVERY_v0.2.md

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {lane: 0, q: '"ghost condensate" extension:py cosmology'}
          - {lane: 1, q: '"ghost condensate" extension:c CLASS'}
          - {lane: 2, q: '"ghost condensate" extension:f90 CAMB'}
          - {lane: 3, q: '"dilatonic ghost" extension:py cosmology'}
          - {lane: 4, q: '"P=-X" "X^2" extension:py'}
          - {lane: 5, q: '"ghost condensate" "perturbations.c"'}
          - {lane: 6, q: '"ghost condensate" "background.c"'}
          - {lane: 7, q: '"kinetic condensate" extension:jl cosmology'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frozen code-biased source search
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          QUERY: ${{ matrix.q }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import base64,json,os,re,time,urllib.error,urllib.parse,urllib.request
          lane=int(os.environ['LANE']); q=os.environ['QUERY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'KMDSB-F18-v02'}
          def get(url,attempts=6):
              last=None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r: return json.load(r)
                  except urllib.error.HTTPError as e:
                      last=e
                      if e.code not in (403,429): raise
                      time.sleep(float(e.headers.get('Retry-After') or min(60,5*(2**i))))
                  except Exception as e:
                      last=e; time.sleep(min(30,3*(i+1)))
              raise last
          try: sr=get('https://api.github.com/search/code?q='+urllib.parse.quote(q)+'&per_page=20')
          except Exception as e:
              json.dump({'lane':lane,'query':q,'status':'SEARCH_ERROR','error':repr(e),'candidates':[]},open(f'out/lane_{lane}.json','w'),indent=2); raise SystemExit(0)
          cand=[]
          allowed_ext=('.py','.c','.cc','.cpp','.h','.f','.f90','.jl')
          for item in sr.get('items',[]):
              repo=item['repository']['full_name']; path=item['path']; lowpath=path.lower()
              if repo.lower()=='pppuu7-cmd/known-models-dark-sector-benchmark' or not lowpath.endswith(allowed_ext):
                  cand.append({'repository':repo,'path':path,'priority':'REJECT','reason':'nonimplementation_path_or_self'}); continue
              try:
                  obj=get(item['url']); text=base64.b64decode(obj.get('content','')).decode('utf-8','replace') if obj.get('encoding')=='base64' else ''
              except Exception as e:
                  cand.append({'repository':repo,'path':path,'priority':'FETCH_BLOCKED','fetch_error':repr(e)}); continue
              low=text.lower()
              law=bool(re.search(r'ghost[ _-]?condens|dilatonic[ _-]?ghost|kinetic[ _-]?condens|p\s*\([^)]*x[^)]*\)|p[_ ]?x|p\s*=\s*-\s*x',low))
              background=bool(re.search(r'friedmann|hubble|background|rho[_ ]?(de|phi)|omega[_ ]?(de|phi)|scale[_ ]?factor',low))
              perturb=bool(re.search(r'perturb|boltzmann|synchronous|newtonian[_ ]?gauge|einstein|delta[_ ]?(phi|de)|theta[_ ]?(phi|de)',low))
              executable=bool(re.search(r'^\s*(def |class |subroutine |module |#include|int main|double |float )|numpy|scipy',text,re.I|re.M))
              toy=bool(re.search(r'\btoy\b|scaffolding|placeholder|not implemented',low))
              lineage=('class_gsf' in low or 'kunhaozhong/class_gsf' in low or repo.lower()=='kunhaozhong/class_gsf')
              complete=law and background and perturb and executable and not toy and not lineage
              priority='SOURCE_COMPLETE_REVIEW' if complete else ('PROVENANCE_LEAD' if law and background and not lineage else 'REJECT')
              cand.append({'repository':repo,'path':path,'html_url':item.get('html_url'),'blob_sha':item.get('sha'),'signals':{'implementation_path':True,'law':law,'background':background,'perturbation':perturb,'executable':executable,'toy':toy,'same_class_gsf_lineage':lineage},'priority':priority})
          json.dump({'lane':lane,'query':q,'status':'OK','total_count':sr.get('total_count',0),'candidates':cand},open(f'out/lane_{lane}.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f18-v02-lane-${{ matrix.lane }}
          path: out/lane_${{ matrix.lane }}.json

  aggregate:
    if: always()
    needs: [search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f18-v02-lane-*
          path: lanes
          merge-multiple: true
      - name: Frozen aggregate
        run: |
          python - <<'PY'
          import glob,json
          rows=[json.load(open(p)) for p in sorted(glob.glob('lanes/lane_*.json'))]
          allc=sum((r.get('candidates',[]) for r in rows),[])
          sc=[x for x in allc if x.get('priority')=='SOURCE_COMPLETE_REVIEW']; leads=[x for x in allc if x.get('priority')=='PROVENANCE_LEAD']
          errors=[r for r in rows if r.get('status')!='OK']; missing=max(0,8-len(rows))
          if sc: cl='F18_CODE_BIASED_SOURCE_COMPLETE_CANDIDATE_FOUND'
          elif leads: cl='F18_CODE_BIASED_PROVENANCE_LEADS_ONLY'
          elif len(errors)+missing==8: cl='F18_CODE_BIASED_DISCOVERY_INFRASTRUCTURE_BLOCKED'
          else: cl='F18_CODE_BIASED_NO_QUALIFYING_PUBLIC_SOURCE_IN_FROZEN_TRANCHE'
          out={'schema':'KMDSB.W03.F18CodeBiasedProviderDiscovery.v0.2','protocol':'protocol/W03_F18_CODE_BIASED_PROVIDER_DISCOVERY_v0.2.md','classification':cl,'source_complete_candidates':sc,'provenance_leads':leads,'lane_results':rows,'missing_lane_count':missing,'search_error_count':len(errors),'K0_promoted':False,'K1_promoted':False,'physical_falsification':False}
          json.dump(out,open('f18_code_biased_provider_discovery_aggregate.json','w'),indent=2)
          print(json.dumps({'classification':cl,'source_complete':len(sc),'leads':len(leads),'errors':len(errors),'missing':missing},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f18-code-biased-provider-discovery-aggregate
          path: f18_code_biased_provider_discovery_aggregate.json
