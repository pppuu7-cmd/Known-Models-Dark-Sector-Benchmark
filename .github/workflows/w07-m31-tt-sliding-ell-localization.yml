name: W07 M31 TT sliding ell localization

on:
  push:
    paths:
      - '.github/workflows/w07-m31-tt-sliding-ell-localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  localize:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable precision and recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p parent recovery
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10300871714/zip" > parent.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10302631267/zip" > recovery.zip
          unzip -q parent.zip -d parent
          unzip -q recovery.zip -d recovery
          sha256sum parent.zip recovery.zip > immutable_parent_sha256.txt
      - name: Verify integrity and compute frozen TT windows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,pathlib,numpy as np,re
          rh=list(pathlib.Path('recovery').rglob('M31_REFERENCE_PRECISION_ARTIFACT_RECOVERY.json'))
          if len(rh)!=1: raise SystemExit(f'recovery json count={len(rh)}')
          rec=json.loads(rh[0].read_text())
          if rec.get('classification')!='M31_REFERENCE_PRECISION_HIGH_ELL_NONCONVERGENCE_PERSISTS' or rec.get('fine_pair_identity_pass') is not True:
              raise SystemExit('recovery parent integrity failed')
          root=pathlib.Path('parent')/'m31_precision'
          windows=[(2,30),(31,100),(101,200),(201,400),(401,600),(601,800),(801,1000),(1001,1200),(1201,1400),(1401,1600),(1601,1800),(1801,2000),(2001,2200),(2201,2400),(2401,2500)]
          def load(profile,tag):
              p=root/profile/f'{tag}_00_cl.dat'
              text=p.read_text(errors='replace')
              header='\n'.join([x for x in text.splitlines() if x.lstrip().startswith('#')])
              # Frozen source assumption: this artifact has one numerical C_l column after ell, labeled TT.
              if '2:TT' not in header: raise RuntimeError(f'TT header missing in {p}')
              rows=[]
              for line in text.splitlines():
                  s=line.strip()
                  if not s or s.startswith('#'): continue
                  try: vals=[float(x) for x in s.split()]
                  except ValueError: continue
                  if len(vals)!=2: raise RuntimeError(f'expected ell+TT only in {p}, got {len(vals)} columns')
                  rows.append(vals)
              a=np.asarray(rows,float)
              if a.ndim!=2 or len(a)<5: raise RuntimeError(f'bad table {p}')
              return {int(r[0]):float(r[1]) for r in a if np.isfinite(r).all()}
          def geom(a,b):
              na=float(np.linalg.norm(a)); nb=float(np.linalg.norm(b))
              if na==0 or nb==0: return {'signed_cosine':None,'principal_angle_deg':None,'relative_norm_mismatch':None,'pass':False,'zero_norm':True}
              co=float(np.dot(a,b)/(na*nb)); co=max(-1,min(1,co)); ang=float(math.degrees(math.acos(abs(co)))); mis=float(abs(na-nb)/max(na,nb))
              return {'signed_cosine':co,'principal_angle_deg':ang,'relative_norm_mismatch':mis,'pass':bool(ang<=5 and mis<=0.25),'norm_coarse':na,'norm_fine':nb}
          out={'schema':'m31_tt_sliding_ell_localization_v0.1','model_id':'M31','family_id':'F31','protocol':'protocol/W07_M31_TT_SLIDING_ELL_LOCALIZATION_v0.1.md','parent_run':34702705097,'parent_artifact':10300871714,'recovery_run':34708033251,'recovery_artifact':10302631267,'K2_promoted':False,'canonical_K2':'OPEN','physical_falsification':False,'family_exclusion':False,'profiles':{}}
          any_clref_fail=False
          for profile in ['default','cl_ref']:
              d={t:load(profile,t) for t in ['rp2','rm2','rp1','rm1']}; common=set.intersection(*(set(x) for x in d.values())); rows=[]; first=None
              for lo,hi in windows:
                  ell=sorted(e for e in common if lo<=e<=hi)
                  if len(ell)<2:
                      g={'signed_cosine':None,'principal_angle_deg':None,'relative_norm_mismatch':None,'pass':False,'support':len(ell)}
                  else:
                      coarse=np.asarray([(d['rp2'][e]-d['rm2'][e])/(2*0.0005) for e in ell],float)
                      fine=np.asarray([(d['rp1'][e]-d['rm1'][e])/(2*0.00025) for e in ell],float)
                      g=geom(coarse,fine); g['support']=len(ell)
                  row={'ell_min':lo,'ell_max':hi,**g}; rows.append(row)
                  if not row['pass'] and first is None: first={'ell_min':lo,'ell_max':hi}
              out['profiles'][profile]={'windows':rows,'first_failing_window':first,'pass_count':sum(r['pass'] for r in rows),'fail_count':sum(not r['pass'] for r in rows)}
              if profile=='cl_ref': any_clref_fail=any(not r['pass'] for r in rows)
          out['classification']='M31_TT_HIGH_ELL_NONCONVERGENCE_LOCALIZED' if any_clref_fail else 'M31_TT_FINE_PAIR_WINDOWS_CONVERGED_UNDER_CL_REF'
          pathlib.Path('M31_TT_SLIDING_ELL_LOCALIZATION.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          with open('M31_TT_SLIDING_ELL_LOCALIZATION.md','w') as f:
              f.write('# M31 TT sliding-ell localization\n\n')
              f.write(f"Classification: `{out['classification']}`  \n")
              for p in ['default','cl_ref']:
                  f.write(f"{p}: first failing window={out['profiles'][p]['first_failing_window']}, pass={out['profiles'][p]['pass_count']}, fail={out['profiles'][p]['fail_count']}  \n")
              f.write('\nAnalysis-only; K2 remains OPEN.\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m31-tt-sliding-ell-localization
          path: |
            M31_TT_SLIDING_ELL_LOCALIZATION.json
            M31_TT_SLIDING_ELL_LOCALIZATION.md
            immutable_parent_sha256.txt
