name: W03 M07 parity and local-coordinate audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m07-parity-coordinate-audit.yml'
      - 'code/w03_m07_parity_coordinate_audit.py'

jobs:
  parity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMEGA_SCF_TARGET: '0.682686955086854'
      SHOOT_REL_TOL: '1.0e-13'
      OMEGA_TOL: '1.0e-6'
    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Fetch and build pinned official CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2

      - name: Write frozen parity configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity_configs parity_outputs parity_logs
          cat > parity_configs/common.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_fld = 0
          reio_parametrization = reio_none
          output = mPk,mTk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_shooting_deltax_rel = ${SHOOT_REL_TOL}
          input_verbose = 1
          EOF

          cat parity_configs/common.ini > parity_configs/ref.ini
          cat >> parity_configs/ref.ini <<EOF
          Omega_scf = 0
          root = ${GITHUB_WORKSPACE}/parity_outputs/ref_
          EOF

          make_scf () {
            local lam="$1"
            local tag="$2"
            local Aseed
            Aseed=$(python3 -c 'import math,sys; lam=float(sys.argv[1]); Om=float(sys.argv[2]); h=0.67; H0=100*h/299792.458; phi=1.0; print(f"{3*Om*H0*H0*math.exp(lam*phi)-1.0:.17g}")' "$lam" "$OMEGA_SCF_TARGET")
            cat parity_configs/common.ini > "parity_configs/${tag}.ini"
            cat >> "parity_configs/${tag}.ini" <<EOF
          Omega_scf = ${OMEGA_SCF_TARGET}
          scf_parameters = ${lam},0.0,${Aseed},0.0,1.0,0.0
          attractor_ic_scf = no
          scf_tuning_index = 2
          root = ${GITHUB_WORKSPACE}/parity_outputs/${tag}_
          EOF
          }

          make_scf 0.0 scf_l0
          make_scf 0.025 scf_p0025
          make_scf -0.025 scf_m0025
          make_scf 0.075 scf_p0075
          make_scf -0.075 scf_m0075

      - name: Run parity cases and preserve exit codes
        shell: bash
        run: |
          set +e
          for tag in ref scf_l0 scf_p0025 scf_m0025 scf_p0075 scf_m0075; do
            ./class_public/class "parity_configs/${tag}.ini" > "parity_logs/${tag}.log" 2>&1
            rc=$?
            echo "$rc" > "parity_logs/${tag}.exit"
            echo "${tag}: exit ${rc}"
          done
          exit 0

      - name: Analyze common-grid parity responses
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 code/w03_m07_quintessence_probe.py \
            --directory parity_outputs \
            --case REF_LCDM:ref_:nan \
            --case SCF_SPLIT_L0:scf_l0_:0.0 \
            --case M07_P0025:scf_p0025_:0.025 \
            --case M07_M0025:scf_m0025_:-0.025 \
            --case M07_P0075:scf_p0075_:0.075 \
            --case M07_M0075:scf_m0075_:-0.075 \
            --json parity_probe_result.json
          python3 code/w03_m07_parity_coordinate_audit.py \
            parity_probe_result.json --json m07_parity_result.json

      - name: Enforce frozen target and parity gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for tag in ref scf_l0 scf_p0025 scf_m0025 scf_p0075 scf_m0075; do
            test "$(cat parity_logs/${tag}.exit)" = "0"
          done
          test -f parity_probe_result.json
          test -f m07_parity_result.json
          python3 - "$OMEGA_SCF_TARGET" "$OMEGA_TOL" <<'PY'
          import json,sys
          target,tol=map(float,sys.argv[1:])
          d=json.load(open('parity_probe_result.json'))
          for c in d['cases']:
              if c['label'].startswith('M07_') or c['label']=='SCF_SPLIT_L0':
                  err=abs(c['background']['Omega_scf_today']-target)
                  print(c['label'],'Omega_error=',err)
                  if err>tol:
                      raise SystemExit(f"{c['label']} Omega target error {err} > {tol}")
          p=json.load(open('m07_parity_result.json'))
          if not p['all_parity_gates_pass']:
              raise SystemExit('parity gate failed')
          print('M07_PARITY_COORDINATE_AUDIT=PASS')
          PY

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo "OMEGA_SCF_TARGET=${OMEGA_SCF_TARGET}"
            echo "SHOOT_REL_TOL=${SHOOT_REL_TOL}"
            echo 'PREREGISTERED_ODD_FRACTION_MAX=1e-3'
          } > parity_provenance.txt

      - name: Upload immutable parity bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m07-parity-coordinate-audit
          path: |
            parity_probe_result.json
            m07_parity_result.json
            parity_provenance.txt
            parity_configs/
            parity_outputs/
            parity_logs/
          if-no-files-found: error
          retention-days: 90
