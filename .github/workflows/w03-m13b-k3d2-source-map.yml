name: W03 M13b K3D2 exact-pin SCF source map

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2-source-map.yml'

permissions:
  contents: write

jobs:
  source_map:
    runs-on: ubuntu-22.04
    env:
      CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact CLASS pin
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
      - name: Extract exact SCF contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p waves/wave_03_expanded_dark_energy
          python3 - <<'PY'
          from pathlib import Path
          import json

          pin='64bbab707faf4de4779a9e04edd180fef18d98fa'
          files=[
              'include/background.h',
              'source/background.c',
              'source/input.c',
              'include/perturbations.h',
              'source/perturbations.c',
          ]
          needles=[
              'Omega0_scf','has_scf','scf_parameters','phi_ini_scf','phi_prime_ini_scf',
              'index_bg_phi_scf','index_bg_rho_scf','index_bi_phi_scf','V_scf(','dV_scf(','ddV_scf(',
              'index_pt_phi_scf','index_pt_phi_prime_scf','delta_rho_scf','delta_p_scf','rho_plus_p_theta_scf'
          ]
          out=[]
          records=[]
          for rel in files:
              lines=Path('provider',rel).read_text(encoding='utf-8').splitlines()
              hit=set()
              for i,line in enumerate(lines):
                  if any(n in line for n in needles):
                      hit.add(i)
              # merge +/- 3 line windows
              idx=sorted({j for i in hit for j in range(max(0,i-3),min(len(lines),i+4))})
              out.append(f'===== {rel} =====')
              prev=None
              for j in idx:
                  if prev is not None and j>prev+1:
                      out.append('...')
                  out.append(f'{j+1:06d}: {lines[j]}')
                  prev=j
              out.append('')
              records.append({'file':rel,'line_count':len(lines),'match_lines':[i+1 for i in sorted(hit)]})
          Path('waves/wave_03_expanded_dark_energy/M13B_K3D2_EXACT_PIN_SCF_SOURCE_MAP.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          Path('waves/wave_03_expanded_dark_energy/M13B_K3D2_EXACT_PIN_SCF_SOURCE_MAP.json').write_text(json.dumps({
              'schema':'KMDSB.W03.M13b.K3D2ExactPinScfSourceMap.v0.1',
              'provider':'lesgourg/class_public',
              'provider_commit':pin,
              'files':records,
              'science_result':False,
              'changes_provider_source':False,
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Persist source map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add waves/wave_03_expanded_dark_energy/M13B_K3D2_EXACT_PIN_SCF_SOURCE_MAP.txt \
                  waves/wave_03_expanded_dark_energy/M13B_K3D2_EXACT_PIN_SCF_SOURCE_MAP.json
          git diff --cached --quiet && exit 0
          git commit -m 'map exact-pin CLASS scf source for M13b K3D2'
          git pull --rebase origin main
          git push origin HEAD:main
