name: W03 M14 IDECAMB coupled inner IC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m14-idecamb-coupled-inner-ic.yml'
      - 'protocol/W03_M14_IDECAMB_COUPLED_INNER_IC_PREREGISTRATION_v0.1.md'

permissions:
  contents: write

jobs:
  coupled-inner-ic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran libblas-dev liblapack-dev make rsync python3

      - name: Fetch pinned provider and apply diagnostic initial state
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/cmbant/CosmoMC.git cosmomc_base
          git -C cosmomc_base checkout eb08c2fe91d9711929802fede310ae58c020fcb4
          git clone https://github.com/liaocrane/IDECAMB.git idecamb_patch
          git -C idecamb_patch checkout 4f1093d9efe46f28cf7e2acb4d07ae116ad5e075
          rsync -a --exclude='.git' idecamb_patch/ cosmomc_base/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cosmomc_base/camb/equations_ppfi.f90')
          s=p.read_text()
          old=("            y(i_phi) = const*a**(4/(2._dl+CQP%alpha))\n"
               "            y(i_pdot2)=y(i_phi)*4*adotrad/(2._dl+CQP%alpha)*a")
          new=("            if(abs(CQP%beta)>0._dl) then\n"
               "                y(i_phi)=CQP%beta*grhoc*a/(2._dl*adotrad**2)\n"
               "                y(i_pdot2)=CQP%beta*grhoc*a**2/(2._dl*adotrad)\n"
               "            else\n"
               "                y(i_phi) = const*a**(4/(2._dl+CQP%alpha))\n"
               "                y(i_pdot2)=y(i_phi)*4*adotrad/(2._dl+CQP%alpha)*a\n"
               "            end if")
          if s.count(old)!=1: raise SystemExit(f'IC block count={s.count(old)}')
          s=s.replace(old,new,1)
          q="write (1,'(11E15.5)')"
          if s.count(q)!=1: raise SystemExit(f'quantity format count={s.count(q)}')
          s=s.replace(q,"write (1,'(11ES25.15E3)')",1)
          # Instrument the coupled-quintessence shooting result without changing the update.
          anchor='        subroutine GetCorrect_initial\n'
          cq=s.find(anchor)
          if cq<0: raise SystemExit('CQ GetCorrect_initial not found')
          loop_end='        end do\n        contains\n'
          j=s.find(loop_end,cq)
          if j<0: raise SystemExit('CQ Broyden loop end not found')
          ins="        write(*,'(A,1X,I0,1X,3ES25.15E3)') 'KMDSB_SHOOTING_FINAL', i, x0(1), x0(2), sqrt(sum(f0**2))\n"
          s=s[:j+len('        end do\n')]+ins+s[j+len('        end do\n'):]
          p.write_text(s)
          Path('inner_ic_patch_manifest.txt').write_text(
              'provider=liaocrane/IDECAMB@4f1093d9efe46f28cf7e2acb4d07ae116ad5e075\n'
              'global_amin=unchanged_1e-12\n'
              'beta0_ic=upstream_uncoupled_tracker\n'
              'betapos_ic=leading_coupling_dominated_radiation_particular_solution\n'
              'broyden_update=upstream_unchanged\n'
              'physics_evolution_equations_changed=false\n')
          PY
          set +e
          make -C cosmomc_base cosmomc BUILD= FFLAGS='-cpp -O3 -ffast-math -ffree-line-length-none -fopenmp -fmax-errors=4 -fallow-argument-mismatch' > build.log 2>&1
          echo "$?" > build.exit
          set -e

      - name: Prepare frozen beta grid
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('cosmomc_base/test_ide.ini').read_text()
          likes=['DEFAULT(batch3/plik_rd12_HM_v22_TTTEEE.ini)','DEFAULT(batch3/lowl.ini)','DEFAULT(batch3/lowE.ini)','DEFAULT(batch3/lensing.ini)','DEFAULT(batch3/BAO.ini)','DEFAULT(batch3/Pantheon18.ini)']
          for tag,beta in [('b0','0'),('b5e8','0.00000005'),('b1e7','0.00000010')]:
              s=base
              for old,new in [
                  ('Class_IDE = 1 ','Class_IDE = 2 '),
                  ('param[alpha_quint]= 0.02 0 1.4 0.1 0.1','param[alpha_quint]= 0.02'),
                  ('param[beta_cq]= 0.01 0 0.15 0.05 0.05',f'param[beta_cq]= {beta}'),
                  ('#test_output_root = output_ide',f'test_output_root = m14ic_{tag}'),
                  ('test_check_compare = 1820.775','#test_check_compare = 1820.775')]:
                  if s.count(old)!=1: raise SystemExit(f'{tag}: {old!r} count={s.count(old)}')
                  s=s.replace(old,new,1)
              for x in likes:
                  if s.count(x)!=1: raise SystemExit(f'{tag}: likelihood count {x}={s.count(x)}')
                  s=s.replace(x,'#'+x,1)
              Path(f'{tag}.ini').write_text(s)
          PY

      - name: Execute coupling-aware initial-state grid
        shell: bash
        run: |
          set +e
          : > case_exits.tsv
          if [ "$(cat build.exit)" != "0" ]; then exit 0; fi
          for tag in b0 b5e8 b1e7; do
            cp "${tag}.ini" "cosmomc_base/${tag}.ini"
            (cd cosmomc_base && rm -f "m14ic_${tag}"* && ./cosmomc "${tag}.ini") > "${tag}.log" 2>&1
            echo -e "${tag}\t$?" >> case_exits.tsv
          done
          exit 0

      - name: Analyze frozen response
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib,re
          build=int(pathlib.Path('build.exit').read_text()); exits={}
          for line in pathlib.Path('case_exits.tsv').read_text().splitlines() if pathlib.Path('case_exits.tsv').exists() else []:
              if line.strip(): k,v=line.split(); exits[k]=int(v)
          tags=['b0','b5e8','b1e7']; data={}; shooting={}; ok=build==0 and all(exits.get(t)==0 for t in tags)
          def load(p):
              out=[]
              for line in pathlib.Path(p).read_text(errors='replace').splitlines():
                  y=line.strip()
                  if not y or y.startswith('#'): continue
                  try: out.append([float(x.replace('D','E').replace('d','e')) for x in y.split()])
                  except Exception: pass
              return out
          for t in tags:
              log=pathlib.Path(f'{t}.log').read_text(errors='replace') if pathlib.Path(f'{t}.log').exists() else ''
              m=re.findall(r'KMDSB_SHOOTING_FINAL\s+(\d+)\s+([+\-0-9.Ee]+)\s+([+\-0-9.Ee]+)\s+([+\-0-9.Ee]+)',log)
              shooting[t]=None
              if m:
                  ii,u,p,r=m[-1]; shooting[t]={'iterations':int(ii),'gU0':float(u),'gphi0':float(p),'residual_norm':float(r)}
              q=pathlib.Path('cosmomc_base')/f'm14ic_{t}.quantity'; c=pathlib.Path('cosmomc_base')/f'm14ic_{t}.theory_cl'
              if not q.exists() or not c.exists(): ok=False; data[t]=([],[]); continue
              qq,cc=load(q),load(c); data[t]=(qq,cc)
              if len(qq)!=2000 or any(len(r)!=11 for r in qq) or len(cc)!=2499 or any(len(r)!=6 for r in cc): ok=False
              if any(not math.isfinite(v) for r in qq for v in r) or any(not math.isfinite(v) for r in cc for v in r): ok=False
              if 'The cosmological model is coupled quintessence model' not in log: ok=False
          names=['dln_rho_de','dln_rho_c','dln_H','dw','qhat','dln_TT','dln_EE','dln_PP']
          def response(tag):
              q0,c0=data['b0']; q,c=data[tag]; ch={n:[] for n in names}; tiny=1e-300
              if len(q)!=len(q0) or len(c)!=len(c0): raise ValueError('shape mismatch')
              for r0,r in zip(q0,q):
                  if r0[0]!=r[0]: raise ValueError('a grid')
                  for n,j in [('dln_rho_de',2),('dln_rho_c',3),('dln_H',4)]:
                      if r0[j]>0 and r[j]>0: ch[n].append(math.log(r[j]/r0[j]))
                  ch['dw'].append(r[5]-r0[5]); ch['qhat'].append(r[6]/(abs(r[4])*(abs(r[2])+abs(r[3]))+tiny))
              for r0,r in zip(c0,c):
                  if r0[0]!=r[0]: raise ValueError('ell grid')
                  for n,j in [('dln_TT',1),('dln_EE',3),('dln_PP',5)]:
                      if r0[j]>0 and r[j]>0: ch[n].append(math.log(r[j]/r0[j]))
              if any(not ch[n] for n in names): raise ValueError('empty channel')
              return ch
          result={
              'schema':'KMDSB.W03.M14.IDECAMBCoupledInnerIC.v0.1',
              'grid':[0,5e-8,1e-7],
              'global_amin':1e-12,
              'case_exits':exits,
              'shooting':shooting,
              'initial_state':'beta0_upstream_tracker_beta_positive_leading_coupling_radiation_inner',
              'broyden_update':'upstream_unchanged',
              'upstream_high_precision_metrics':{'relative_norm_mismatch':0.009270610485819343,'angle_deg':8.04171613320909},
              'physical_falsification_authorized':False,
              'observational_claim_authorized':False,
              'scientific_provider_promotion_authorized':False
          }
          if not ok:
              result['classification']='M14_IDECAMB_INNER_IC_DIAGNOSTIC_BLOCKED'; result['K4_diagnostic']='NOT_SCORED'
          else:
              try:
                  a=response('b5e8'); b=response('b1e7'); ta=[];tb=[]; channel={}; fine_max=0.
                  for n in names:
                      if len(a[n])!=len(b[n]): raise ValueError('channel mismatch')
                      ta += [x/5e-8 for x in a[n]]; tb += [x/1e-7 for x in b[n]]
                      mx=max(abs(x) for x in a[n]); fine_max=max(fine_max,mx)
                      channel[n]={'fine_max_abs':mx,'fine_norm':math.sqrt(sum(x*x for x in a[n])),'points':len(a[n])}
                  na=math.sqrt(sum(x*x for x in ta)); nb=math.sqrt(sum(x*x for x in tb)); cs=max(-1.,min(1.,sum(x*y for x,y in zip(ta,tb))/(na*nb)))
                  mismatch=abs(na-nb)/max(na,nb); angle=math.degrees(math.acos(cs)); passed=mismatch<=0.10 and angle<=3.0
                  result['metrics']={'relative_norm_mismatch':mismatch,'norm_threshold':0.10,'angle_deg':angle,'angle_threshold_deg':3.0,'fine_max_abs_response':fine_max,'channel_metrics':channel}
                  result['K4_diagnostic']='PASS_COUPLING_AWARE_INNER_IC' if passed else 'FAIL_COUPLING_AWARE_INNER_IC'
                  if passed:
                      result['classification']='M14_IDECAMB_UPSTREAM_IC_NONUNIFORMITY_CAUSAL_SUPPORT'
                  elif angle < 0.5*8.04171613320909:
                      result['classification']='M14_IDECAMB_INNER_IC_PARTIAL_CAUSAL_SUPPORT'
                  else:
                      result['classification']='M14_IDECAMB_INNER_IC_NOT_SUFFICIENT'
              except Exception as e:
                  result['classification']='M14_IDECAMB_INNER_IC_ANALYZER_BLOCKED'; result['K4_diagnostic']='NOT_SCORED'; result['error']=repr(e)
          pathlib.Path('m14_coupled_inner_ic.json').write_text(json.dumps(result,indent=2,allow_nan=False)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Persist canonical diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          cp m14_coupled_inner_ic.json /tmp/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p waves/wave_03_expanded_dark_energy models/coupled_quintessence
          cp /tmp/result.json waves/wave_03_expanded_dark_energy/M14_IDECAMB_COUPLED_INNER_IC_RESULT.json
          cp /tmp/result.json models/coupled_quintessence/idecamb_coupled_inner_ic.json
          git add waves/wave_03_expanded_dark_energy/M14_IDECAMB_COUPLED_INNER_IC_RESULT.json models/coupled_quintessence/idecamb_coupled_inner_ic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record IDECAMB M14 coupling-aware inner-IC control'
            git push origin HEAD:main
          fi

      - name: Upload immutable diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m14-idecamb-coupled-inner-ic
          path: |
            m14_coupled_inner_ic.json
            inner_ic_patch_manifest.txt
            build.log
            build.exit
            case_exits.tsv
            b0.ini
            b5e8.ini
            b1e7.ini
            b0.log
            b5e8.log
            b1e7.log
            cosmomc_base/m14ic_*.quantity
            cosmomc_base/m14ic_*.theory_cl
          retention-days: 90
