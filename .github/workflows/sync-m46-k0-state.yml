name: Sync M46 K0 state

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-m46-k0-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical M46 matrix and census state
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          p=Path('matrices/mandatory_properties_matrix.csv')
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); found=False
          for r in rows:
              if r['family_id']=='F46':
                  found=True
                  r['K0_provenance']='PASS_WITH_SCOPE'
                  for k in ['K1_reference_limit','K2_physical_geometry','K3_conservation_gauge_closure','K4_numerical_robustness','K5_multichannel_rank','K6_nearest_family_manifold','K7_common_observation_space','K8_quotient_novelty','K9_prospective_holdout']:
                      r[k]='OPEN'
                  r['coverage_state']='K0_KNOWN_SECTOR_MASSIVE_NEUTRINO_COMPARATOR_PASS_K1_K9_OPEN'
                  r['notes']='Known-sector comparator: pinned native CLASS massless-neutrino control and one 0.06 eV massive-neutrino arm both execute at exact provider pin with finite TT/P(k). Massive-neutrino TT normalized-L2 response is 0.00322344 > frozen 1e-6 negative-control threshold. K0 PASS_WITH_SCOPE only; no neutrino-mass constraint and K1-K9 remain open.'
          if not found: raise SystemExit('F46 matrix row missing')
          t=p.with_suffix('.tmp')
          with t.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          t.replace(p)

          p=Path('matrices/model_family_census.csv')
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); found=False
          for r in rows:
              if r['family_id']=='F46':
                  found=True
                  # Current census columns include benchmark/status near the middle; replace only exact queued comparator status.
                  for k,v in list(r.items()):
                      if v=='QUEUED_COMPARATOR': r[k]='K0_KNOWN_SECTOR_MASSIVE_NEUTRINO_COMPARATOR_PASS_K1_K9_OPEN'
                  r[fields[-1]]='Pinned native CLASS known-sector massive-neutrino comparator K0 PASS_WITH_SCOPE: massless control and 0.06 eV arm execute with exact pin and finite TT/P(k); TT response is active above frozen threshold. This remains an external known-sector comparator, not a dark-sector candidate; K1-K9 and subtraction/nearest-family use remain open.'
          if not found: raise SystemExit('F46 census row missing')
          t=p.with_suffix('.tmp')
          with t.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          t.replace(p)
          PY
      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/mandatory_properties_matrix.csv matrices/model_family_census.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync M46 massive-neutrino comparator K0 state'
          git push
