name: W04 M25 CLASS bridge qmax4000 recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m25-class-bridge-qmax4000-recovery.yml'

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      RECOVERY_PREREG: protocol/W04_M25_CLASS_BRIDGE_QUADRATURE_CAP_RECOVERY_PREREGISTRATION_v0.1.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download immutable upstream M25 provider artifact
        uses: actions/download-artifact@v4
        with:
          name: w04-m25-resonant-sterile-dm-provider-control
          path: m25_upstream
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34544624039
      - name: Pin CLASS and apply frozen capacity-only repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy cython setuptools wheel
          git clone -q https://github.com/lesgourg/class_public.git class_provider
          git -C class_provider checkout -q --detach "$CLASS_PIN"
          test "$(git -C class_provider rev-parse HEAD)" = "$CLASS_PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class_provider/include/common.h')
          s=p.read_text()
          old='#define _QUADRATURE_MAX_BG_ 800'
          new='#define _QUADRATURE_MAX_BG_ 4000'
          assert s.count(old)==1, s.count(old)
          s2=s.replace(old,new)
          assert s2.count(new)==1
          p.write_text(s2)
          PY
          git -C class_provider diff -- include/common.h | tee m25_qmax4000_class_patch.diff
          test "$(grep -c '^[-+]#define _QUADRATURE_MAX_BG_' m25_qmax4000_class_patch.diff)" -eq 2
          python3 -m pip install --disable-pip-version-check --no-input ./class_provider > m25_qmax4000_class_install.log 2>&1
      - name: Execute unchanged frozen density bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/m25/m25_class_bridge.py m25_upstream m25_qmax4000_work m25_qmax4000_base_result.json
          cat m25_qmax4000_base_result.json
      - name: Map to frozen recovery classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.load(open('m25_qmax4000_base_result.json'))
          c=base.get('classification')
          if c=='M25_CLASS_BRIDGE_DENSITY_VALIDATED':
              rc='M25_CLASS_BRIDGE_QMAX4000_DENSITY_VALIDATED'
          elif c=='M25_CLASS_BRIDGE_DENSITY_NOT_VALIDATED':
              rc='M25_CLASS_BRIDGE_QMAX4000_DENSITY_NOT_VALIDATED'
          else:
              rc='M25_CLASS_BRIDGE_QMAX4000_BLOCKED'
          out={
              'schema':'KMDSB.M25.PSDClassBridge.Qmax4000Recovery.v1',
              'recovery_preregistration':'protocol/W04_M25_CLASS_BRIDGE_QUADRATURE_CAP_RECOVERY_PREREGISTRATION_v0.1.md',
              'parent_run':34545741673,
              'parent_result_commit':'2f460716a0b2af96d0fac671a65066f609e6a543',
              'sterile_provider_pin':'e4486265e8207aa0dd28decc8c8d897266c0a52a',
              'class_pin':'e85808324f51fc694d12e3ed7439552a3c3f9540',
              'quadrature_max_bg_original':800,
              'quadrature_max_bg_recovery':4000,
              'tol_ncdm_bg_changed':False,
              'physics_changed':False,
              'K1_promoted':False,
              'physical_falsification':False,
              'classification':rc,
              'base_classification':c,
              'models':base.get('models',{}),
          }
          if 'error' in base:
              out['error']=base['error']
          Path('m25_qmax4000_recovery_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist canonical recovery result
        shell: bash
        run: |
          set -euo pipefail
          cp m25_qmax4000_recovery_result.json /tmp/m25_qmax4000_recovery_result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p models/resonant_sterile_neutrino_wdm waves/wave_04_dark_matter
          cp /tmp/m25_qmax4000_recovery_result.json models/resonant_sterile_neutrino_wdm/M25_CLASS_BRIDGE_QMAX4000_RECOVERY_RESULT.json
          cp /tmp/m25_qmax4000_recovery_result.json waves/wave_04_dark_matter/M25_CLASS_BRIDGE_QMAX4000_RECOVERY_RESULT.json
          git add models/resonant_sterile_neutrino_wdm/M25_CLASS_BRIDGE_QMAX4000_RECOVERY_RESULT.json waves/wave_04_dark_matter/M25_CLASS_BRIDGE_QMAX4000_RECOVERY_RESULT.json
          git diff --cached --quiet || { git commit -m 'Record M25 qmax4000 CLASS bridge recovery'; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Enforce frozen recovery semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/m25_qmax4000_recovery_result.json'))
          allowed={'M25_CLASS_BRIDGE_QMAX4000_BLOCKED','M25_CLASS_BRIDGE_QMAX4000_DENSITY_NOT_VALIDATED','M25_CLASS_BRIDGE_QMAX4000_DENSITY_VALIDATED'}
          assert r['classification'] in allowed
          assert r['quadrature_max_bg_original']==800 and r['quadrature_max_bg_recovery']==4000
          assert r['tol_ncdm_bg_changed'] is False
          assert r['physics_changed'] is False
          assert r['K1_promoted'] is False
          assert r['physical_falsification'] is False
          PY
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-m25-class-bridge-qmax4000-recovery
          path: |
            m25_qmax4000_class_patch.diff
            m25_qmax4000_class_install.log
            m25_qmax4000_work/
            m25_qmax4000_base_result.json
            m25_qmax4000_recovery_result.json
          retention-days: 90
