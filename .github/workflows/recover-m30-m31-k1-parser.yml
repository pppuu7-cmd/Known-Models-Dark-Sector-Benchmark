name: Recover M30 M31 K1 parser

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-m30-m31-k1-parser.yml'

permissions:
  actions: read
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        model: [M30, M31]
    runs-on: ubuntu-22.04
    env:
      HICLASS_PIN: 0009f51d89e6465c79e570b496c66fc90058fa77
      SOURCE_RUN: 34656276938
    steps:
      - uses: actions/checkout@v4
      - name: Install recovery analyzer dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-numpy >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model }}-k1-reference-limit
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34656276938
      - name: Reclassify unchanged canonical outputs with actual hi_class filenames
        shell: bash
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'; BASE="$GITHUB_WORKSPACE/downloaded/k1_${MODEL}"
          python3 - "$BASE" <<'PY'
          import json,pathlib,sys
          b=pathlib.Path(sys.argv[1]); arms=[]
          for label,x in [('s1',1.0),('s01',0.1),('s001',0.01),('s0001',0.001)]:
              arms.append({'label':label,'x':x,'cl':str(b/f'{label}_00_cl.dat'),'pk':str(b/f'{label}_00_pk.dat'),'exit':int((b/f'{label}.exit').read_text())})
          pathlib.Path('arms_recovered.json').write_text(json.dumps(arms))
          PY
          python3 verification/k1/decoupling_ladder.py \
            --model "$MODEL" --provider-commit "$(cat downloaded/provider_commit.txt)" --expected-commit "$HICLASS_PIN" \
            --reference-cl "$BASE/ref_00_cl.dat" --reference-pk "$BASE/ref_00_pk.dat" \
            --arms-json arms_recovered.json --out "${MODEL}_k1_recovered_result.json" \
            --scope 'pinned hi_class propto_omega family; joint alpha-coefficient scaling to zero with M2_ini=1 and LCDM expansion fixed; parser recovery only from source run 34656276938'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-k1-recovered
          path: |
            ${{ matrix.model }}_k1_recovered_result.json
            arms_recovered.json
          retention-days: 30
