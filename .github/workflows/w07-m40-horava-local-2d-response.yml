name: W07 M40 Horava local 2D response

on:
  push:
    paths:
      - '.github/workflows/w07-m40-horava-local-2d-response.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EFTCAMB_PIN: '16d9c4e9f85751e30efd0a53b177941713078904'

jobs:
  local-2d-response:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install and build exact pinned EFTCAMB
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libblas-dev liblapack-dev python3-numpy >/dev/null
          git clone -q https://github.com/EFTCAMB/EFTCAMB.git provider
          git -C provider checkout -q --detach "$EFTCAMB_PIN"
          git -C provider submodule update --init --recursive
          test "$(git -C provider rev-parse HEAD)" = "$EFTCAMB_PIN"
          (cd provider/fortran && make clean >/dev/null 2>&1 || true; make camb >/dev/null)
          git -C provider rev-parse HEAD > provider_commit.txt
      - name: Generate prospectively frozen symmetric stencil
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40_local2d"; mkdir -p "$BASE"
          python3 - "$BASE" <<'PY'
          import pathlib,re,sys
          b=pathlib.Path(sys.argv[1]); p=pathlib.Path('provider/fortran/eftcamb_test/parameters').resolve()
          src=(p/'5_Horava_eta_3.ini').read_text(); include=str((p/'base_params.ini').resolve())
          src=re.sub(r'(?m)^\s*DEFAULT\(base_params\.ini\)\s*$', f'DEFAULT({include})', src)
          # base q=0.1 on the validated K1 ray; eta-only coordinate is varied independently.
          specs={
            'base':(-1.0e-4, 1.0e-4, 2.1e-3),
            'rp2':(-1.02e-4, 1.02e-4, 2.142e-3),
            'rm2':(-0.98e-4, 0.98e-4, 2.058e-3),
            'rp1':(-1.01e-4, 1.01e-4, 2.121e-3),
            'rm1':(-0.99e-4, 0.99e-4, 2.079e-3),
            'ep2':(-1.0e-4, 1.0e-4, 2.142e-3),
            'em2':(-1.0e-4, 1.0e-4, 2.058e-3),
            'ep1':(-1.0e-4, 1.0e-4, 2.121e-3),
            'em1':(-1.0e-4, 1.0e-4, 2.079e-3),
          }
          for tag,(xi,lam,eta) in specs.items():
              t=src
              for key,val in [('Horava_xi',xi),('Horava_lambda',lam),('Horava_eta',eta)]:
                  t=re.sub(rf'(?m)^\s*{key}\s*=.*$', f'{key} = {val:.16g}', t)
              t=re.sub(r'(?m)^\s*output_root\s*=.*$', f'output_root = {b}/{tag}_', t)
              (b/f'{tag}.ini').write_text(t)
          (b/'FROZEN_STENCIL.txt').write_text('R: q0=.1 with h=.002/.001 on (-.001q,+.001q,.021q); E: eta-only h=4.2e-5/2.1e-5 at fixed xi=-1e-4, lambda=+1e-4. Thresholds: derivative angle<=5 deg, norm mismatch<=0.25, cross-angle>=10 deg.\n')
          PY
          grep -H -E '^(Horava_xi|Horava_lambda|Horava_eta|output_root|DEFAULT)' "$BASE"/*.ini | tee "$BASE/frozen_config_extract.txt"
      - name: Execute base and both central-difference directions
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40_local2d"
          set +e
          for tag in base rp2 rm2 rp1 rm1 ep2 em2 ep1 em1; do
            (cd provider/fortran && ./camb "$BASE/${tag}.ini" > "$BASE/${tag}.stdout" 2> "$BASE/${tag}.stderr")
            echo $? > "$BASE/${tag}.exit"
          done
          set -e
      - name: Analyze frozen local 2D response geometry
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40_local2d"
          python3 - "$BASE" <<'PY'
          import json,math,pathlib,sys
          import numpy as np
          b=pathlib.Path(sys.argv[1]); expected='16d9c4e9f85751e30efd0a53b177941713078904'; pin=pathlib.Path('provider_commit.txt').read_text().strip()
          tags=['base','rp2','rm2','rp1','rm1','ep2','em2','ep1','em1']; exits={t:int((b/f'{t}.exit').read_text()) for t in tags}
          out={'schema':'m40_horava_local_2d_response_v0.1','model_id':'M40','family_id':'F40',
               'protocol':'protocol/W07_M40_HORAVA_LOCAL_2D_RESPONSE_PREREGISTRATION_v0.1.md','provider_commit':pin,'expected_commit':expected,
               'base_point':{'Horava_xi':-1e-4,'Horava_lambda':1e-4,'Horava_eta':2.1e-3},
               'radial_q0':0.1,'radial_coarse_h':0.002,'radial_fine_h':0.001,'eta_coarse_h':4.2e-5,'eta_fine_h':2.1e-5,
               'exits':exits,'K2_promoted':False,'physical_falsification':False,'complete_Horava_family_claim':False}
          if pin!=expected or exits['base']!=0:
              out['classification']='M40_LOCAL_2D_RESPONSE_CONTROL_BLOCKED'
          elif any(exits[t]!=0 for t in tags[1:]):
              out['classification']='M40_LOCAL_2D_RESPONSE_PROVIDER_BLOCKED'; out['failed_arms']=[t for t in tags[1:] if exits[t]!=0]
          else:
              def load(path):
                  rows=[]
                  for line in pathlib.Path(path).read_text(errors='replace').splitlines():
                      s=line.strip()
                      if not s or s.startswith('#'): continue
                      try: rows.append([float(x) for x in s.split()])
                      except ValueError: pass
                  a=np.asarray(rows,float)
                  if a.ndim!=2 or len(a)<5 or a.shape[1]<2 or not np.isfinite(a).all(): raise RuntimeError(f'bad table {path}')
                  return a
              cls={t:load(b/f'{t}__scalCls.dat') for t in tags}; pks={t:load(b/f'{t}__matterpower.dat') for t in tags}
              maps={t:{int(r[0]):np.asarray(r[1:],float) for r in cls[t] if np.isfinite(r[0])} for t in tags}
              common_ell=sorted(set.intersection(*(set(maps[t]) for t in tags)))
              cmb={t:[] for t in tags}
              for ell in common_ell:
                  n=min(len(maps[t][ell]) for t in tags)
                  for j in range(n):
                      vals=[maps[t][ell][j] for t in tags]
                      if all(np.isfinite(v) for v in vals):
                          for t,v in zip(tags,vals): cmb[t].append(v)
              cmb={t:np.asarray(cmb[t],float) for t in tags}
              if len(cmb['base'])<5 or any(len(cmb[t])!=len(cmb['base']) for t in tags): raise RuntimeError('global CMB support invalid')
              cnorm=float(np.linalg.norm(cmb['base']))
              lo=max(float(np.nanmin(pks[t][:,0])) for t in tags); hi=min(float(np.nanmax(pks[t][:,0])) for t in tags)
              bp=pks['base']; mask=(bp[:,0]>=lo)&(bp[:,0]<=hi)&np.isfinite(bp[:,0])&np.isfinite(bp[:,1]); x=bp[mask,0]
              pk={t:(bp[mask,1] if t=='base' else np.interp(x,pks[t][:,0],pks[t][:,1])) for t in tags}
              pmask=np.ones(len(x),dtype=bool)
              for t in tags: pmask &= np.isfinite(pk[t])
              x=x[pmask]; pk={t:np.asarray(pk[t][pmask],float) for t in tags}; pnorm=float(np.linalg.norm(pk['base']))
              if cnorm==0 or pnorm==0 or len(x)<5: raise RuntimeError('invalid base norm/support')
              out['global_support']={'cmb_values':int(len(cmb['base'])),'pk_values':int(len(x)),'ell_count':int(len(common_ell)),'pk_k_min':float(x.min()),'pk_k_max':float(x.max())}
              def central(plus,minus,h):
                  c=(cmb[plus]-cmb[minus])/(2*h*cnorm); p=(pk[plus]-pk[minus])/(2*h*pnorm)
                  return np.concatenate([c,p]),{'cmb_block_norm':float(np.linalg.norm(c)),'pk_block_norm':float(np.linalg.norm(p))}
              rc,rcm=central('rp2','rm2',0.002); rf,rfm=central('rp1','rm1',0.001)
              ec,ecm=central('ep2','em2',4.2e-5); ef,efm=central('ep1','em1',2.1e-5)
              def geom(a,c):
                  na=float(np.linalg.norm(a)); nb=float(np.linalg.norm(c))
                  if na==0 or nb==0: raise RuntimeError('zero derivative norm')
                  co=float(np.dot(a,c)/(na*nb)); co=max(-1.0,min(1.0,co)); ang=float(math.degrees(math.acos(abs(co))))
                  return {'cosine':co,'absolute_cosine':abs(co),'principal_angle_deg':ang,'relative_norm_mismatch':abs(na-nb)/max(na,nb),'norm_a':na,'norm_b':nb}
              rg=geom(rc,rf); eg=geom(ec,ef); cross=geom(rf,ef); cross['sin_principal_angle']=float(math.sin(math.radians(cross['principal_angle_deg'])))
              rp=rg['principal_angle_deg']<=5.0 and rg['relative_norm_mismatch']<=0.25
              ep=eg['principal_angle_deg']<=5.0 and eg['relative_norm_mismatch']<=0.25
              sep=cross['principal_angle_deg']>=10.0
              out.update({'radial_central_convergence':rg,'eta_central_convergence':eg,'fine_cross_direction_geometry':cross,
                          'radial_coarse_meta':rcm,'radial_fine_meta':rfm,'eta_coarse_meta':ecm,'eta_fine_meta':efm,
                          'radial_derivative_converged':rp,'eta_derivative_converged':ep,'cross_direction_separated':sep})
              if not (rp and ep): out['classification']='M40_LOCAL_2D_RESPONSE_DERIVATIVE_NOT_CONVERGED'
              elif not sep: out['classification']='M40_LOCAL_2D_RESPONSE_NEAR_COLLINEAR'
              else: out['classification']='M40_LOCAL_2D_RESPONSE_RANK_EVIDENCE'
          pathlib.Path('M40_LOCAL_2D_RESPONSE.json').write_text(json.dumps(out,indent=2)+'\n')
          with open('M40_LOCAL_2D_RESPONSE.md','w') as f:
              f.write('# M40 Hořava local 2D response\n\n')
              f.write(f"Classification: `{out['classification']}`  \n")
              if out.get('radial_central_convergence'):
                  f.write(f"Radial coarse/fine: angle={out['radial_central_convergence']['principal_angle_deg']:.6g} deg, mismatch={out['radial_central_convergence']['relative_norm_mismatch']:.6g}  \n")
                  f.write(f"Eta coarse/fine: angle={out['eta_central_convergence']['principal_angle_deg']:.6g} deg, mismatch={out['eta_central_convergence']['relative_norm_mismatch']:.6g}  \n")
                  f.write(f"Fine radial-vs-eta angle: {out['fine_cross_direction_geometry']['principal_angle_deg']:.6g} deg  \n")
              f.write('\nNo K2 promotion or physical-family exclusion is authorized by this workflow.\n')
          print(pathlib.Path('M40_LOCAL_2D_RESPONSE.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m40-horava-local-2d-response
          path: |
            M40_LOCAL_2D_RESPONSE.json
            M40_LOCAL_2D_RESPONSE.md
            provider_commit.txt
            m40_local2d/
