name: W03 M13b K3D2-F ledger sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w03-m13b-k3d2f-ledger-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize K3D2-F canonical result into ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io
          from pathlib import Path

          marker='M13B_K3D2F_REFERENCE_RK_STANDARD_BOLTZMANN_ABSOLUTE_SCALE_FLOOR_LOCALIZED_2026_09_14'
          note=(marker+': artifact-only audit of K3D2-E finds 349/349 strict-clean terminal RK records at the absolute '
                'error-scale floor of near-zero standard Boltzmann variables; component split photon l>=3 335 and ur_theta 14; '
                'qcf/qpf floor-dominance count 0. Run 34801216990 job 103844119187 artifact 10331557427 '
                'sha256:d4a3099c4d742769c959e019cf398f6499f58270e5234d990fc6381555aefe83. '
                'K3 remains PARTIAL; K4/K5 not promoted; physical_falsification=false.')

          def patch_csv(path, id_field='family_id', id_value='F13'):
            p=Path(path); text=p.read_text(newline='') if False else p.read_text()
            rows=list(csv.DictReader(io.StringIO(text)))
            fields=list(rows[0].keys())
            changed=False
            for r in rows:
              if r.get(id_field)==id_value:
                key='notes'
                if marker not in r.get(key,''):
                  r[key]=(r.get(key,'').rstrip()+(' ' if r.get(key,'').strip() else '')+note)
                  changed=True
            if changed:
              out=io.StringIO(newline='')
              w=csv.DictWriter(out,fieldnames=fields,lineterminator='\n')
              w.writeheader(); w.writerows(rows)
              p.write_text(out.getvalue())

          patch_csv('matrices/model_family_census.csv')
          patch_csv('matrices/mandatory_properties_matrix.csv')

          section=('\n\n### '+marker+'\n'
                   '- Canonical result: `waves/wave_03_expanded_dark_energy/M13B_K3D2F_REFERENCE_RK_SCALE_FLOOR_RESULT.json`.\n'
                   '- Run `34801216990`, job `103844119187`, artifact `10331557427`, digest `sha256:d4a3099c4d742769c959e019cf398f6499f58270e5234d990fc6381555aefe83`.\n'
                   '- 349/349 strict-clean records satisfy the frozen joint `final_yscal<=1.0000000001e-30` and `|final_y|<=1e-16` criterion; near-zero start derivative fraction is also 1.0.\n'
                   '- Dominant final classes: photon temperature hierarchy l>=3: 335; `ur_theta`: 14; direct qcf/qpf floor dominance: 0.\n'
                   '- Interpretation ceiling: reference blocker localized to standard Boltzmann RK absolute-scale-floor behavior at hard re-entry. K3 remains PARTIAL; K4/K5 are not promoted; no physical falsification.\n'
                   '- Next frozen diagnostic: K3D2-G vanilla CLASS split-vs-unsplit RK restart-layer control.\n')
          for path in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
            p=Path(path); t=p.read_text()
            if marker not in t:
              p.write_text(t.rstrip()+section+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          if git diff --cached --quiet; then
            echo 'No ledger changes needed'
          else
            git commit -m 'sync M13b K3D2-F scale-floor localization'
            git push
          fi
