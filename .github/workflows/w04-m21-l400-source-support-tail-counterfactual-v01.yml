name: W04 M21 l400 source support tail counterfactual v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m21-l400-source-support-tail-counterfactual-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RUN: '34907528331'

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download clean recovery aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-transfer-convolution-decomposition-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Download recovered case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen source-support tail counterfactual
        id: analyze
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_source_support_tail_counterfactual.py \
            components \
            parent/M21_L400_TRANSFER_CONVOLUTION_DECOMPOSITION_RESULT.json \
            M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_RESULT.json
      - name: Materialize blocker if analyzer stopped before result
        if: always()
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          if [ ! -f M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_RESULT.json ]; then
            python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_RESULT.json').write_text(json.dumps({
            'schema':'KMDSB.W04.M21.L400SourceSupportTailCounterfactual.v0.1',
            'protocol':'protocol/W04_M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_v0.1.md',
            'classification':'M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_BLOCKED',
            'analysis_outcome':os.environ['OUTCOME'],
            'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False
          },indent=2,sort_keys=True)+'\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-source-support-tail-counterfactual-v01
          path: M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_RESULT.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail only after evidence upload if blocked
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('M21_L400_SOURCE_SUPPORT_TAIL_COUNTERFACTUAL_RESULT.json'))
          if d.get('classification','').endswith('_BLOCKED'): raise SystemExit(1)
          PY
