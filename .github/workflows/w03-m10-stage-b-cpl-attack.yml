name: W03 M10 Stage B CPL manifold attack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m10-stage-b-cpl-attack.yml'
      - 'code/w03_m10_stage_b_cpl_attack.py'
      - 'protocol/W03_M10_STAGE_B_CPL_ATTACK_PREREGISTRATION_V0_1.md'

jobs:
  cpl-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install numpy
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Fetch and build pinned CLASS_EDE
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch class_ede https://github.com/mwt5345/class_ede.git class_ede
          cd class_ede
          git checkout 5a131c91d657dd9a7c6364cc45b038710f8d0d97
          test "$(git rev-parse HEAD)" = "5a131c91d657dd9a7c6364cc45b038710f8d0d97"
          make -j2 class
      - name: Write common reference EDE and CPL cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out logs
          cat > cfg/base.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          N_ur = 3.046
          A_s = 2.1e-9
          n_s = 0.965
          recombination = RECFAST
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 1.2
          write background = yes
          headers = yes
          format = class
          overwrite_root = yes
          EOF
          cp cfg/base.ini cfg/lcdm.ini
          cat >> cfg/lcdm.ini <<EOF
          Omega_fld = 0
          Omega_scf = 0
          root = ${GITHUB_WORKSPACE}/out/lcdm
          EOF
          make_ede () {
            local tag="$1"; local fede="$2"
            cp cfg/base.ini cfg/${tag}.ini
            cat >> cfg/${tag}.ini <<EOF
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = -1
          attractor_ic_scf = no
          scf_parameters = 3,1,1,1,2.6,0.0
          scf_tuning_index = 3
          n_scf = 3
          thetai_scf = 2.6
          CC_scf = 1
          fEDE = ${fede}
          log10z_c = 3.5
          root = ${GITHUB_WORKSPACE}/out/${tag}
          EOF
          }
          make_ede f005 0.005
          make_ede f010 0.01
          make_cpl () {
            local tag="$1"; local w0="$2"; local wa="$3"
            cp cfg/base.ini cfg/${tag}.ini
            cat >> cfg/${tag}.ini <<EOF
          Omega_Lambda = 0
          Omega_scf = 0
          fluid_equation_of_state = CLP
          w0_fld = ${w0}
          wa_fld = ${wa}
          cs2_fld = 1
          use_ppf = yes
          root = ${GITHUB_WORKSPACE}/out/${tag}
          EOF
          }
          make_cpl cpl0 -1.0 0.0
          make_cpl e0p -0.9995 0.0
          make_cpl e0m -1.0005 0.0
          make_cpl wap -1.0 0.0005
          make_cpl wam -1.0 -0.0005
      - name: Run all Stage B cases
        shell: bash
        run: |
          set +e
          for tag in lcdm f005 f010 cpl0 e0p e0m wap wam; do
            ./class_ede/class cfg/${tag}.ini > logs/${tag}.log 2>&1
            echo "$?" > logs/${tag}.exit
          done
          exit 0
      - name: Analyze CPL attack
        shell: bash
        run: |
          set -euo pipefail
          for tag in lcdm f005 f010 cpl0 e0p e0m wap wam; do test "$(cat logs/${tag}.exit)" = "0"; done
          python3 code/w03_m10_stage_b_cpl_attack.py --directory out --json m10_stage_b_cpl_attack.json
      - name: Enforce only preregistered reference bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('m10_stage_b_cpl_attack.json'))
          if not d['cpl_zero_bridge']['pass']:
              raise SystemExit('CPL zero point failed same-solver Lambda bridge')
          print('M10_STAGE_B_IMPLEMENTATION=PASS_WITH_SCOPE')
          print('No post-output novelty threshold is enforced by design.')
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_EDE_HEAD=$(git -C class_ede rev-parse HEAD)"
            echo 'DSIR_OVERLAY=bc28acc47cc5facba046741fd09f710ae8da9689'
            echo 'EDE_TARGET=fEDE local mean of 0.005 and 0.01 at log10zc=3.5,n=3,theta=2.6'
            echo 'CPL_STEP=5e-4'
            echo 'PRIMARY_FIT=P+H then transfer coefficients unchanged to S'
          } > m10_stage_b_provenance.txt
      - name: Upload immutable Stage B bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m10-stage-b-cpl-attack
          path: |
            m10_stage_b_cpl_attack.json
            m10_stage_b_provenance.txt
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
