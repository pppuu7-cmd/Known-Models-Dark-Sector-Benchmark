name: W04 M24 l_logstep convergence ladder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m24-l-logstep-convergence-ladder.yml']
permissions:
  contents: write
jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        logstep: ['1.10','1.08','1.06','1.04','1.03','1.026','1.02']
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned CLASS and prepare frozen cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          make -C class -j2 > build.log 2>&1
          python3 verification/m24/global_numerical_precision_diagnostic.py prepare cases cl_ref
          printf 'idr_streaming_trigger_tau_over_tau_k = 49\n' > control.pre
          cp control.pre profile.pre
          printf 'l_logstep = %s\n' '${{ matrix.logstep }}' >> profile.pre
      - name: Execute ten cases four-at-a-time
        shell: bash
        run: |
          mkdir -p class/output logs parts
          printf '%s\n' default_ref default_zero default_a18k default_a6k default_a1p8k profile_ref profile_zero profile_a18k profile_a6k profile_a1p8k | xargs -P 4 -I{} bash -c '
            t="$1"; set +e
            if [[ "$t" == profile_* ]]; then pre=../profile.pre; else pre=../control.pre; fi
            (cd class && ./class "../cases/${t}.ini" "$pre" > "../logs/${t}.log" 2>&1)
            printf "%d\n" "$?" > "parts/${t}.status"
          ' _ {}
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('status.json').write_text(json.dumps({p.stem:int(p.read_text()) for p in Path('parts').glob('*.status')},sort_keys=True)+'\n')
          PY
      - name: Analyze frozen ladder point
        shell: bash
        env:
          LOGSTEP: ${{ matrix.logstep }}
        run: |
          python3 verification/m24/global_numerical_precision_diagnostic.py analyze class/output status.json cl_ref raw.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('raw.json'))
          r.update({'schema':'KMDSB.M24.LLogstepConvergencePoint.v1','preregistration':'protocol/W04_M24_L_LOGSTEP_CONVERGENCE_LADDER_PREREGISTRATION_v0.1.md','l_logstep':float(os.environ['LOGSTEP']),'provider_default_l_logstep':1.12,'parent_isolation_run_id':34556010712,'K1_promoted':False,'K4_promoted':False,'physical_falsification':False})
          open('result.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m24-l-logstep-${{ matrix.logstep }}
          path: |
            control.pre
            profile.pre
            build.log
            status.json
            result.json
            logs/
            class/output/
          retention-days: 90
  aggregate:
    needs: ladder
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m24-l-logstep-*
          path: collected
      - name: Persist convergence summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          rs=sorted(rs,key=lambda r:r['l_logstep'],reverse=True)
          points=[]
          for r in rs:
              points.append({'l_logstep':r['l_logstep'],'classification':r['classification'],'Emax':r.get('profile',{}).get('Emax'),'exact_identity_pass':r.get('profile',{}).get('exact_identity_pass'),'excursion_factors':r.get('profile',{}).get('excursion_factors')})
          em=[p['Emax'] for p in points]
          monotone=(len(points)==7 and all(v is not None for v in em) and all(em[i+1] <= 1.10*em[i] for i in range(len(em)-1)))
          loc=[p['l_logstep'] for p in points if p['classification']=='M24_GLOBAL_PRECISION_EXCURSION_LOCALIZED']
          first=max(loc) if loc else None
          by={p['l_logstep']:p for p in points}
          a=by.get(1.026,{}).get('Emax'); b=by.get(1.02,{}).get('Emax')
          fine=(a is not None and b is not None and by[1.026]['classification']=='M24_GLOBAL_PRECISION_EXCURSION_LOCALIZED' and by[1.02]['classification']=='M24_GLOBAL_PRECISION_EXCURSION_LOCALIZED' and 2*abs(a-b)/(abs(a)+abs(b)+1e-300) <= 0.25)
          s={'schema':'KMDSB.M24.LLogstepConvergenceLadder.Summary.v1','preregistration':'protocol/W04_M24_L_LOGSTEP_CONVERGENCE_LADDER_PREREGISTRATION_v0.1.md','parent_isolation_run_id':34556010712,'points':points,'first_localized_value':first,'monotone_Emax_with_10pct_slack':monotone,'fine_pair_stability':fine,'classification':'M24_L_LOGSTEP_CONVERGENCE_LADDER_STABLE' if monotone and fine and first is not None else 'M24_L_LOGSTEP_CONVERGENCE_LADDER_NOT_ESTABLISHED','K1_promoted':False,'K4_promoted':False,'physical_falsification':False}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n'); print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/ethos_like_dark_sector
          cp /tmp/summary.json waves/wave_04_dark_matter/M24_L_LOGSTEP_CONVERGENCE_LADDER_SUMMARY.json
          cp /tmp/summary.json models/ethos_like_dark_sector/M24_L_LOGSTEP_CONVERGENCE_LADDER_SUMMARY.json
          git add waves/wave_04_dark_matter models/ethos_like_dark_sector
          git diff --cached --quiet || { git commit -m 'Record M24 l_logstep convergence ladder'; git pull --rebase origin main; git push origin HEAD:main; }
