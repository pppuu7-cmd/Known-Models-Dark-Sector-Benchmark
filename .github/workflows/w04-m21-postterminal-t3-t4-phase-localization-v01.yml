name: W04 M21 post-terminal T3-T4 phase localization v0.1

on:
  push:
    paths:
      - '.github/workflows/w04-m21-postterminal-t3-t4-phase-localization-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PARENT_RUN: '34883823728'

jobs:
  localize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install analyzer dependency
        run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.2.6
      - name: Download terminal T3 artifact
        uses: actions/download-artifact@v4
        with:
          name: m21-ltail-LTAIL_T3
          path: T3
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.PARENT_RUN }}
      - name: Download terminal T4 artifact
        uses: actions/download-artifact@v4
        with:
          name: m21-ltail-LTAIL_T4
          path: T4
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.PARENT_RUN }}
      - name: Compute descriptive T3-T4 phase localization
        run: |
          set -euo pipefail
          python3 verification/m21/ltail_t3_t4_phase_localization.py T3 T4 M21_LTAIL_T3_T4_PHASE_LOCALIZATION_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: m21-ltail-t3-t4-phase-localization-v01
          path: M21_LTAIL_T3_T4_PHASE_LOCALIZATION_RESULT.json
          retention-days: 90
