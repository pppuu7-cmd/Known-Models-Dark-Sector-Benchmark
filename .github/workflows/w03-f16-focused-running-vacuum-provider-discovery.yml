name: W03 F16 focused running-vacuum provider discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-f16-focused-running-vacuum-provider-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOCOL: protocol/W03_F16_FOCUSED_RUNNING_VACUUM_PROVIDER_DISCOVERY_v0.1.md

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: 0
            q: '"running vacuum" cosmology H2'
          - lane: 1
            q: 'rhoLambda H2 nu cosmology'
          - lane: 2
            q: '"Lambda(H)" cosmology'
          - lane: 3
            q: 'Hdot vacuum cosmology'
          - lane: 4
            q: 'RVM CLASS cosmology'
          - lane: 5
            q: '"running vacuum model" perturbation'
          - lane: 6
            q: '"vacuum energy" nu H0 Omega_m cosmology'
          - lane: 7
            q: '"rho vacuum" Hubble "matter exchange"'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact-term code search and source triage
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          QUERY: ${{ matrix.q }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request, time
          token=os.environ['GH_TOKEN']; q=os.environ['QUERY']; lane=int(os.environ['LANE'])
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'KMDSB-F16'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          u='https://api.github.com/search/code?q='+urllib.parse.quote(q)+'&per_page=20'
          try: sr=get(u)
          except Exception as e:
              json.dump({'lane':lane,'query':q,'status':'SEARCH_ERROR','error':repr(e),'candidates':[]},open(f'out/lane_{lane}.json','w'),indent=2); raise
          candidates=[]
          for item in sr.get('items',[]):
              repo=item['repository']['full_name']; path=item['path']; ref=item.get('html_url','').split('/blob/')[-1].split('/')[0] if '/blob/' in item.get('html_url','') else None
              # Fetch current matched blob through contents URL supplied by search.
              try:
                  obj=get(item['url']); import base64
                  text=base64.b64decode(obj.get('content','')).decode('utf-8','replace') if obj.get('encoding')=='base64' else ''
              except Exception as e:
                  candidates.append({'repository':repo,'path':path,'fetch_error':repr(e),'priority':'FETCH_BLOCKED'}); continue
              low=text.lower()
              particle_noise=bool(re.search(r'higgs|electroweak|renormali[sz]ation|scalar singlet dm|susy|mssm',low)) and not bool(re.search(r'omega[_ ]?m|hubble|cosmolog',low))
              law=bool(re.search(r'(rho[_ ]?(lambda|vac)|lambda\s*\(\s*h\s*\)|running[_ -]?vacuum)',low))
              hdep=bool(re.search(r'(h\s*\*\*\s*2|h\s*\^\s*2|h2|hdot|dot\s*h|hubble)',low))
              nu=bool(re.search(r'\bnu\b|ν',text))
              conserve=bool(re.search(r'conservation|continuity|exchange|interaction|q_mu|q\s*=',low))
              perturb=bool(re.search(r'perturb|boltzmann|class|camb|synchronous|newtonian gauge',low))
              toy=bool(re.search(r'\btoy\b|scaffolding|not a derivation|does not enforce',low))
              qualifies=law and hdep and not particle_noise
              source_complete=qualifies and conserve and perturb and not toy
              priority='SOURCE_COMPLETE_REVIEW' if source_complete else ('PROVENANCE_LEAD' if qualifies else 'REJECT')
              candidates.append({'repository':repo,'path':path,'html_url':item.get('html_url'),'blob_sha':item.get('sha'),'signals':{'law':law,'hdep':hdep,'nu':nu,'conservation':conserve,'perturbation':perturb,'toy':toy,'particle_noise':particle_noise},'priority':priority})
          json.dump({'lane':lane,'query':q,'status':'OK','total_count':sr.get('total_count',0),'candidates':candidates},open(f'out/lane_{lane}.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f16-focused-lane-${{ matrix.lane }}
          path: out/lane_${{ matrix.lane }}.json

  aggregate:
    if: always()
    needs: [search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f16-focused-lane-*
          path: lanes
          merge-multiple: true
      - name: Frozen aggregate classification
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json
          rows=[]
          for p in sorted(glob.glob('lanes/lane_*.json')):
              rows.append(json.load(open(p)))
          cand=[]
          for r in rows: cand += r.get('candidates',[])
          sc=[x for x in cand if x.get('priority')=='SOURCE_COMPLETE_REVIEW']
          leads=[x for x in cand if x.get('priority')=='PROVENANCE_LEAD']
          errors=[r for r in rows if r.get('status')!='OK']
          if sc: cl='F16_FOCUSED_DISCOVERY_SOURCE_COMPLETE_CANDIDATE_FOUND'
          elif leads: cl='F16_FOCUSED_DISCOVERY_PROVENANCE_LEADS_ONLY'
          elif errors and len(errors)==len(rows): cl='F16_FOCUSED_DISCOVERY_INFRASTRUCTURE_BLOCKED'
          else: cl='F16_FOCUSED_DISCOVERY_NO_QUALIFYING_PUBLIC_SOURCE'
          out={'schema':'KMDSB.W03.F16FocusedRunningVacuumDiscovery.v0.1','protocol':'protocol/W03_F16_FOCUSED_RUNNING_VACUUM_PROVIDER_DISCOVERY_v0.1.md','classification':cl,'source_complete_candidates':sc,'provenance_leads':leads,'lane_results':rows,'K0_promoted':False,'K1_promoted':False,'physical_falsification':False}
          json.dump(out,open('f16_focused_discovery_aggregate.json','w'),indent=2)
          print(json.dumps({'classification':cl,'source_complete':len(sc),'leads':len(leads),'errors':len(errors)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f16-focused-discovery-aggregate
          path: f16_focused_discovery_aggregate.json
