name: Compute M24 K1 precision-profile robustness sweep

on:
  push:
    paths:
      - '.github/workflows/compute-m24-k1-precision-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
  OMP_NUM_THREADS: '1'

jobs:
  precision-profile:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ur_trigger: [20, 30, 40]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned CLASS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-numpy >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          test "$(git -C class rev-parse HEAD)" = "$CLASS_PIN"
          make -C class -j2 > build.log 2>&1
      - name: Build diagnostic precision profile
        shell: bash
        env:
          UR_TRIGGER: ${{ matrix.ur_trigger }}
        run: |
          set -euo pipefail
          cp class/pk_ref.pre class/pk_ref_diag.pre
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('class/pk_ref_diag.pre'); s=p.read_text(); t=os.environ['UR_TRIGGER']
          old='ur_fluid_trigger_tau_over_tau_k = 50.'
          new=f'ur_fluid_trigger_tau_over_tau_k = {t}.'
          if s.count(old)!=1: raise SystemExit(f'expected one UR trigger, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          Path('PROFILE.txt').write_text(f'ur_fluid_trigger_tau_over_tau_k={t}\ndiagnostic_only=true\n')
          PY
          diff -u class/pk_ref.pre class/pk_ref_diag.pre > precision_profile.diff || true
      - name: Prepare frozen preregistered cases
        run: python3 verification/m24/ethos1_k1_reference.py prepare m24_cases
      - name: Execute full frozen ladder
        shell: bash
        run: |
          set +e
          mkdir -p class/output logs
          echo '{}' > status.json
          for tag in ref zero a0 a1 a2 a3 a4; do
            (cd class && ./class "../m24_cases/${tag}.ini" pk_ref_diag.pre > "../logs/${tag}.log" 2>&1)
            rc=$?
            python3 - "$tag" "$rc" <<'PY'
          import json,sys
          p='status.json'; d=json.load(open(p)); d[sys.argv[1]]=int(sys.argv[2]); json.dump(d,open(p,'w'),indent=2,sort_keys=True)
          PY
          done
          exit 0
      - name: Analyze with frozen gate
        shell: bash
        env:
          UR_TRIGGER: ${{ matrix.ur_trigger }}
        run: |
          set -euo pipefail
          python3 verification/m24/ethos1_k1_reference.py analyze class status.json M24_K1_PRECISION_RESULT.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('M24_K1_PRECISION_RESULT.json'))
          print(json.dumps({'ur_trigger':os.environ['UR_TRIGGER'],'classification':d.get('classification'),'K1_reference_limit':d.get('K1_reference_limit'),'Pk':d.get('blocks',{}).get('Pk')},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m24-k1-precision-ur${{ matrix.ur_trigger }}
          path: |
            M24_K1_PRECISION_RESULT.json
            PROFILE.txt
            status.json
            precision_profile.diff
            logs/
            build.log
          retention-days: 30
