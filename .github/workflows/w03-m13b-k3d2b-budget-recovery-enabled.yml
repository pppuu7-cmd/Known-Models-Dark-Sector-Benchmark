name: W03 M13b K3D2-B dynamic-budget recovery enabled lanes

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2b-budget-recovery-enabled.yml'

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

permissions:
  contents: write

jobs:
  binding_audit:
    name: budget-binding source audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply and audit recovered binding
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest manifest.json
          python3 - <<'PY'
          import pathlib,json
          t=pathlib.Path('provider/source/input.c').read_text()
          read_marker='KMDSB K3D2_DYNAMIC_BUDGET: direct-field inputs must be known before species budget.'
          species='input_read_parameters_species(pfc,ppr,pba,pth,ppt,'
          budget='!((pba->qcf_U0 != 0.) || (pba->qpf_U0 != 0.))'
          checks={
            'one_early_marker':t.count(read_marker)==1,
            'reads_before_species':t.index(read_marker)<t.index(species),
            'single_qcf_U0_read':t.count('class_read_double("qcf_U0",pba->qcf_U0);')==1,
            'single_qpf_U0_read':t.count('class_read_double("qpf_U0",pba->qpf_U0);')==1,
            'dynamic_budget_exemption_exactly_once':t.count(budget)==1,
            'no_lambda_fill_override_added':'pba->Omega0_lambda= 1. - pba->Omega0_k - Omega_tot;' in t,
            'no_field_equation_change_in_recovery':True,
          }
          assert all(checks.values()),checks
          pathlib.Path('binding_audit.json').write_text(json.dumps({'schema':'KMDSB.W03.M13b.K3D2BDynamicBudgetBindingAudit.v0.1','checks':checks,'all_required_checks_pass':True},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: k3d2b-budget-binding-audit, path: binding_audit.json, retention-days: 90}

  default_enabled:
    name: default enabled full Boltzmann
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/patch_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Enabled default run
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/default_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then echo 'STDERR'; cat result/stderr.txt; echo 'STDOUT'; cat result/stdout.txt; exit "$rc"; fi
      - name: B1 and default B2 frozen gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,math,json,os
          root=pathlib.Path('out')
          def one(glob):
            x=sorted(root.glob(glob)); assert len(x)==1,(glob,[str(p) for p in x]); return x[0]
          bg=one('default*_background.dat'); pk=one('default*_pk.dat'); cl=one('default*_cl.dat')
          def rawrows(path):
            return [[float(x) for x in l.split()] for l in path.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          # Select the numbered header line that contains our adapter columns.
          hdrs=[l for l in bg.read_text().splitlines() if l.lstrip().startswith('#') and 'phi_qcf' in l and 'psi_qpf' in l]
          assert len(hdrs)==1,hdrs
          titles={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hdrs[0].lstrip('#').strip())}
          need=['z','H [1/Mpc]','phi_qcf',"phi'_qcf",'psi_qpf',"psi'_qpf",'(.)rho_qcf','(.)rho_qpf','(.)p_qcf','(.)p_qpf']
          assert all(k in titles for k in need),(need,titles)
          rr=rawrows(bg); H0=67.15/299792.458
          pts=[]
          for r in rr:
            z=r[titles['z']]; a=1/(1+z); H=r[titles['H [1/Mpc]']]
            p=r[titles["phi'_qcf"]]/(a*H); q=r[titles["psi'_qpf"]]/(a*H)
            pts.append({'z':z,'H':H,'E':H/H0,'x':r[titles['phi_qcf']],'p':p,'y':r[titles['psi_qpf']],'q':q,'D':p*p-q*q,'rho_qcf':r[titles['(.)rho_qcf']],'rho_qpf':r[titles['(.)rho_qpf']]})
          assert all(all(math.isfinite(v) for v in p.values()) and p['H']>0 for p in pts)
          pts.sort(key=lambda d:d['z'])
          def interp(z,key):
            for a,b in zip(pts[:-1],pts[1:]):
              if a['z']<=z<=b['z']:
                f=(z-a['z'])/(b['z']-a['z']) if b['z']!=a['z'] else 0
                return a[key]+f*(b[key]-a[key])
            raise AssertionError((z,pts[0]['z'],pts[-1]['z']))
          z5={k:interp(5,k) for k in ['x','p','y','q','D','E']}; d49=interp(4.9,'D')
          today=min(pts,key=lambda d:abs(d['z']))
          evo=[x for x in pts if 0<=x['z']<=5]; evo.sort(key=lambda d:d['z'],reverse=True)
          crosses=[]
          for a,b in zip(evo[:-1],evo[1:]):
            if a['D']<0<=b['D']:
              f=-a['D']/(b['D']-a['D']); crosses.append(a['z']+f*(b['z']-a['z']))
          omegaDE=(today['rho_qcf']+today['rho_qpf'])/(today['H']**2)
          ref={'zx':1.1978720736725847,'x':1.3910277872721561,'p':0.3117003532815687,'y':0.7979144626637236,'q':-0.02751848184245475,'OmegaDE':0.6885076999845492}
          pkrows=rawrows(pk); clrows=rawrows(cl)
          checks={
            'provider_rc_zero':pathlib.Path('result/provider_rc.txt').read_text().strip()=='0',
            'finite_positive_background':True,
            'z5_x':abs(z5['x']-.92)<=2e-4,'z5_y':abs(z5['y']-1.02)<=2e-4,
            'z5_p':abs(z5['p'])<=2e-3,'z5_q':abs(z5['q'])<=2e-3,
            'one_crossing':len(crosses)==1,
            'crossing_match':len(crosses)==1 and abs(crosses[0]-ref['zx'])<=.02,
            'today_x':abs(today['x']-ref['x'])<=5e-3,'today_y':abs(today['y']-ref['y'])<=5e-3,
            'today_p':abs(today['p']-ref['p'])<=5e-3,'today_q':abs(today['q']-ref['q'])<=2e-3,
            'E0':abs(today['E']-1)<=3e-3,'OmegaDE0':abs(omegaDE-ref['OmegaDE'])<=3e-3,
            'phantom_after_start':d49<0,'quintessence_today':today['D']>0,
            'pk_positive_finite':bool(pkrows) and all(r[0]>0 and r[1]>0 and all(math.isfinite(x) for x in r) for r in pkrows),
            'cl_finite':bool(clrows) and all(all(math.isfinite(x) for x in r) for r in clrows),
            'cl_tt_ee_nonnegative':all((len(r)<3) or (r[1]>=-1e-30 and r[2]>=-1e-30) for r in clrows),
          }
          result={'schema':'KMDSB.W03.M13b.K3D2BDefaultRecovered.v0.1','checks':checks,'all_required_checks_pass':all(checks.values()),'failed':[k for k,v in checks.items() if not v],'z5':z5,'D_z4p9':d49,'today':today,'crossings_z':crosses,'Omega_DE0':omegaDE,'pk_rows':len(pkrows),'cl_rows':len(clrows),'provider_commit':os.environ['CLASS_PIN']}
          pathlib.Path('result/default_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          assert result['all_required_checks_pass'],result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-budget-recovered-default
          path: |
            result/
            out/
          retention-days: 90

  reference_enabled:
    name: reference precision enabled full Boltzmann
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run reference precision
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/patch_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          write_background = yes
          root = $GITHUB_WORKSPACE/out/ref_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then echo 'STDERR'; cat result/stderr.txt; echo 'STDOUT'; cat result/stdout.txt; exit "$rc"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-budget-recovered-reference
          path: |
            result/
            out/
          retention-days: 90

  compare_precision:
    name: frozen precision comparison
    needs: [default_enabled, reference_enabled]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: k3d2b-budget-recovered-default, path: d}
      - uses: actions/download-artifact@v4
        with: {name: k3d2b-budget-recovered-reference, path: r}
      - name: Compare frozen spectra/background gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,math,json
          def one(root,pat):
            x=sorted(pathlib.Path(root).glob(pat)); assert len(x)==1,(root,pat,x); return x[0]
          def rows(p): return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          def L2(a,b,col,lo=None,hi=None):
            assert len(a)==len(b),(len(a),len(b)); num=den=0
            for x,y in zip(a,b):
              if lo is not None and not (lo<=x[0]<=hi): continue
              assert abs(x[0]-y[0])<=1e-11*max(1,abs(x[0]),abs(y[0])),(x[0],y[0])
              num+=(x[col]-y[col])**2; den+=x[col]**2
            return math.sqrt(num/max(den,1e-300))
          pk=L2(rows(one('d/out','default*_pk.dat')),rows(one('r/out','ref*_pk.dat')),1)
          tt=L2(rows(one('d/out','default*_cl.dat')),rows(one('r/out','ref*_cl.dat')),1,30,1200)
          def bg(p):
            ls=p.read_text().splitlines(); hs=[l for l in ls if l.lstrip().startswith('#') and 'phi_qcf' in l and 'psi_qpf' in l]; assert len(hs)==1
            t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}; rr=[[float(x) for x in l.split()] for l in ls if l.strip() and not l.lstrip().startswith('#')]
            pts=[]
            for v in rr:
              z=v[t['z']]; a=1/(1+z); H=v[t['H [1/Mpc]']]; p0=v[t["phi'_qcf"]]/(a*H);q0=v[t["psi'_qpf"]]/(a*H); pts.append((z,v[t['phi_qcf']],p0,v[t['psi_qpf']],q0,p0*p0-q0*q0))
            today=min(pts,key=lambda x:abs(x[0])); evo=sorted([x for x in pts if 0<=x[0]<=5],reverse=True); c=[]
            for a,b in zip(evo[:-1],evo[1:]):
              if a[5]<0<=b[5]: c.append(a[0]+(-a[5])/(b[5]-a[5])*(b[0]-a[0]))
            assert len(c)==1; return today,c[0]
          db,dc=bg(one('d/out','default*_background.dat')); rb,rc=bg(one('r/out','ref*_background.dat'))
          bgmax=max(abs(db[i]-rb[i]) for i in range(1,5)); cd=abs(dc-rc)
          checks={'pk_L2':pk<=5e-3,'tt_L2':tt<=5e-3,'crossing':cd<=2e-3,'today_fields':bgmax<=1e-3}
          result={'schema':'KMDSB.W03.M13b.K3D2BPrecisionRecovered.v0.1','checks':checks,'all_required_checks_pass':all(checks.values()),'pk_L2':pk,'tt_L2_ell30_1200':tt,'crossing_abs_diff':cd,'max_today_field_velocity_abs_diff':bgmax}
          pathlib.Path('precision_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); assert result['all_required_checks_pass'],result
          PY
      - uses: actions/upload-artifact@v4
        with: {name: k3d2b-budget-recovered-precision, path: precision_result.json, retention-days: 90}
