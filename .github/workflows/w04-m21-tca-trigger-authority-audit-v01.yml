name: W04 M21 TCA trigger authority audit v0.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m21-tca-trigger-authority-audit-v01.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pin provider and extract TCA switch authority
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git -C class rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('class')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.c','.h','.ini','.pre'}]
          needles=('tca_on','tca_off','tight_coupling_approximation','tight_coupling_trigger','tight coupling','tight_coupling')
          hits=[]
          for p in files:
            try: lines=p.read_text(errors='replace').splitlines()
            except: continue
            for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                lo=max(0,i-10); hi=min(len(lines),i+11)
                hits.append({'path':str(p.relative_to(root)),'line':i+1,'context':'\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi))})
          out={'schema':'KMDSB.W04.M21.TCATriggerAuthorityAudit.v0.1','provider_commit':'e85808324f51fc694d12e3ed7439552a3c3f9540','scope':'source-only audit of pinned provider TCA trigger/state transition logic after endpoint-consensus mapping was blocked by non-native tau sampling; no scientific classifier and no target-state assignment','hit_count':len(hits),'hits':hits,'scientific_classifier_executed':False,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False,'classification':'M21_TCA_TRIGGER_AUTHORITY_SOURCE_AUDIT_COMPLETE' if hits else 'M21_TCA_TRIGGER_AUTHORITY_NOT_FOUND'}
          pathlib.Path('M21_TCA_TRIGGER_AUTHORITY_AUDIT_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('M21_TCA_TRIGGER_AUTHORITY_CONTEXT.txt').write_text('\n\n===== HIT =====\n\n'.join(h['context'] for h in hits)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='hits'},indent=2))
          if not hits: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-tca-trigger-authority-audit-v01
          path: |
            M21_TCA_TRIGGER_AUTHORITY_AUDIT_RESULT.json
            M21_TCA_TRIGGER_AUTHORITY_CONTEXT.txt
          retention-days: 90