name: W03 M13b K3B2 independent standard-GR dynamical embedding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3b2-independent-dynamical-embedding.yml'

permissions:
  contents: write

jobs:
  k3b2-embedding:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute prospectively frozen K3B2 embedding
        run: |
          set -euo pipefail
          python3 verification/m13b/k3b2_independent_dynamical_embedding.py \
            --output waves/wave_03_expanded_dark_energy/M13B_K3B2_INDEPENDENT_DYNAMICAL_EMBEDDING_RESULT.json
      - name: Verify fail-closed guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('waves/wave_03_expanded_dark_energy/M13B_K3B2_INDEPENDENT_DYNAMICAL_EMBEDDING_RESULT.json')
          r=json.loads(p.read_text())
          assert r['schema']=='KMDSB.W03.M13b.K3B2IndependentStandardGRDynamicalEmbedding.v0.1'
          assert r['implementation_provenance']=='independent_KMDSB_standard_GR_verification'
          assert r['original_provider_reproduced'] is False
          assert r['K3_canonical_state_ceiling']=='PARTIAL'
          assert r['K4_promoted'] is False
          assert r['K5_promoted'] is False
          assert r['physical_falsification'] is False
          print(r['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m13b-k3b2-independent-dynamical-embedding
          path: waves/wave_03_expanded_dark_energy/M13B_K3B2_INDEPENDENT_DYNAMICAL_EMBEDDING_RESULT.json
          retention-days: 90
      - name: Persist immutable K3B2 result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add waves/wave_03_expanded_dark_energy/M13B_K3B2_INDEPENDENT_DYNAMICAL_EMBEDDING_RESULT.json
          if git diff --cached --quiet; then
            echo 'K3B2 result already canonical.'
          else
            git commit -m 'record M13b K3B2 independent dynamical embedding result'
            git push
          fi
