name: W05 M32 K0h terminal synthesis

on:
  push:
    paths:
      - '.github/workflows/w05-m32-k0h-terminal-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthesize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable recovered-nine artifact and authoritative umuscl job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10303116881/zip" > nine.zip
          unzip -q nine.zip -d nine
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/103598523485/logs" > umuscl_job.log
          sha256sum nine.zip umuscl_job.log > immutable_inputs_sha256.txt
      - name: Apply frozen terminal classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          rows=json.loads(pathlib.Path('nine/M32_K0H_RECOVERED_NINE.json').read_text())['rows']
          log=pathlib.Path('umuscl_job.log').read_text(errors='replace')
          low=log.lower()
          expected={'interpol_hydro.o','godunov_utils.o','condinit.o','hydro_flag.o','hydro_boundary.o','boundana.o','read_hydro_params.o','synchro_hydro_fine.o','gas_analytics.o'}
          nine_ok=(len(rows)==9 and {r.get('target') for r in rows}==expected and all(r.get('build_exit_code')==0 and r.get('target_object_exists') is True and r.get('classification')=='TARGET_COMPILED_EXACT_PIN' for r in rows))
          shutdown=('runner has received a shutdown signal' in low and 'exit code 143' in low)
          # Narrow compiler/source diagnostics only; workflow source text is not interpreted as a diagnostic.
          diagnostics=[]
          for line in log.splitlines():
              s=line.lower()
              if any(x in s for x in ['error #','catastrophic error','undefined reference','cannot open module file','severe (','fatal error:']):
                  diagnostics.append(line[-500:])
          if not nine_ok:
              cls='M32_K0H_RECOVERED_TARGET_INTEGRITY_BLOCKED'
          elif diagnostics:
              cls='M32_K0H_UMUSCL_COMPILER_OR_SOURCE_BLOCKED'
          elif shutdown:
              cls='M32_K0H_NINE_HYDRO_TARGETS_COMPILED_UMUSCL_HOSTED_INFRASTRUCTURE_BLOCKED'
          else:
              cls='M32_K0H_TERMINAL_SYNTHESIS_INTEGRITY_BLOCKED'
          out={'schema':'m32_k0h_terminal_synthesis_v0.1','model_id':'M32','classification':cls,
               'source_matrix_run':34710463111,'source_recovery_run':34710583217,'recovered_nine_artifact':10303116881,
               'umuscl_job_id':103598523485,'nine_targets_integrity_pass':nine_ok,'umuscl_external_shutdown_143':shutdown,
               'explicit_compiler_source_diagnostics':diagnostics,'targets':rows,'K0_promoted':False,'physical_falsification':False,
               'next_step':'prospective umuscl-specific infrastructure strategy; full-link continuation remains blocked by exact prerequisite' if cls.endswith('HOSTED_INFRASTRUCTURE_BLOCKED') else 'resolve classified blocker before continuation'}
          pathlib.Path('M32_K0H_TERMINAL_SYNTHESIS.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m32-k0h-terminal-synthesis
          path: |
            M32_K0H_TERMINAL_SYNTHESIS.json
            immutable_inputs_sha256.txt
          retention-days: 30
