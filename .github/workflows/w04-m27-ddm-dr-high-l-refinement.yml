name: W04 M27 dark-radiation high-L refinement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m27-ddm-dr-high-l-refinement.yml']
permissions:
  contents: write
jobs:
  ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        delta: [0.5, 1.0, 2.0]
        y: [1.0, 2.0, 3.0]
        g0: [0.03, 0.3, 3.0]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy==1.16.2
      - name: Run frozen high-L refinement
        run: |
          python3 verification/m27/ddm_dr_high_l_refinement.py '${{ matrix.delta }}' '${{ matrix.y }}' '${{ matrix.g0 }}' result.json
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m27-highl-d${{ matrix.delta }}-y${{ matrix.y }}-g${{ matrix.g0 }}
          path: result.json
          retention-days: 90
  aggregate:
    needs: [ensemble]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: m27-highl-*
          path: collected
      - name: Aggregate frozen high-L gate and persist
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          target='M27_DDM_DR_HIGH_L_HIERARCHY_CONVERGENCE_PASS_WITH_PRESCRIBED_METRIC_SCOPE'
          vals=[]; parent=[]
          for r in rs:
            for v in r.get('comparisons',{}).values():
              vals.extend(v.get('L32_vs_L64',{}).values())
              parent.extend(v.get('L17_vs_L32',{}).values())
          ok=(len(rs)==27 and all(r.get('classification')==target for r in rs))
          out={'schema':'KMDSB.M27.DDMDRHighLRefinement.Summary.v1','preregistration':'protocol/W04_M27_DDM_DR_HIGH_L_REFINEMENT_PREREGISTRATION_v0.1.md','n_results':len(rs),'n_pass':sum(r.get('classification')==target for r in rs),'max_L17_vs_L32_amp_norm_residual':max(parent) if parent else None,'max_L32_vs_L64_amp_norm_residual':max(vals) if vals else None,'classification':'M27_DDM_DR_HIGH_L_HIERARCHY_CONVERGENCE_PASS_WITH_PRESCRIBED_METRIC_SCOPE' if ok else 'M27_DDM_DR_HIGH_L_HIERARCHY_CONVERGENCE_NOT_ESTABLISHED','K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False,'parent_L17_failure_preserved':True,'self_consistent_metric_gate':'OPEN'}
          Path('summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/dynamical_dark_matter
          cp /tmp/summary.json waves/wave_04_dark_matter/M27_DDM_DR_HIGH_L_REFINEMENT_SUMMARY.json
          cp /tmp/summary.json models/dynamical_dark_matter/M27_DDM_DR_HIGH_L_REFINEMENT_SUMMARY.json
          git add waves/wave_04_dark_matter models/dynamical_dark_matter
          git diff --cached --quiet || { git commit -m 'Record M27 high-L hierarchy refinement'; git pull --rebase origin main; git push origin HEAD:main; }
