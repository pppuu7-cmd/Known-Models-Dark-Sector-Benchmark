name: W04 M25 m0 l-sampling diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m25-m0-l-sampling-diagnostic.yml']
permissions:
  contents: write
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: w04-m25-k1-abundance-decoupling
          path: original
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34548988620
      - uses: actions/download-artifact@v4
        with:
          name: m25-ncdm-nofluid-m0
          path: baseline
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34551925134
      - name: Build pinned CLASS and frozen profile
        shell: bash
        run: |
          set -euo pipefail
          cp -a original/m25_k1_cases m25_k1_cases
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class/include/common.h'); s=p.read_text()
          assert s.count('#define _QUADRATURE_MAX_ 250')==1 and s.count('#define _QUADRATURE_MAX_BG_ 800')==1
          p.write_text(s.replace('#define _QUADRATURE_MAX_ 250','#define _QUADRATURE_MAX_ 4000').replace('#define _QUADRATURE_MAX_BG_ 800','#define _QUADRATURE_MAX_BG_ 4000'))
          PY
          make -C class -j2 > build.log 2>&1
          cat > l_sampling.pre <<'EOF'
          tol_ncdm_bg = 1e-6
          tol_ncdm = 1e-6
          ncdm_fluid_approximation = 3
          l_logstep = 1.026
          l_linstep = 25
          EOF
      - name: Execute four m0 cases two-at-a-time
        shell: bash
        run: |
          mkdir -p class/output logs parts
          printf '%s\n' ref e2 e3 e4 | xargs -P 2 -I{} bash -c '
            s="$1"; id="$s"; [ "$s" = ref ] || id="m0_${s}"
            set +e
            (cd class && ./class "../m25_k1_cases/${id}.ini" ../l_sampling.pre > "../logs/${id}.log" 2>&1)
            printf "%d\n" "$?" > "parts/${s}.status"
          ' _ {}
          python3 - <<'PY'
          import json
          from pathlib import Path
          d={'build':0}; d.update({p.stem:int(p.read_text()) for p in Path('parts').glob('*.status')}); Path('status.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - name: Analyze CMB excursion localization
        shell: bash
        run: |
          python3 verification/m25/m25_k1_precision_floor_diagnostic.py class m0 pk_ref status.json raw.json
          python3 - <<'PY'
          import json
          r=json.load(open('raw.json')); b=json.load(open('baseline/result.json'))
          cmb=['CMB_TT','CMB_EE','CMB_TE']
          new={k:r['blocks'][k]['r95'][1] for k in cmb}; old={k:b['blocks'][k]['r95'][1] for k in cmb}
          ratios={k:(old[k]/new[k] if new[k]>0 else float('inf')) for k in cmb}
          recovered=[k for k in cmb if r['blocks'][k]['tail_scaling_recovered']]
          strong=[k for k in cmb if ratios[k]>=5.0]
          if r.get('classification')=='M25_PRECISION_FLOOR_DIAGNOSTIC_PROVIDER_BLOCKED': cls='M25_M0_L_SAMPLING_PROVIDER_BLOCKED'
          elif len(recovered)==3 and len(strong)==3: cls='M25_M0_L_SAMPLING_CMB_EXCURSION_LOCALIZED'
          elif recovered or strong: cls='M25_M0_L_SAMPLING_CMB_EXCURSION_PARTIALLY_LOCALIZED'
          else: cls='M25_M0_L_SAMPLING_CMB_EXCURSION_INSENSITIVE'
          r.update({'schema':'KMDSB.M25.M0LSamplingDiagnostic.v1','preregistration':'protocol/W04_M25_M0_L_SAMPLING_DIAGNOSTIC_PREREGISTRATION_v0.1.md','baseline_run_id':34551925134,'l_logstep':1.026,'l_linstep':25,'eta_0p003_p95':new,'baseline_eta_0p003_p95':old,'improvement_factors':ratios,'recovered_CMB_blocks':recovered,'classification':cls,'K1_promoted':False,'K4_promoted':False,'physical_falsification':False})
          open('result.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m25-m0-l-sampling-diagnostic
          path: |
            l_sampling.pre
            build.log
            status.json
            result.json
            logs/
            class/output/
          retention-days: 90
      - name: Persist canonical result
        if: always()
        shell: bash
        run: |
          test -s result.json || exit 0
          cp result.json /tmp/result.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          cp /tmp/result.json waves/wave_04_dark_matter/M25_M0_L_SAMPLING_DIAGNOSTIC_RESULT.json
          cp /tmp/result.json models/resonant_sterile_neutrino_wdm/M25_M0_L_SAMPLING_DIAGNOSTIC_RESULT.json
          git add waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          git diff --cached --quiet || { git commit -m 'Record M25 m0 l-sampling diagnostic'; git pull --rebase origin main; git push origin HEAD:main; }
