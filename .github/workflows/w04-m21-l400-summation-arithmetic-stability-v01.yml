name: W04 M21 l400 summation arithmetic stability v0.1

on:
  workflow_run:
    workflows: ['W04 M21 l400 analysis successors v0.1']
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RUN: '34907528331'

jobs:
  arithmetic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download terminal cancellation result
        id: cancel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-convolution-sign-cancellation-v01
          path: cancellation
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - name: Stop cleanly if cancellation branch was not produced
        if: ${{ steps.cancel.outcome != 'success' }}
        run: |
          echo 'No convolution cancellation artifact in triggering run; this conditional audit is not applicable.'
      - name: Download clean recovery aggregate
        if: ${{ steps.cancel.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-transfer-convolution-decomposition-v01
          path: recovery
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Download recovered case artifacts
        if: ${{ steps.cancel.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen summation arithmetic audit
        if: ${{ steps.cancel.outcome == 'success' }}
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_summation_arithmetic_stability.py \
            components \
            recovery/M21_L400_TRANSFER_CONVOLUTION_DECOMPOSITION_RESULT.json \
            cancellation/M21_L400_CONVOLUTION_SIGN_CANCELLATION_RESULT.json \
            M21_L400_SUMMATION_ARITHMETIC_STABILITY_RESULT.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.cancel.outcome == 'success' }}
        with:
          name: m21-l400-summation-arithmetic-stability-v01
          path: M21_L400_SUMMATION_ARITHMETIC_STABILITY_RESULT.json
          if-no-files-found: error
          retention-days: 90
