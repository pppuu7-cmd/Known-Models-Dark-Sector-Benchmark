name: W03 M08 CPL local response basis audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m08-cpl-local-basis.yml'
      - 'code/w03_m08_cpl_local_basis.py'

jobs:
  cpl-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Fetch and build pinned CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2
      - name: Write matched CPL configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out logs
          cat > cfg/common.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_Lambda = 0
          Omega_fld = 0.682686955086854
          fluid_equation_of_state = CLP
          cs2_fld = 1
          use_ppf = yes
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_perturbations_integration = 1e-8
          perturbations_sampling_stepsize = 0.01
          EOF
          make_case () {
            local tag="$1"; local w0="$2"; local wa="$3"
            cp cfg/common.ini cfg/${tag}.ini
            cat >> cfg/${tag}.ini <<EOF
          w0_fld = ${w0}
          wa_fld = ${wa}
          root = ${GITHUB_WORKSPACE}/out/${tag}_
          EOF
          }
          make_case ref -1.0 0.0
          make_case e0p -0.999 0.0
          make_case e0m -1.001 0.0
          make_case wap -1.0 0.001
          make_case wam -1.0 -0.001
      - name: Run all CPL cases
        shell: bash
        run: |
          set +e
          for tag in ref e0p e0m wap wam; do
            ./class_public/class cfg/${tag}.ini > logs/${tag}.log 2>&1
            echo "$?" > logs/${tag}.exit
          done
          exit 0
      - name: Analyze local basis
        shell: bash
        run: |
          set -euo pipefail
          for tag in ref e0p e0m wap wam; do test "$(cat logs/${tag}.exit)" = "0"; done
          python3 code/w03_m08_cpl_local_basis.py --directory out --step 0.001 --json m08_cpl_local_basis.json
      - name: Enforce implementation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('m08_cpl_local_basis.json'))
          if d['reference_floor']['max_abs_lnP']>1e-12 or d['reference_floor']['max_abs_lnH']>1e-12:
              raise SystemExit('reference self-floor unexpectedly nonzero')
          if min(d['singular_values_combined_PH'])<=0:
              raise SystemExit('degenerate zero local direction')
          print('M08_CPL_IMPLEMENTATION_CONTROL=PASS')
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo 'fluid_equation_of_state=CLP'
            echo 'cs2_fld=1'
            echo 'use_ppf=yes'
            echo 'local_step=1e-3'
          } > m08_cpl_provenance.txt
      - name: Upload immutable M08 basis bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m08-cpl-local-basis
          path: |
            m08_cpl_local_basis.json
            m08_cpl_provenance.txt
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
