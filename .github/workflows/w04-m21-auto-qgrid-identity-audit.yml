name: W04 M21 automatic ncdm q-grid identity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m21-auto-qgrid-identity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
  OMP_NUM_THREADS: '1'

jobs:
  qgrid:
    strategy:
      fail-fast: false
      matrix:
        lane: [f2, f3, f4, f3_manual]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install provider and prepare cases
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          test "$(git -C class rev-parse HEAD)" = "$CLASS_PIN"
          python3 verification/m21/mixed_cold_warm_k1_reference.py prepare m21_cases
          cat class/cl_permille.pre verification/m21/m21_ncdm_tight.pre > m21_p2.pre
          python3 verification/m21/auto_qgrid_identity_audit.py patch class instrumentation_manifest.json
          make -C class -j2 > "build_${{ matrix.lane }}.log" 2>&1

      - name: Select lane and execute
        run: |
          set -euo pipefail
          lane='${{ matrix.lane }}'
          base="$lane"
          if [ "$lane" = "f3_manual" ]; then base="f3"; fi
          cp "m21_cases/${base}.ini" lane.ini
          if [ "$lane" = "f3_manual" ]; then
            printf '%s\n' 'ncdm_quadrature_strategy = 3' 'ncdm_N_momentum_bins = 150' 'ncdm_maximum_q = 15' >> lane.ini
          fi
          set +e
          (cd class && timeout 1200 ./class ../lane.ini ../m21_p2.pre > "../run_${lane}.log" 2>&1)
          rc=$?
          set -e
          echo "$rc" > provider_rc.txt
          test "$rc" -eq 0
          grep -q 'KMDSB_QGRID_BEGIN' "run_${lane}.log"
          grep -q 'KMDSB_QGRID_END' "run_${lane}.log"
          python3 verification/m21/auto_qgrid_identity_audit.py parse "$lane" "run_${lane}.log" provider_rc.txt instrumentation_manifest.json "${lane}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-qgrid-${{ matrix.lane }}
          path: |
            ${{ matrix.lane }}.json
            instrumentation_manifest.json
            provider_rc.txt
            lane.ini
            run_${{ matrix.lane }}.log
            build_${{ matrix.lane }}.log
          retention-days: 90

  aggregate:
    needs: [qgrid]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: m21-qgrid-*
          path: evidence
      - name: Apply frozen classification
        run: |
          python3 verification/m21/auto_qgrid_identity_audit.py aggregate evidence M21_AUTO_QGRID_IDENTITY_AUDIT_RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-auto-qgrid-identity-audit
          path: M21_AUTO_QGRID_IDENTITY_AUDIT_RESULT.json
          retention-days: 90
