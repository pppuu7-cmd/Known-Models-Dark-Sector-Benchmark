name: W04 M27 perturbation source deep tolerance recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m27-perturbation-source-deep-tolerance-recovery.yml']
permissions:
  contents: write
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        g0: [0.03, 0.3, 3.0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy==1.16.2
      - name: Run deeper normalized tolerance pairs
        run: |
          python3 verification/m27/perturbation_source_deep_tolerance_recovery.py '${{ matrix.g0 }}' result.json
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m27-source-deep-g${{ matrix.g0 }}
          path: result.json
          retention-days: 90
  aggregate:
    needs: deep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m27-source-deep-g*
          path: collected
      - name: Persist deep tolerance recovery summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          target='M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_GAMMA_PASS'
          ok=(len(rs)==3 and all(r.get('classification')==target for r in rs))
          vals=[]
          for r in rs:
              for kv in r.get('pairs',{}).values():
                  for pair in ('pair_1e11_vs_3e12','pair_3e12_vs_1e12'):
                      vals.extend(kv.get(pair,{}).values())
          s={'schema':'KMDSB.M27.PerturbationSourceDeepToleranceRecovery.Summary.v1','preregistration':'protocol/W04_M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_RECOVERY_PREREGISTRATION_v0.1.md','n_results':len(rs),'n_pass':sum(r.get('classification')==target for r in rs),'children':{str(r.get('Gamma0_over_Hstar')):r.get('classification') for r in rs},'max_deep_pair_residual':max(vals) if vals else None,'classification':'M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_RECOVERY_PASS_WITH_SCOPE' if ok else 'M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_RECOVERY_NOT_ESTABLISHED','normalized_27way_recovery_authorized':bool(ok),'production_rtol_if_authorized':1e-11 if ok else None,'support_fraction_if_authorized':1e-4 if ok else None,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n'); print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/dynamical_dark_matter
          cp /tmp/summary.json waves/wave_04_dark_matter/M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_RECOVERY_SUMMARY.json
          cp /tmp/summary.json models/dynamical_dark_matter/M27_PERTURBATION_SOURCE_DEEP_TOLERANCE_RECOVERY_SUMMARY.json
          git add waves/wave_04_dark_matter models/dynamical_dark_matter
          git diff --cached --quiet || { git commit -m 'Record M27 deep perturbation tolerance recovery'; git pull --rebase origin main; git push origin HEAD:main; }
