name: W03 M13b K3D2-B exact two-segment background restart probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m13b-k3d2b-two-segment-restart-probe.yml'
  workflow_dispatch:

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa

permissions:
  contents: read

jobs:
  null_control:
    name: N null NDF15 segmentation control
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build unsegmented and segmented exact-pin CLASS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git base
          git -C base checkout -q "$CLASS_PIN"
          test "$(git -C base rev-parse HEAD)" = "$CLASS_PIN"
          cp -a base seg
          mkdir -p result out
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py seg --manifest result/null_restart_manifest.json
          git -C seg diff -- source/background.c > result/null_restart.diff
          make -C base -j2 class > result/base_build.log 2>&1
          make -C seg -j2 class > result/seg_build.log 2>&1
      - name: Run identical frozen LambdaCDM controls
        shell: bash
        run: |
          set -euo pipefail
          for mode in base seg; do
            cat > result/${mode}.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.12
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${mode}_
          EOF
            set +e
            (cd ${mode} && ./class "$GITHUB_WORKSPACE/result/${mode}.ini") > result/${mode}_stdout.txt 2> result/${mode}_stderr.txt
            rc=$?
            set -e
            echo "$rc" > result/${mode}_rc.txt
          done
      - name: Frozen null-control gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import bisect,json,math,re
          out=Path('out'); res=Path('result')
          rc0=int((res/'base_rc.txt').read_text()); rc1=int((res/'seg_rc.txt').read_text())
          checks={'base_rc_zero':rc0==0,'segmented_rc_zero':rc1==0}
          data={'base_rc':rc0,'segmented_rc':rc1}
          if rc0==0 and rc1==0:
            def one(pat):
              a=sorted(out.glob(pat)); assert len(a)==1,(pat,[str(x) for x in a]); return a[0]
            def rows(p):
              return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
            b=rows(one('base*_pk.dat')); s=rows(one('seg*_pk.dat'))
            sx=[r[0] for r in s]; sy=[r[1] for r in s]
            def interp(x):
              i=bisect.bisect_left(sx,x)
              if i==0:return sy[0]
              if i>=len(sx):return sy[-1]
              x0,x1=sx[i-1],sx[i]; y0,y1=sy[i-1],sy[i]
              f=(math.log(x)-math.log(x0))/(math.log(x1)-math.log(x0))
              return math.exp(math.log(y0)+f*(math.log(y1)-math.log(y0)))
            common=[r for r in b if sx[0]<=r[0]<=sx[-1]]
            finite=bool(common) and all(r[0]>0 and r[1]>0 and all(math.isfinite(v) for v in r) for r in b+s)
            num=sum((r[1]-interp(r[0]))**2 for r in common); den=sum(r[1]**2 for r in common)
            l2=math.sqrt(num/max(den,1e-300))
            def H0(path):
              lines=path.read_text().splitlines(); hs=[l for l in lines if l.lstrip().startswith('#') and 'H [1/Mpc]' in l and 'z' in l]; assert len(hs)==1,hs
              t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}
              rr=rows(path); row=min(rr,key=lambda q:abs(q[t['z']])); return row[t['H [1/Mpc]']]
            hb=H0(one('base*_background.dat')); hs=H0(one('seg*_background.dat'))
            hrel=abs(hb-hs)/max(abs(hb),abs(hs),1e-300)
            checks.update({'finite_positive_pk':finite,'pk_normalized_L2_le_1e_8':l2<=1e-8,'H0_relative_le_1e_10':hrel<=1e-10})
            data.update({'pk_rows_base':len(b),'pk_rows_segmented':len(s),'pk_normalized_L2':l2,'H0_base':hb,'H0_segmented':hs,'H0_relative_difference':hrel})
          else:
            checks.update({'finite_positive_pk':False,'pk_normalized_L2_le_1e_8':False,'H0_relative_le_1e_10':False})
          result={'schema':'KMDSB.W03.M13b.K3D2BTwoSegmentNullControl.v0.1','provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa','checks':checks,'all_required_checks_pass':all(checks.values()),'classification':('M13B_K3D2B_TWO_SEGMENT_NULL_CONTROL_PASS' if all(checks.values()) else 'M13B_K3D2B_TWO_SEGMENT_NULL_CONTROL_FAIL'),**data}
          (res/'null_control_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not result['all_required_checks_pass']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-two-segment-null-control
          path: |
            result/
            out/
          retention-days: 90

  enabled_background:
    name: E enabled qcf+qpf two-segment background
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-pin adapter with two-segment restart
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter_manifest.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --recover-handoff-boundary --manifest result/restart_manifest.json
          git -C provider diff -- source/background.c > result/restart_background.diff
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run frozen enabled background probe with NDF15
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          write_background = yes
          root = $GITHUB_WORKSPACE/out/enabled_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini") > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
      - name: Frozen enabled implementation-only gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,math,re
          res=Path('result'); out=Path('out'); rc=int((res/'provider_rc.txt').read_text())
          stderr=(res/'stderr.txt').read_text(errors='replace')
          checks={'provider_rc_zero':rc==0,'no_stepsize_underflow':'stepsize underflow' not in stderr.lower()}
          data={'provider_rc':rc}
          bgfiles=sorted(out.glob('enabled*_background.dat'))
          checks['background_file_present']=len(bgfiles)==1
          if rc==0 and len(bgfiles)==1:
            p=bgfiles[0]; lines=p.read_text().splitlines(); hs=[l for l in lines if l.lstrip().startswith('#') and 'phi_qcf' in l and 'psi_qpf' in l]
            assert len(hs)==1,hs
            t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}
            need=['z','H [1/Mpc]','phi_qcf',"phi'_qcf",'psi_qpf',"psi'_qpf"]
            assert all(k in t for k in need),(need,t)
            rr=[[float(x) for x in l.split()] for l in lines if l.strip() and not l.lstrip().startswith('#')]
            pts=[]
            for r in rr:
              z=r[t['z']]; a=1/(1+z); H=r[t['H [1/Mpc]']]
              pts.append({'a':a,'z':z,'H':H,'x':r[t['phi_qcf']],'p':r[t["phi'_qcf"]]/(a*H),'y':r[t['psi_qpf']],'q':r[t["psi'_qpf"]]/(a*H)})
            finite=bool(pts) and all(all(math.isfinite(v) for v in d.values()) and d['H']>0 for d in pts)
            pts.sort(key=lambda d:d['a'])
            below=any(d['a']<1/6 for d in pts); above=any(d['a']>1/6 for d in pts)
            def ai(a,key):
              for u,v in zip(pts[:-1],pts[1:]):
                if u['a']<=a<=v['a']:
                  f=(a-u['a'])/(v['a']-u['a']) if v['a']!=u['a'] else 0.; return u[key]+f*(v[key]-u[key])
              raise AssertionError((a,pts[0]['a'],pts[-1]['a']))
            z5={k:ai(1/6,k) for k in ['x','p','y','q']}
            checks.update({'finite_positive_background':finite,'samples_below_handoff':below,'samples_above_handoff':above,'z5_phi_match':abs(z5['x']-.92)<=2e-4,'z5_psi_match':abs(z5['y']-1.02)<=2e-4,'z5_dphi_dN_small':abs(z5['p'])<=2e-3,'z5_dpsi_dN_small':abs(z5['q'])<=2e-3})
            data.update({'background_rows':len(pts),'z5_interpolated':z5})
          else:
            checks.update({'finite_positive_background':False,'samples_below_handoff':False,'samples_above_handoff':False,'z5_phi_match':False,'z5_psi_match':False,'z5_dphi_dN_small':False,'z5_dpsi_dN_small':False})
          ok=all(checks.values())
          result={'schema':'KMDSB.W03.M13b.K3D2BTwoSegmentEnabledBackground.v0.1','provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa','checks':checks,'all_required_checks_pass':ok,'classification':('M13B_K3D2B_TWO_SEGMENT_ENABLED_BACKGROUND_PASS' if ok else 'M13B_K3D2B_TWO_SEGMENT_ENABLED_BACKGROUND_BLOCKED'),'B1_B2_B3_evaluated':False,'physical_falsification':False,**data}
          (res/'enabled_background_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-two-segment-enabled-background
          path: |
            result/
            out/
          retention-days: 90
