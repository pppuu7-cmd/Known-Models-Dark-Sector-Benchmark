name: W03 M13b K3D2-G vanilla CLASS RK restart control

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/w03-m13b-k3d2g-vanilla-class-rk-restart-control.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa

jobs:
  unsplit:
    name: U vanilla unsplit reference control
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact upstream plus error-text geometry probe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          sha256sum provider/cl_ref.pre > result/cl_ref_before.sha256
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry.json
          sha256sum provider/cl_ref.pre > result/cl_ref_after.sha256
          test "$(cat result/cl_ref_before.sha256)" = "$(cat result/cl_ref_after.sha256)"
          make -C provider -j2 class > result/build.log 2>&1
      - name: Execute frozen vanilla LCDM unsplit lane
        shell: bash
        run: |
          set -euo pipefail
          cat > result/control.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_Lambda = 0.6882
          Omega_k = 0
          N_ncdm = 0
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = synchronous
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          root = $GITHUB_WORKSPACE/out/u_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/control.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          R=Path('result'); rc=int((R/'provider_rc.txt').read_text())
          text=(R/'stderr.txt').read_text(errors='replace')+'\n'+(R/'stdout.txt').read_text(errors='replace')
          obj={
            'schema':'KMDSB.W03.M13B.K3D2G.UnsplitControl.v0.1',
            'provider_rc':rc,
            'rk_collapse_count':len(re.findall(r'KMDSB_RK_COLLAPSE',text)),
            'ndf15_collapse_count':len(re.findall(r'KMDSB_NDF15_COLLAPSE',text)),
            'classification':'UNSPLIT_EXECUTED' if rc==0 else 'UNSPLIT_NONZERO_RC',
            'physical_falsification':False
          }
          (R/'unsplit.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2g-unsplit
          path: result

  split:
    name: S vanilla exact-z5 hard restart control
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact upstream plus frozen split and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          sha256sum provider/cl_ref.pre > result/cl_ref_before.sha256
          python3 verification/m13b/k3d2g_apply_vanilla_z5_perturbation_split.py provider --manifest result/split_patch.json
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry.json
          python3 verification/m13b/k3d2b_apply_direct_mode_failure_trace.py provider --manifest result/failure_trace.json
          sha256sum provider/cl_ref.pre > result/cl_ref_after.sha256
          test "$(cat result/cl_ref_before.sha256)" = "$(cat result/cl_ref_after.sha256)"
          make -C provider -j2 class > result/build.log 2>&1
      - name: Execute frozen vanilla LCDM split lane
        shell: bash
        run: |
          set -euo pipefail
          cat > result/control.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_Lambda = 0.6882
          Omega_k = 0
          N_ncdm = 0
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          gauge = synchronous
          output = tCl,pCl,lCl,mPk,dTk
          lensing = yes
          l_max_scalars = 1200
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          root = $GITHUB_WORKSPACE/out/s_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/control.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          python3 - <<'PY'
          import json,re,math
          from pathlib import Path
          R=Path('result'); rc=int((R/'provider_rc.txt').read_text())
          text=(R/'stderr.txt').read_text(errors='replace')+'\n'+(R/'stdout.txt').read_text(errors='replace')
          pat=re.compile(r'KMDSB_MODE_FAIL index_md=(\d+) index_ic=(\d+) index_k=(\d+) k=([^ ]+) interval_start=([^ ]+) evolver_start=([^ ]+) interval_end=([^ ]+) error=(.*)')
          rows=[]
          for m in pat.finditer(text):
            err=m.group(8); rk='KMDSB_RK_COLLAPSE' in err
            a=float(m.group(5)); b=float(m.group(6)); c=float(m.group(7))
            rows.append({'k':float(m.group(4)),'interval_start':a,'evolver_start':b,'interval_end':c,'rk_collapse':rk,'restart_shifted':b>a and b<c})
          rkrows=[x for x in rows if x['rk_collapse']]
          shifted=[x for x in rkrows if x['restart_shifted']]
          obj={
            'schema':'KMDSB.W03.M13B.K3D2G.SplitControl.v0.1',
            'provider_rc':rc,
            'mode_failure_count':len(rows),
            'rk_collapse_mode_count':len(rkrows),
            'rk_collapse_at_shifted_restart_count':len(shifted),
            'rk_collapse_k_range':None if not rkrows else [min(x['k'] for x in rkrows),max(x['k'] for x in rkrows)],
            'all_rk_collapses_at_shifted_restart':bool(rkrows) and len(shifted)==len(rkrows),
            'physical_falsification':False
          }
          (R/'split.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2g-split
          path: result

  aggregate:
    name: A frozen K3D2-G classification barrier
    needs: [unsplit, split]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2g-unsplit
          path: lanes/u
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2g-split
          path: lanes/s
      - name: Apply frozen classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
            u=json.loads(Path('lanes/u/unsplit.json').read_text())
            s=json.loads(Path('lanes/s/split.json').read_text())
            urc=int(u['provider_rc']); src=int(s['provider_rc'])
            if urc != 0:
              cls='M13B_K3D2G_VANILLA_CONTROL_IMPLEMENTATION_BLOCKED'
            elif src == 0:
              cls='M13B_K3D2G_GENERIC_CLASS_RK_HARD_RESTART_EFFECT_NOT_REPRODUCED'
            elif int(s.get('rk_collapse_mode_count',0))>0 and bool(s.get('all_rk_collapses_at_shifted_restart')):
              cls='M13B_K3D2G_GENERIC_CLASS_RK_HARD_RESTART_LAYER_EFFECT_SUPPORTED'
            else:
              cls='M13B_K3D2G_SPLIT_CONTROL_NUMERICAL_GAP_NOT_LOCALIZED'
            out={'schema':'KMDSB.W03.M13B.K3D2G.VanillaRestartControlResult.v0.1','classification':cls,'unsplit':u,'split':s,'provider':'lesgourg/class_public','provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa','K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False}
          except Exception as e:
            out={'schema':'KMDSB.W03.M13B.K3D2G.VanillaRestartControlResult.v0.1','classification':'M13B_K3D2G_VANILLA_CONTROL_IMPLEMENTATION_BLOCKED','error':repr(e),'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False}
          Path('k3d2g_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m13b-k3d2g-vanilla-rk-restart-control
          path: k3d2g_result.json
          if-no-files-found: error
