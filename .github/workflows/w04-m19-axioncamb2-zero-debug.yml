name: W04 M19 axionCAMB2 zero debug diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m19-axioncamb2-zero-debug.yml'
      - 'protocol/W04_M19_AXIONCAMB2_ZERO_DEBUG_DIAGNOSTIC_v0.1.md'
      - 'verification/m19/axioncamb2_zero_probe.py'

jobs:
  zero-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIN: 891e779cc0bd422e49f97533e6c2fc761149737d
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Pin provider and prepare exact-zero case
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/dgrin1/axionCAMB.git external_axioncamb
          git -C external_axioncamb checkout -q --detach "$PIN"
          test "$(git -C external_axioncamb rev-parse HEAD)" = "$PIN"
          python3 verification/m19/axioncamb2_zero_probe.py prepare external_axioncamb/params.ini m19_axc_debug_cases
      - name: Debug build and exact-zero execution
        shell: bash
        run: |
          set +e
          cd external_axioncamb
          make -j1 FFLAGS='-O0 -g -fbacktrace -fcheck=all -ffree-line-length-none -fallow-argument-mismatch' > ../m19_axc_debug_build.log 2>&1
          be=$?
          rc=999
          if [ "$be" -eq 0 ]; then
            ./camb ../m19_axc_debug_cases/r0f.ini > ../m19_axc_debug_r0f.log 2>&1
            rc=$?
          fi
          cd ..
          printf '{"build_exit":%d,"zero_exit":%d}\n' "$be" "$rc" > m19_axc_debug_status.json
          cat m19_axc_debug_status.json
          exit 0
      - name: Upload immutable debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-m19-axioncamb2-zero-debug
          path: |
            m19_axc_debug_cases/r0f.ini
            m19_axc_debug_build.log
            m19_axc_debug_r0f.log
            m19_axc_debug_status.json
            protocol/W04_M19_AXIONCAMB2_ZERO_DEBUG_DIAGNOSTIC_v0.1.md
          retention-days: 90
