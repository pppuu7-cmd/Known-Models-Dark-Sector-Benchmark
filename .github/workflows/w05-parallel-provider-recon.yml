name: W05 parallel provider recon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w05-parallel-provider-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        model: [M34, M36, M38, M39, M41, M42, M43]
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL_ID: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - name: Frozen public-provider search and scoring
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request, urllib.error, time

          model=os.environ['MODEL_ID']
          queries={
            'M34':['bimetric gravity CLASS cosmology','bigravity CAMB Boltzmann','massive gravity Boltzmann cosmology'],
            'M36':['TeVeS CLASS cosmology','TeVeS CAMB Boltzmann','relativistic MOND Boltzmann cosmology'],
            'M38':['f(Q) gravity CLASS cosmology','symmetric teleparallel CAMB cosmology','f(Q) Boltzmann cosmology'],
            'M39':['nonlocal gravity CLASS cosmology','nonlocal gravity CAMB Boltzmann','RR nonlocal cosmology Boltzmann'],
            'M41':['mimetic gravity CLASS cosmology','mimetic CAMB Boltzmann','mimetic cosmology Boltzmann code'],
            'M42':['LTB CLASS cosmology','LTB CAMB Boltzmann','void cosmology Boltzmann code'],
            'M43':['cosmological backreaction CLASS','backreaction CAMB cosmology','Buchert backreaction Boltzmann code'],
          }[model]
          family_terms={
            'M34':['bimetric','bigravity','massive gravity'],
            'M36':['teves','relativistic mond'],
            'M38':['f(q)','symmetric teleparallel'],
            'M39':['nonlocal gravity','rr nonlocal','non-local gravity'],
            'M41':['mimetic'],
            'M42':['ltb','lemaitre-tolman','void cosmology'],
            'M43':['backreaction','buchert'],
          }[model]
          token=os.environ.get('GH_TOKEN','')
          headers={'Accept':'application/vnd.github+json','User-Agent':'KMDSB-W05-provider-recon'}
          if token: headers['Authorization']='Bearer '+token

          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=20) as r:
              return json.load(r)

          found={}; errors=[]
          for q in queries:
            try:
              url='https://api.github.com/search/repositories?q='+urllib.parse.quote(q)+'&per_page=10&sort=stars&order=desc'
              data=get(url)
              for rank,item in enumerate(data.get('items',[]),1):
                full=item['full_name']
                rec=found.setdefault(full,{
                  'full_name':full,'html_url':item.get('html_url'),'description':item.get('description') or '',
                  'stars':item.get('stargazers_count',0),'updated_at':item.get('updated_at'),'queries':[],'best_rank':rank})
                rec['queries'].append(q); rec['best_rank']=min(rec['best_rank'],rank)
            except Exception as e:
              errors.append({'query':q,'error':repr(e)})

          ordered=sorted(found.values(),key=lambda r:(-len(r['queries']),r['best_rank'],-r['stars']))[:12]
          for rec in ordered:
            full=rec['full_name']; readme=''
            try:
              rd=get('https://api.github.com/repos/'+full+'/readme')
              if rd.get('encoding')=='base64': readme=base64.b64decode(rd.get('content','')).decode('utf-8','replace')
            except Exception as e:
              rec['readme_error']=repr(e)
            text=(full+' '+rec.get('description','')+' '+readme[:16000]).lower()
            score=0; evidence=[]
            for t in family_terms:
              if t in text:
                score+=2; evidence.append('family:'+t); break
            for t in ['class','camb','boltzmann']:
              if t in text:
                score+=2; evidence.append('solver:'+t); break
            for t in ['arxiv','paper','publication','cite this','used in']:
              if t in text:
                score+=1; evidence.append('provenance:'+t); break
            if any(x in text for x in ['cosmology','cosmological']):
              score+=1; evidence.append('cosmology')
            rec['score']=score; rec['evidence']=evidence
            rec['readme_excerpt']=readme[:1200]
          candidates=[r for r in ordered if r.get('score',0)>=4]
          if errors and not ordered:
            classification='SEARCH_BLOCKED'
          elif candidates:
            classification='PROVIDER_CANDIDATES_FOUND_REQUIRES_AUDIT'
          else:
            classification='NO_PROVIDER_GRADE_CANDIDATE_FOUND_IN_FROZEN_SEARCH'
          out={
            'schema':'w05_parallel_provider_recon_v0.1','model_id':model,'queries':queries,
            'classification':classification,'K0_promoted':False,'physical_falsification':False,
            'candidate_count':len(candidates),'candidates':candidates,'top_results':ordered,'errors':errors,
            'scope':'public GitHub provider reconnaissance only; exact-pin source/build/execution/provenance audit required before K0 change'
          }
          path=f'recon_{model}.json'
          open(path,'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'model':model,'classification':classification,'candidate_count':len(candidates),'candidates':[c['full_name'] for c in candidates]},indent=2))
          PY
      - name: Upload lane artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-recon-${{ matrix.model }}
          path: recon_${{ matrix.model }}.json
