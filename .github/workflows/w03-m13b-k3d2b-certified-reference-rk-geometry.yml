name: W03 M13b K3D2-B certified reference RK geometry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w03-m13b-k3d2b-certified-reference-rk-geometry.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa
  K1: '0.00022398828992555914'
  K10: '0.0022398828992555913'

jobs:
  source_guard:
    name: S certified reference diagnostic source guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact certified stack and diagnostic patches
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry.json
          python3 verification/m13b/k3d2b_apply_direct_mode_failure_trace.py provider --manifest result/failure_trace.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('result/cert_tau.json').read_text())
          g=json.loads(Path('result/geometry.json').read_text())
          f=json.loads(Path('result/failure_trace.json').read_text())
          checks={
            'certified_exact_12_ulps':c.get('expected_certified_tau_ulps')==12,
            'certified_uses_background_at_tau':c.get('certification_uses_background_at_tau') is True,
            'certified_no_equation_change':c.get('changes_open_interval_equations') is False,
            'geometry_error_text_only':g.get('changes_error_text_only') is True,
            'geometry_no_solver_logic_change':g.get('changes_solver_logic') is False,
            'geometry_no_tolerance_change':g.get('changes_tolerances') is False,
            'failure_wrapper_preserves_args':f.get('preserves_generic_evolver_arguments') is True,
            'failure_wrapper_original_error_unchanged':f.get('original_error_buffer_unchanged') is True,
            'failure_wrapper_no_state_change':f.get('changes_state_vector') is False,
          }
          ok=all(checks.values())
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedReferenceGeometrySourceGuard.v0.1','checks':checks,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_REFERENCE_GEOMETRY_SOURCE_GUARD_PASS' if ok else 'M13B_K3D2B_CERTIFIED_REFERENCE_GEOMETRY_SOURCE_GUARD_FAIL','B1_B2_B3_evaluated':False,'physical_falsification':False}
          Path('result/source_guard.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-reference-geometry-source
          path: result
          retention-days: 90

  reference:
    name: R certified cl_ref RK collapse capture
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact certified diagnostic provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter.json
          python3 verification/m13b/k3d2b_apply_piecewise_background_restart.py provider --conditional-qfields --recover-handoff-boundary --manifest result/bg_restart.json
          python3 verification/m13b/k3d2b_apply_post_handoff_ulp_seam.py provider --ulps 1 --manifest result/bg_ulp.json
          python3 verification/m13b/k3d2b_apply_perturbation_native_interval_split.py provider --manifest result/pt_split.json
          python3 verification/m13b/k3d2b_apply_mapping_certified_tau_seam.py provider --manifest result/cert_tau.json
          python3 verification/m13b/k3d2b_apply_solver_collapse_geometry_probe.py provider --manifest result/geometry_patch.json
          python3 verification/m13b/k3d2b_apply_direct_mode_failure_trace.py provider --manifest result/failure_trace.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Execute unchanged certified reference lane
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk,dTk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          k_output_values = $K1,$K10
          root = $GITHUB_WORKSPACE/out/ref_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled.ini" cl_ref.pre) > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
      - name: Freeze certified reference collapse geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,statistics,math
          text=Path('result/stderr.txt').read_text(errors='replace')+'\n'+Path('result/stdout.txt').read_text(errors='replace')
          base=re.compile(r'KMDSB_MODE_FAIL index_md=(\d+) index_ic=(\d+) index_k=(\d+) k=([^ ]+) interval_start=([^ ]+) evolver_start=([^ ]+) interval_end=([^ ]+) error=(.*)')
          rk=re.compile(r'KMDSB_RK_COLLAPSE x=([^| ]+) step_ratio=([^| ]+) minimum=([^| ]+) hdid=([^| ]+) hnext=([^| ]+) step_index=(\d+) interval=\[([^:]+):([^\]]+)\]')
          rows=[]
          for m in base.finditer(text):
            q=rk.search(m.group(8))
            rec={'index_md':int(m.group(1)),'index_ic':int(m.group(2)),'index_k':int(m.group(3)),'k':float(m.group(4)),'interval_start':float(m.group(5)),'evolver_start':float(m.group(6)),'interval_end':float(m.group(7))}
            if q:
              rec.update({'collapse_tau':float(q.group(1)),'step_ratio':float(q.group(2)),'minimum':float(q.group(3)),'hdid':float(q.group(4)),'hnext':float(q.group(5)),'step_index':int(q.group(6)),'rk_interval_start':float(q.group(7)),'rk_interval_end':float(q.group(8))})
            rows.append(rec)
          uniq=[]; seen=set()
          for x in rows:
            key=(x['index_md'],x['index_ic'],x['index_k'],x['k'])
            if key not in seen: seen.add(key); uniq.append(x)
          parsed=[x for x in uniq if 'collapse_tau' in x]
          rc=int(Path('result/provider_rc.txt').read_text())
          K1=float('${{ env.K1 }}'); K10=float('${{ env.K10 }}')
          def contains(k): return any(abs(x['k']-k)/max(abs(k),1e-300)<=1e-8 for x in parsed)
          def stat(key):
            vals=sorted(x[key] for x in parsed)
            return {'min':min(vals),'median':statistics.median(vals),'max':max(vals)} if vals else None
          cert=re.search(r'KMDSB_CERT_TAU ulps=(\d+) tau0=([^ ]+) tau_prev=([^ ]+) a_prev=([^ ]+) tau_cert=([^ ]+) a_cert=([^ ]+) a_handoff=([^\s]+)',text)
          cert_data=None
          if cert:
            cert_data={'ulps':int(cert.group(1)),'tau_handoff':float(cert.group(2)),'tau_prev':float(cert.group(3)),'a_prev':float(cert.group(4)),'tau_cert':float(cert.group(5)),'a_cert':float(cert.group(6)),'a_handoff':float(cert.group(7))}
          summary={
            'failure_count':len(uniq),
            'geometry_parsed_count':len(parsed),
            'k_range':None if not parsed else [min(x['k'] for x in parsed),max(x['k'] for x in parsed)],
            'K1_failed':contains(K1),
            'K10_failed':contains(K10),
            'collapse_tau':stat('collapse_tau'),
            'hdid':stat('hdid'),
            'hnext':stat('hnext'),
            'step_ratio':stat('step_ratio'),
            'step_index':stat('step_index'),
          }
          ok=(rc!=0 and len(parsed)>=1 and cert_data is not None and cert_data['ulps']==12)
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedReferenceRKGeometry.v0.1','provider_rc':rc,'certificate':cert_data,'records':sorted(parsed,key=lambda x:x['k']),'summary':summary,'all_required_checks_pass':ok,'classification':'M13B_K3D2B_CERTIFIED_REFERENCE_RK_GEOMETRY_CAPTURED' if ok else 'M13B_K3D2B_CERTIFIED_REFERENCE_RK_GEOMETRY_NOT_ESTABLISHED','B1_B2_B3_evaluated':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False}
          Path('result/certified_reference_geometry.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'classification':obj['classification'],'summary':summary,'certificate':cert_data},indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-reference-rk-geometry
          path: result
          retention-days: 90

  verdict:
    name: V certified reference RK geometry verdict
    needs:
      - source_guard
      - reference
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-reference-geometry-source
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: m13b-k3d2b-certified-reference-rk-geometry
          path: reference
      - name: Freeze diagnostic verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('source/source_guard.json').read_text())
          r=json.loads(Path('reference/certified_reference_geometry.json').read_text())
          ok=s['all_required_checks_pass'] and r['all_required_checks_pass']
          obj={'schema':'KMDSB.W03.M13b.K3D2BCertifiedReferenceGeometryVerdict.v0.1','source_guard_pass':s['all_required_checks_pass'],'geometry_captured':r['all_required_checks_pass'],'summary':r['summary'],'classification':'M13B_K3D2B_CERTIFIED_REFERENCE_RK_NUMERICAL_BLOCKER_LOCALIZED' if ok else 'M13B_K3D2B_CERTIFIED_REFERENCE_RK_DIAGNOSTIC_GAP','reference_robustness_established':False,'B1_B2_B3_evaluated':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False}
          Path('verdict.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n'); print(json.dumps(obj,indent=2,sort_keys=True)); assert ok,obj
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m13b-k3d2b-certified-reference-geometry-verdict
          path: verdict.json
          retention-days: 90
