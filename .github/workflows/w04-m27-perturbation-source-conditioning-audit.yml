name: W04 M27 perturbation source conditioning audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m27-perturbation-source-conditioning-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        g0: [0.03, 0.3, 3.0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy==1.16.2
      - name: Run normalized N1/support/tolerance audit
        run: |
          python3 verification/m27/perturbation_source_conditioning_audit.py '${{ matrix.g0 }}' result.json
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m27-source-conditioning-g${{ matrix.g0 }}
          path: result.json
          retention-days: 90
  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m27-source-conditioning-g*
          path: collected
      - name: Select first common frozen support and persist
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          supports=['1e-04','3e-04','1e-03','3e-03','1e-02']
          first=None
          if len(rs)==3 and all(r.get('classification')=='M27_PERTURBATION_SOURCE_CONDITIONING_GAMMA_MEASURED' for r in rs):
              for s in supports:
                  if all(r['n1_support_pass'].get(s,False) for r in rs): first=s; break
          fine=False
          if first is not None:
              fine=all(all(v['dhat_amp_norm_max']<=1e-6 and v['that_amp_norm_max']<=1e-6 for v in r['solver_fine_pair_by_support'][first].values()) for r in rs)
          finite=(len(rs)==3 and all(r.get('finite',False) for r in rs))
          ok=(first is not None and fine and finite)
          s={'schema':'KMDSB.M27.PerturbationSourceConditioningAudit.Summary.v1','preregistration':'protocol/W04_M27_PERTURBATION_SOURCE_CONDITIONING_RECOVERY_PREREGISTRATION_v0.1.md','n_results':len(rs),'first_common_support':first,'fine_solver_pair_pass':fine,'finite':finite,'children':{str(r.get('Gamma0_over_Hstar')):r.get('classification') for r in rs},'n1_support_pass':{str(r.get('Gamma0_over_Hstar')):r.get('n1_support_pass') for r in rs},'fine_pair_at_selected_support':{str(r.get('Gamma0_over_Hstar')):(r.get('solver_fine_pair_by_support',{}).get(first) if first else None) for r in rs},'classification':'M27_PERTURBATION_SOURCE_CONDITIONING_RECOVERY_PASS_WITH_SCOPE' if ok else 'M27_PERTURBATION_SOURCE_CONDITIONING_RECOVERY_NOT_ESTABLISHED','normalized_27way_recovery_authorized':bool(ok),'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n'); print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/dynamical_dark_matter
          cp /tmp/summary.json waves/wave_04_dark_matter/M27_PERTURBATION_SOURCE_CONDITIONING_AUDIT_SUMMARY.json
          cp /tmp/summary.json models/dynamical_dark_matter/M27_PERTURBATION_SOURCE_CONDITIONING_AUDIT_SUMMARY.json
          git add waves/wave_04_dark_matter models/dynamical_dark_matter
          git diff --cached --quiet || { git commit -m 'Record M27 perturbation source conditioning audit'; git pull --rebase origin main; git push origin HEAD:main; }
