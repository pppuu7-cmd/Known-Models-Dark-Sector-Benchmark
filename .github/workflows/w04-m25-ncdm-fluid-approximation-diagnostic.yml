name: W04 M25 NCDM fluid-approximation diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m25-ncdm-fluid-approximation-diagnostic.yml']
permissions:
  contents: write
  actions: read
jobs:
  nofluid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [m0, m1]
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: w04-m25-k1-abundance-decoupling
          path: original
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34548988620
      - name: Restore frozen inputs and build provider
        shell: bash
        run: |
          cp -a original/m25_k1_cases m25_k1_cases
          printf 'tol_ncdm_bg = 1e-6\ntol_ncdm = 1e-6\nncdm_fluid_approximation = 3\n' > nofluid.pre
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class/include/common.h'); s=p.read_text()
          assert s.count('#define _QUADRATURE_MAX_ 250')==1 and s.count('#define _QUADRATURE_MAX_BG_ 800')==1
          p.write_text(s.replace('#define _QUADRATURE_MAX_ 250','#define _QUADRATURE_MAX_ 4000').replace('#define _QUADRATURE_MAX_BG_ 800','#define _QUADRATURE_MAX_BG_ 4000'))
          PY
          make -C class -j2 > build.log 2>&1
      - name: Execute four independent cases two-at-a-time
        shell: bash
        run: |
          mkdir -p class/output logs parts
          printf '%s\n' ref e2 e3 e4 | xargs -P 2 -I{} bash -c '
            short="$1"; model="$2"; id="$short"; [ "$short" = ref ] || id="${model}_${short}"
            set +e
            (cd class && ./class "../m25_k1_cases/${id}.ini" ../nofluid.pre > "../logs/${id}.log" 2>&1)
            printf "%d\n" "$?" > "parts/${short}.status"
          ' _ {} '${{ matrix.model }}'
          python3 - <<'PY'
          import json
          from pathlib import Path
          d={'build':0}; d.update({p.stem:int(p.read_text()) for p in Path('parts').glob('*.status')})
          Path('status.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - name: Analyze no-fluid perturbation boundary
        run: |
          python3 verification/m25/ncdm_fluid_approximation_diagnostic.py class '${{ matrix.model }}' status.json result.json
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m25-ncdm-nofluid-${{ matrix.model }}
          path: |
            nofluid.pre
            build.log
            status.json
            result.json
            logs/
            class/output/
          retention-days: 90
  aggregate:
    needs: nofluid
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m25-ncdm-nofluid-*
          path: collected
      - name: Persist summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          s={'schema':'KMDSB.M25.NCDMFluidApproximationDiagnostic.Summary.v1','preregistration':'protocol/W04_M25_NCDM_FLUID_APPROXIMATION_DIAGNOSTIC_PREREGISTRATION_v0.1.md','children':{r['model']:r['classification'] for r in rs},'recovered_blocks':{r['model']:r.get('recovered_perturbation_blocks',[]) for r in rs},'K1_promoted':False,'K4_promoted':False,'physical_falsification':False}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          cp /tmp/summary.json waves/wave_04_dark_matter/M25_NCDM_FLUID_APPROXIMATION_DIAGNOSTIC_SUMMARY.json
          cp /tmp/summary.json models/resonant_sterile_neutrino_wdm/M25_NCDM_FLUID_APPROXIMATION_DIAGNOSTIC_SUMMARY.json
          git add waves/wave_04_dark_matter models/resonant_sterile_neutrino_wdm
          git diff --cached --quiet || { git commit -m 'Record M25 NCDM fluid-approximation diagnostic'; git pull --rebase origin main; git push origin HEAD:main; }
