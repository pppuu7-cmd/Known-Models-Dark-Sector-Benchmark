name: Sync M35 K0 state

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-m35-k0-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical M35 matrix and census state
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          p=Path('matrices/mandatory_properties_matrix.csv')
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); found=False
          for r in rows:
              if r['benchmark_id']=='M35':
                  found=True
                  r['K0_provenance']='PASS_WITH_SCOPE'
                  for k in ['K1_reference_limit','K2_physical_geometry','K3_conservation_gauge_closure','K4_numerical_robustness','K5_multichannel_rank','K6_nearest_family_manifold','K7_common_observation_space','K8_quotient_novelty','K9_prospective_holdout']:
                      r[k]='OPEN'
                  r['coverage_state']='K0_PINNED_CLASS_LVDM_AETHER_GRAVITY_PASS_K1_K9_OPEN'
                  r['notes']='Einstein-Aether/vector-tensor scoped representative: pinned CLASS_LVDM preferred-frame/Lorentz-violating gravity provider at exact commit d9a20bd executes weak-gravity control and gravity-only active arm (Y_dm=0) with finite CMB/P(k). Active response is large (TT normalized L2 0.3987046; P(k) 0.3983713; frozen threshold 1e-6). K0 PASS_WITH_SCOPE only; this does not establish complete Einstein-Aether SVT coverage. K1-K9 remain open.'
          if not found: raise SystemExit('M35 matrix row missing')
          t=p.with_suffix('.tmp')
          with t.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          t.replace(p)

          p=Path('matrices/model_family_census.csv')
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          fields=list(rows[0].keys()); found=False
          for r in rows:
              if r['family_id']=='F35':
                  found=True
                  for k,v in list(r.items()):
                      if v in ('QUEUED','NOT_TESTED','PENDING'):
                          r[k]='K0_CLASS_LVDM_AETHER_GRAVITY_PASS_K1_K9_OPEN'
                  r[fields[-1]]='Pinned CLASS_LVDM preferred-frame/LV-gravity provider executes exact-pin gravity-only active arm and weak-gravity control with finite CMB/P(k) and strong nonzero response. K0 PASS_WITH_SCOPE; complete Einstein-Aether SVT coverage and K1-K9 remain open.'
          if not found: raise SystemExit('F35 census row missing')
          t=p.with_suffix('.tmp')
          with t.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          t.replace(p)
          PY
      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add matrices/mandatory_properties_matrix.csv matrices/model_family_census.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync M35 CLASS_LVDM K0 scoped state'
          git push
