name: W04 M21 l400 analysis successors v0.1

on:
  workflow_run:
    workflows: ['W04 M21 l400 convolution successor router v0.1']
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RUN: '34907528331'

jobs:
  route:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      successors: ${{ steps.read.outputs.successors }}
    steps:
      - uses: actions/checkout@v4
      - name: Download router authority
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-convolution-successor-router-v01
          path: router
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: read
        name: Read frozen authorized successors
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('router/M21_L400_CONVOLUTION_SUCCESSOR_ROUTER_RESULT.json'))
          xs=d.get('authorized_successors',[])
          print('router classification:',d.get('classification'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('successors='+','.join(xs)+'\n')
          PY

  radial:
    needs: route
    if: ${{ contains(needs.route.outputs.successors, 'RADIAL_KERNEL_GEOMETRY') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download clean recovery aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-transfer-convolution-decomposition-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Download recovered case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen common-x radial audit
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_radial_kernel_geometry.py \
            components \
            parent/M21_L400_TRANSFER_CONVOLUTION_DECOMPOSITION_RESULT.json \
            M21_L400_RADIAL_KERNEL_GEOMETRY_RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-radial-kernel-geometry-v01
          path: M21_L400_RADIAL_KERNEL_GEOMETRY_RESULT.json
          if-no-files-found: error
          retention-days: 90

  convolution:
    needs: route
    if: ${{ contains(needs.route.outputs.successors, 'CONVOLUTION_SIGN_CANCELLATION') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download clean recovery aggregate
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-transfer-convolution-decomposition-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Download recovered case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m21-l400-conv-case-*-v01
          path: components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.RECOVERY_RUN }}
      - name: Run frozen signed-convolution audit
        run: |
          python3 -m pip install --disable-pip-version-check -q numpy==2.2.6
          python3 verification/m21/l400_convolution_sign_cancellation.py \
            components \
            parent/M21_L400_TRANSFER_CONVOLUTION_DECOMPOSITION_RESULT.json \
            M21_L400_CONVOLUTION_SIGN_CANCELLATION_RESULT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-l400-convolution-sign-cancellation-v01
          path: M21_L400_CONVOLUTION_SIGN_CANCELLATION_RESULT.json
          if-no-files-found: error
          retention-days: 90
