name: W03 M13b K3D2-A exact-anchor recovery gates

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2a-anchor-recovery.yml'
      - 'verification/m13b/k3d2_apply_class_two_field_adapter_entry.py'

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa

permissions:
  contents: write

jobs:
  source_audit:
    name: lane-B recovered source/sign audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact pin with recovered IC anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile verification/m13b/k3d2_apply_class_two_field_adapter.py verification/m13b/k3d2_apply_class_two_field_adapter_entry.py
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p lane_result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest lane_result/patch_manifest.json
      - name: Audit frozen source structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          allowed={'include/background.h','source/background.c','source/input.c','include/perturbations.h','source/perturbations.c'}
          changed=set(subprocess.check_output(['git','-C','provider','diff','--name-only'],text=True).split())
          m=json.loads(pathlib.Path('lane_result/patch_manifest.json').read_text())
          bg=pathlib.Path('provider/source/background.c').read_text()
          pt=pathlib.Path('provider/source/perturbations.c').read_text()
          ph=pathlib.Path('provider/include/perturbations.h').read_text()
          checks={}
          def need(k,v): checks[k]=bool(v); assert v,k
          need('only_authorized_files_changed',bool(changed) and changed<=allowed)
          need('upstream_scf_lines_preserved',m['upstream_scf_lines_byte_sequence_preserved'])
          need('qcf_rho_sign','(phi_prime_qcf*phi_prime_qcf/(2*a*a) + V_qcf(pba,phi_qcf))/3.' in bg)
          need('qcf_p_sign','(phi_prime_qcf*phi_prime_qcf/(2*a*a) - V_qcf(pba,phi_qcf))/3.' in bg)
          need('qpf_rho_sign','(-psi_prime_qpf*psi_prime_qpf/(2*a*a) + V_qpf(pba,psi_qpf))/3.' in bg)
          need('qpf_p_sign','(-psi_prime_qpf*psi_prime_qpf/(2*a*a) - V_qpf(pba,psi_qpf))/3.' in bg)
          need('qcf_background_force_sign','- a*dV_qcf(pba,y[pba->index_bi_phi_qcf])/H' in bg)
          need('qpf_background_force_sign','+ a*dV_qpf(pba,y[pba->index_bi_psi_qpf])/H' in bg)
          need('qcf_kg_mass_sign','(k2 + a2*pvecback[pba->index_bg_ddV_qcf])*y[pv->index_pt_phi_qcf]' in pt)
          need('qpf_kg_mass_sign','(k2 - a2*pvecback[pba->index_bg_ddV_qpf])*y[pv->index_pt_psi_qpf]' in pt)
          need('qcf_momentum_sign','ppw->rho_plus_p_theta += 1./3.*k*k/a2*ppw->pvecback[pba->index_bg_phi_prime_qcf]*y[ppw->pv->index_pt_phi_qcf];' in pt)
          need('qpf_momentum_sign','ppw->rho_plus_p_theta -= 1./3.*k*k/a2*ppw->pvecback[pba->index_bg_psi_prime_qpf]*y[ppw->pv->index_pt_psi_qpf];' in pt)
          need('qcf_metric_sign','-pow(ppw->pvecback[pba->index_bg_phi_prime_qcf],2)*psi/a2' in pt)
          need('qpf_metric_sign','+pow(ppw->pvecback[pba->index_bg_psi_prime_qpf],2)*psi/a2' in pt)
          need('distinct_state_indices',all(x in ph for x in ['index_pt_phi_qcf','index_pt_phi_prime_qcf','index_pt_psi_qpf','index_pt_psi_prime_qpf']))
          need('no_qcf_rhop_denominator','/(pvecback[pba->index_bg_rho_qcf]+pvecback[pba->index_bg_p_qcf])' not in pt)
          need('no_qpf_rhop_denominator','/(pvecback[pba->index_bg_rho_qpf]+pvecback[pba->index_bg_p_qpf])' not in pt)
          need('synchronous_scope_guard','qcf/qpf adapter is prospectively restricted to synchronous evolution' in pt)
          pathlib.Path('lane_result/source_audit.json').write_text(json.dumps({'schema':'KMDSB.W03.M13b.K3D2ARecoveredSourceAudit.v0.1','checks':checks,'changed_files':sorted(changed),'all_required_checks_pass':all(checks.values())},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-recovered-source
          path: lane_result/
          retention-days: 90

  normalization_audit:
    name: lane-C recovered normalization audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply independently and audit constants
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p lane_result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest lane_result/patch_manifest.json
          python3 - <<'PY'
          import json,pathlib,math
          c=json.loads(pathlib.Path('verification/m13b/k3d2_adapter_frozen_constants.json').read_text())
          m=json.loads(pathlib.Path('lane_result/patch_manifest.json').read_text())
          bg=pathlib.Path('provider/source/background.c').read_text(); inp=pathlib.Path('provider/source/input.c').read_text()
          checks={}
          def need(k,v): checks[k]=bool(v); assert v,k
          need('exact_pin',c['provider_commit']==m['provider_commit_required'])
          need('exact_U0',c['U0']==0.3362232603714306 and m['U0']==c['U0'])
          need('exact_s',c['s']==29.0 and 'tanh(29.*(1.-x))' in bg)
          need('normalization_map',c['normalization_map']=='V_class=3*H0^2*U' and 'return 3.*pba->H0*pba->H0*u0*(th+1.);' in bg)
          need('qcf_start',c['qcf']['field_initial_reduced_planck']==0.92 and 'pba->phi_ini_qcf = 0.92;' in inp)
          need('qpf_start',c['qpf']['field_initial_reduced_planck']==1.02 and 'pba->psi_ini_qpf = 1.02;' in inp)
          need('zero_initial_velocities','pba->phi_prime_ini_qcf = 0.;' in inp and 'pba->psi_prime_ini_qpf = 0.;' in inp)
          need('absent_by_default','pba->qcf_U0 = 0.;' in inp and 'pba->qpf_U0 = 0.;' in inp)
          need('public_V0_not_used',not c['published_V0_reproduced'] and not m['published_V0_reproduced'])
          need('author_map_not_claimed',not c['author_normalization_map_claimed'] and not m['author_normalization_map_claimed'])
          need('no_promotion_leakage',c['K3_state_ceiling']=='PARTIAL' and not c['K4_promoted'] and not c['K5_promoted'] and not c['physical_falsification'])
          pathlib.Path('lane_result/normalization_audit.json').write_text(json.dumps({'schema':'KMDSB.W03.M13b.K3D2ARecoveredNormalizationAudit.v0.1','checks':checks,'all_required_checks_pass':all(checks.values()),'published_V0_reproduced':False,'author_normalization_map_claimed':False},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-recovered-normalization
          path: lane_result/
          retention-days: 90

  build_regression:
    name: lane-A recovered build/null-Pk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, patch, and build independent exact pins
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git baseline
          git clone -q https://github.com/lesgourg/class_public.git patched
          git -C baseline checkout -q "$CLASS_PIN"
          git -C patched checkout -q "$CLASS_PIN"
          test "$(git -C baseline rev-parse HEAD)" = "$CLASS_PIN"
          test "$(git -C patched rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p lane_result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py patched --manifest lane_result/patch_manifest.json
          make -C baseline -j2 class > lane_result/baseline_build.log 2>&1
          make -C patched -j2 class > lane_result/patched_build.log 2>&1
      - name: Identical LambdaCDM null controls and L2
        shell: bash
        run: |
          set -euo pipefail
          cat > lane_result/base.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.12
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          overwrite_root = yes
          root = $GITHUB_WORKSPACE/out/base_
          EOF
          sed "s|root = .*|root = $GITHUB_WORKSPACE/out/patched_|" lane_result/base.ini > lane_result/patched.ini
          (cd baseline && ./class "$GITHUB_WORKSPACE/lane_result/base.ini") > lane_result/base_stdout.txt 2> lane_result/base_stderr.txt
          (cd patched && ./class "$GITHUB_WORKSPACE/lane_result/patched.ini") > lane_result/patched_stdout.txt 2> lane_result/patched_stderr.txt
          test -s out/base_pk.dat
          test -s out/patched_pk.dat
          python3 - <<'PY'
          import pathlib,json,math
          def read(p):
              r=[]
              for l in pathlib.Path(p).read_text().splitlines():
                  if l.strip() and not l.lstrip().startswith('#'): r.append([float(x) for x in l.split()])
              return r
          a=read('out/base_pk.dat'); b=read('out/patched_pk.dat'); assert a and len(a)==len(b)
          num=den=0.; kg=0.
          for x,y in zip(a,b):
              ka,pa=x[:2]; kb,pb=y[:2]
              assert all(math.isfinite(v) for v in (ka,pa,kb,pb))
              kg=max(kg,abs(ka-kb)/max(abs(ka),abs(kb),1e-300)); num+=(pa-pb)**2; den+=pa**2
          l2=math.sqrt(num/max(den,1e-300))
          checks={'finite_outputs':True,'same_k_grid':kg<=1e-14,'normalized_L2_le_1e_10':l2<=1e-10}
          assert all(checks.values()),(l2,kg)
          pathlib.Path('lane_result/build_regression.json').write_text(json.dumps({'schema':'KMDSB.W03.M13b.K3D2ARecoveredBuildRegression.v0.1','checks':checks,'normalized_L2':l2,'max_k_relative_difference':kg,'rows':len(a),'all_required_checks_pass':all(checks.values())},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-recovered-build
          path: lane_result/
          retention-days: 90

  aggregate:
    name: aggregate recovered K3D2-A PASS
    needs: [source_audit, normalization_audit, build_regression]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with: {name: k3d2a-recovered-source, path: aggregate/source}
      - uses: actions/download-artifact@v4
        with: {name: k3d2a-recovered-normalization, path: aggregate/norm}
      - uses: actions/download-artifact@v4
        with: {name: k3d2a-recovered-build, path: aggregate/build}
      - name: Compose and persist canonical result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          def rd(p): return json.loads(pathlib.Path(p).read_text())
          s=rd('aggregate/source/source_audit.json'); n=rd('aggregate/norm/normalization_audit.json'); b=rd('aggregate/build/build_regression.json')
          assert all(x['all_required_checks_pass'] for x in (s,n,b))
          r={'schema':'KMDSB.W03.M13b.K3D2ClassTwoFieldSpeciesAdapter.v0.1','model_id':'M13b','family_id':'F13','gate':'K3D2-A','provider':'lesgourg/class_public','provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa','protocol':'protocol/W03_M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_PREREGISTRATION_v0.1.md','architecture_amendment':'protocol/W03_M13B_K3D2_PREEXECUTION_ARCHITECTURE_AMENDMENT_v0.1.md','classification':'M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_BUILD_AND_REDUCTION_PASS_WITH_SCOPE','all_required_checks_pass':True,'lanes':{'A_build_regression':b,'B_source_audit':s,'C_normalization_audit':n},'adapter_entrypoint':'verification/m13b/k3d2_apply_class_two_field_adapter_entry.py','first_attempt_run':34783857678,'first_attempt_classification':'IMPLEMENTATION_ANCHOR_ONLY_NO_PHYSICAL_OUTPUT','independent_two_field_realization':['qcf','qpf'],'upstream_scf_role':'protected_regression_control_only','runtime_gauge_scope':'synchronous_only_when_qcf_or_qpf_enabled','published_V0_reproduced':False,'author_normalization_map_claimed':False,'original_provider_reproduced':False,'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False,'actions_run':int(os.environ['GITHUB_RUN_ID']),'next_authorized_gate':'K3D2-B_TWO_FIELD_COSMOLOGY_REGRESSION_PREREGISTRATION'}
          p=pathlib.Path('waves/wave_03_expanded_dark_energy/M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_RESULT.json'); p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add waves/wave_03_expanded_dark_energy/M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_RESULT.json
          git commit -m 'record recovered M13b K3D2-A adapter pass'
          git pull --rebase origin main
          git push origin HEAD:main
