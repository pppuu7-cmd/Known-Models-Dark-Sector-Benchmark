name: W04 M25 corrected CLASS PSD convention bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m25-class-psd-convention-corrected-bridge.yml'

permissions:
  contents: write
  actions: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download immutable upstream M25 provider artifact
        uses: actions/download-artifact@v4
        with:
          name: w04-m25-resonant-sterile-dm-provider-control
          path: m25_upstream
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34544624039
      - name: Pin CLASS and apply previously frozen background capacity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy cython setuptools wheel
          git clone -q https://github.com/lesgourg/class_public.git class_provider
          git -C class_provider checkout -q --detach "$CLASS_PIN"
          test "$(git -C class_provider rev-parse HEAD)" = "$CLASS_PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class_provider/include/common.h')
          s=p.read_text()
          old='#define _QUADRATURE_MAX_BG_ 800'
          new='#define _QUADRATURE_MAX_BG_ 4000'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git -C class_provider diff -- include/common.h | tee m25_corrected_class_patch.diff
          test "$(grep -c '^[-+]#define _QUADRATURE_MAX_BG_' m25_corrected_class_patch.diff)" -eq 2
          python3 -m pip install --disable-pip-version-check --no-input ./class_provider > m25_corrected_class_install.log 2>&1
      - name: Execute frozen source-convention-corrected bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/m25/m25_class_bridge_corrected_convention.py m25_upstream m25_corrected_work m25_corrected_result.json
          cat m25_corrected_result.json
      - name: Persist canonical corrected bridge result
        shell: bash
        run: |
          set -euo pipefail
          cp m25_corrected_result.json /tmp/m25_corrected_result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p models/resonant_sterile_neutrino_wdm waves/wave_04_dark_matter
          cp /tmp/m25_corrected_result.json models/resonant_sterile_neutrino_wdm/M25_CLASS_PSD_CONVENTION_CORRECTED_BRIDGE_RESULT.json
          cp /tmp/m25_corrected_result.json waves/wave_04_dark_matter/M25_CLASS_PSD_CONVENTION_CORRECTED_BRIDGE_RESULT.json
          git add models/resonant_sterile_neutrino_wdm/M25_CLASS_PSD_CONVENTION_CORRECTED_BRIDGE_RESULT.json waves/wave_04_dark_matter/M25_CLASS_PSD_CONVENTION_CORRECTED_BRIDGE_RESULT.json
          git diff --cached --quiet || { git commit -m 'Record corrected M25 CLASS PSD convention bridge'; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Enforce corrected bridge semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math
          r=json.load(open('/tmp/m25_corrected_result.json'))
          allowed={'M25_CLASS_CONVENTION_CORRECTED_BLOCKED','M25_CLASS_CONVENTION_CORRECTED_DENSITY_NOT_VALIDATED','M25_CLASS_CONVENTION_CORRECTED_DENSITY_VALIDATED'}
          assert r['classification'] in allowed
          assert abs(r['analytic_wrong_to_correct_factor']-(2*math.pi)**3/2) < 1e-12
          assert r['K1_promoted'] is False
          assert r['physical_falsification'] is False
          PY
      - name: Upload corrected bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-m25-class-psd-convention-corrected-bridge
          path: |
            m25_corrected_class_patch.diff
            m25_corrected_class_install.log
            m25_corrected_work/
            m25_corrected_result.json
          retention-days: 90
