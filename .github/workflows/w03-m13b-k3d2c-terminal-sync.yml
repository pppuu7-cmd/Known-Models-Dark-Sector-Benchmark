name: W03 M13b K3D2-C terminal ledger sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w03-m13b-k3d2c-terminal-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync F13 canonical ledgers and recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io

          marker = 'M13B_K3D2C_SELF_CONSISTENT_GAUGE_IVP_DEFAULT_B123_PASS_WITH_SCOPE'

          def read_csv(path):
            with open(path, 'r', newline='', encoding='utf-8') as f:
              return list(csv.DictReader(f))

          def write_csv(path, rows):
            fields = list(rows[0].keys())
            with open(path, 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\r\n')
              w.writeheader(); w.writerows(rows)

          census_path = Path('matrices/model_family_census.csv')
          rows = read_csv(census_path)
          for r in rows:
            if r['family_id'] != 'F13':
              continue
            r['status'] = 'K1_BACKGROUND_CROSSING_PASS_K3_PARTIAL_FULL_BOLTZMANN_DEFAULT_B123_PASS_REFERENCE_PRECISION_OPEN_AUTHOR_UNIT_BINDING_BLOCKED'
            if marker not in r['notes']:
              r['notes'] = (r['notes'].rstrip() + ' M13B_K3D2C_SELF_CONSISTENT_GAUGE_IVP_DEFAULT_B123_PASS_WITH_SCOPE_2026_09_14: same-initial-surface independent CLASS default full-Boltzmann B1/B2/B3 PASS after a preregistered pure-undamped 2-iteration Einstein/gauge boundary fixed point (1.3888839265511165e-07 -> 1.037773556487728e-13 at unchanged 1e-12 target). Strict disabled reduction P(k) L2=4.2828210457354356e-16 and H0_rel=0. Historical synchronous-zero B3 gap and one-step blocker remain immutable. K3 stays PARTIAL; reference precision and author normalization/source provenance remain open; K4/K5 are not promoted; physical_falsification=false. Run 34793433652; default artifact 10328826973; verdict artifact 10328861652.').strip()
          write_csv(census_path, rows)

          mandatory_path = Path('matrices/mandatory_properties_matrix.csv')
          rows = read_csv(mandatory_path)
          for r in rows:
            if r['family_id'] != 'F13':
              continue
            r['K3_conservation_gauge_closure'] = 'PARTIAL'
            r['K4_numerical_robustness'] = 'NOT_TESTED'
            r['K5_multichannel_rank'] = 'BLOCKED_BY_K3'
            r['coverage_state'] = 'K0_K1_PASS_K2_PARTIAL_K3_PARTIAL_FULL_BOLTZMANN_DEFAULT_B123_PASS_REFERENCE_PRECISION_OPEN_AUTHOR_UNIT_BINDING_BLOCKED'
            if marker not in r['notes']:
              r['notes'] = (r['notes'].rstrip() + ' M13B_K3D2C_SELF_CONSISTENT_GAUGE_IVP_DEFAULT_B123_PASS_WITH_SCOPE_2026_09_14: frozen same-IVP default full-Boltzmann B1/B2/B3 PASS; pure-undamped boundary fixed point converged in 2 iterations to 1.037773556487728e-13 at 1e-12 target; strict disabled P(k) L2=4.2828210457354356e-16 and H0_rel=0. Reference precision remains open. No K4/K5 promotion. Run 34793433652.').strip()
          write_csv(mandatory_path, rows)

          block = (
            '\n\n## M13b K3D2-C self-consistent gauge-IVP terminal result - 2026-09-14\n\n'
            '- Classification: `M13B_K3D2C_SELF_CONSISTENT_GAUGE_IVP_DEFAULT_B123_PASS_WITH_SCOPE`.\n'
            '- Canonical result: `waves/wave_03_expanded_dark_energy/M13B_K3D2C_SELF_CONSISTENT_GAUGE_IVP_RESULT.json`.\n'
            '- Provider: `lesgourg/class_public@64bbab707faf4de4779a9e04edd180fef18d98fa`.\n'
            '- Run `34793433652`; scientific artifact `10328826973` (`sha256:714380b4da09a3ddaf6f27448f844eec2e1d431422812bf84c2c1f3a5d50dbbc`); verdict artifact `10328861652` (`sha256:46330de20588b92575ba0bcbb11590cf31b5a9848ac625dc77d15e06a1eb483e`).\n'
            '- Source guard PASS; strict disabled null P(k) L2 `4.2828210457354356e-16`, H0 relative difference `0`.\n'
            '- Pure-undamped fixed point: `1.3888839265511165e-07 -> 1.037773556487728e-13` in 2 iterations at unchanged target `1e-12`.\n'
            '- Unchanged default B1/B2/B3 verifier PASS; phantom delta_y ratios `0.99857413408469` (khat=1) and `1.0038143961348418` (khat=10), correct signs.\n'
            '- Historical synchronous-zero B3 FAIL and one-step blocker remain immutable. K3 remains PARTIAL; reference precision remains OPEN; K4/K5 not promoted; author source/normalization reproduction blocked; physical_falsification=false.\n'
          )
          for fn in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
            p = Path(fn)
            if p.exists() and marker not in p.read_text(encoding='utf-8'):
              p.write_text(p.read_text(encoding='utf-8').rstrip() + block + '\n', encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'No ledger changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md
          git commit -m 'sync M13b K3D2-C default B123 pass'
          git push
