name: W03 M13b K3D2-A CLASS qcf+qpf adapter gates

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2a-class-two-field-adapter.yml'
      - 'verification/m13b/k3d2_apply_class_two_field_adapter.py'
      - 'verification/m13b/k3d2_adapter_frozen_constants.json'
      - 'protocol/W03_M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_PREREGISTRATION_v0.1.md'
      - 'protocol/W03_M13B_K3D2_PREEXECUTION_ARCHITECTURE_AMENDMENT_v0.1.md'

permissions:
  contents: write

concurrency:
  group: w03-m13b-k3d2a-${{ github.ref }}
  cancel-in-progress: true

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa

jobs:
  source_audit:
    name: lane-B source/sign/index audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pin and apply deterministic adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile verification/m13b/k3d2_apply_class_two_field_adapter.py
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p lane_result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter.py provider --manifest lane_result/patch_manifest.json
      - name: Frozen source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('provider')
          allowed={
            'include/background.h','source/background.c','source/input.c',
            'include/perturbations.h','source/perturbations.c'
          }
          import subprocess
          changed=set(subprocess.check_output(['git','-C','provider','diff','--name-only'],text=True).split())
          assert changed and changed <= allowed, (changed,allowed)
          m=json.loads(pathlib.Path('lane_result/patch_manifest.json').read_text())
          assert m['upstream_scf_lines_byte_sequence_preserved'] is True
          assert set(m['independent_species'])=={'qcf','qpf'}
          bg=(root/'source/background.c').read_text()
          pt=(root/'source/perturbations.c').read_text()
          ph=(root/'include/perturbations.h').read_text()

          checks={}
          def need(name, cond):
              checks[name]=bool(cond)
              assert cond, name

          need('protected_diff_only_authorized_files', changed <= allowed)
          need('upstream_scf_line_sequence_preserved', m['upstream_scf_lines_byte_sequence_preserved'])
          need('qcf_background_canonical_rho', '(-psi_prime_qpf' not in 'phi_prime_qcf' and '(phi_prime_qcf*phi_prime_qcf/(2*a*a) + V_qcf(pba,phi_qcf))/3.' in bg)
          need('qcf_background_canonical_p', '(phi_prime_qcf*phi_prime_qcf/(2*a*a) - V_qcf(pba,phi_qcf))/3.' in bg)
          need('qpf_background_phantom_rho', '(-psi_prime_qpf*psi_prime_qpf/(2*a*a) + V_qpf(pba,psi_qpf))/3.' in bg)
          need('qpf_background_phantom_p', '(-psi_prime_qpf*psi_prime_qpf/(2*a*a) - V_qpf(pba,psi_qpf))/3.' in bg)
          need('qcf_background_force_sign', '- a*dV_qcf(pba,y[pba->index_bi_phi_qcf])/H' in bg)
          need('qpf_background_force_sign', '+ a*dV_qpf(pba,y[pba->index_bi_psi_qpf])/H' in bg)
          need('qcf_kg_mass_sign', '(k2 + a2*pvecback[pba->index_bg_ddV_qcf])*y[pv->index_pt_phi_qcf]' in pt)
          need('qpf_kg_mass_sign', '(k2 - a2*pvecback[pba->index_bg_ddV_qpf])*y[pv->index_pt_psi_qpf]' in pt)
          need('qcf_positive_momentum_source', 'ppw->rho_plus_p_theta += 1./3.*k*k/a2*ppw->pvecback[pba->index_bg_phi_prime_qcf]*y[ppw->pv->index_pt_phi_qcf];' in pt)
          need('qpf_negative_momentum_source', 'ppw->rho_plus_p_theta -= 1./3.*k*k/a2*ppw->pvecback[pba->index_bg_psi_prime_qpf]*y[ppw->pv->index_pt_psi_qpf];' in pt)
          need('qcf_newtonian_metric_sign', '-pow(ppw->pvecback[pba->index_bg_phi_prime_qcf],2)*psi/a2' in pt)
          need('qpf_newtonian_metric_sign', '+pow(ppw->pvecback[pba->index_bg_psi_prime_qpf],2)*psi/a2' in pt)
          need('distinct_qcf_indices', ph.count('index_pt_phi_qcf')==1 and ph.count('index_pt_phi_prime_qcf')==1)
          need('distinct_qpf_indices', ph.count('index_pt_psi_qpf')==1 and ph.count('index_pt_psi_prime_qpf')==1)
          need('no_qcf_rhop_denominator', '/(pvecback[pba->index_bg_rho_qcf]+pvecback[pba->index_bg_p_qcf])' not in pt)
          need('no_qpf_rhop_denominator', '/(pvecback[pba->index_bg_rho_qpf]+pvecback[pba->index_bg_p_qpf])' not in pt)
          need('no_effective_de_theta_variable', 'theta_DE' not in pt and 'theta_de' not in pt)
          need('synchronous_runtime_guard', 'qcf/qpf adapter is prospectively restricted to synchronous evolution' in pt)

          out={
            'schema':'KMDSB.W03.M13b.K3D2ASourceAudit.v0.1',
            'lane':'B_source_sign_index_audit',
            'provider_commit':m['provider_commit_required'],
            'changed_files':sorted(changed),
            'checks':checks,
            'all_required_checks_pass':all(checks.values()),
          }
          pathlib.Path('lane_result/source_audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-source-audit
          path: lane_result/
          retention-days: 90

  normalization_audit:
    name: lane-C normalization/provenance audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-pin adapter independently
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p lane_result
          python3 verification/m13b/k3d2_apply_class_two_field_adapter.py provider --manifest lane_result/patch_manifest.json
      - name: Frozen normalization and provenance gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,math
          c=json.loads(pathlib.Path('verification/m13b/k3d2_adapter_frozen_constants.json').read_text())
          m=json.loads(pathlib.Path('lane_result/patch_manifest.json').read_text())
          bg=pathlib.Path('provider/source/background.c').read_text()
          inp=pathlib.Path('provider/source/input.c').read_text()
          checks={}
          def need(name,cond):
              checks[name]=bool(cond); assert cond,name
          need('exact_provider_pin',c['provider_commit']==m['provider_commit_required']=='64bbab707faf4de4779a9e04edd180fef18d98fa')
          need('exact_K3C1_U0',math.isclose(c['U0'],0.3362232603714306,rel_tol=0,abs_tol=0) and math.isclose(m['U0'],c['U0'],rel_tol=0,abs_tol=0))
          need('exact_shape_s',c['s']==29.0 and 'tanh(29.*(1.-x))' in bg)
          need('class_normalization_map','return 3.*pba->H0*pba->H0*u0*(th+1.);' in bg and c['normalization_map']=='V_class=3*H0^2*U')
          need('qcf_initial_value',c['qcf']['field_initial_reduced_planck']==0.92 and 'pba->phi_ini_qcf = 0.92;' in inp)
          need('qpf_initial_value',c['qpf']['field_initial_reduced_planck']==1.02 and 'pba->psi_ini_qpf = 1.02;' in inp)
          need('zero_initial_velocities',c['qcf']['field_prime_initial']==0.0 and c['qpf']['field_prime_initial']==0.0 and 'pba->phi_prime_ini_qcf = 0.;' in inp and 'pba->psi_prime_ini_qpf = 0.;' in inp)
          need('adapter_absent_by_default','pba->qcf_U0 = 0.;' in inp and 'pba->qpf_U0 = 0.;' in inp)
          need('public_amplitude_not_reproduced',c['published_V0_reproduced'] is False and m['published_V0_reproduced'] is False)
          need('author_map_not_claimed',c['author_normalization_map_claimed'] is False and m['author_normalization_map_claimed'] is False)
          need('no_promotion_leakage',c['K3_state_ceiling']=='PARTIAL' and not c['K4_promoted'] and not c['K5_promoted'] and not c['physical_falsification'])
          out={
            'schema':'KMDSB.W03.M13b.K3D2ANormalizationAudit.v0.1',
            'lane':'C_normalization_provenance_audit',
            'checks':checks,
            'all_required_checks_pass':all(checks.values()),
            'published_V0_reproduced':False,
            'author_normalization_map_claimed':False,
            'physical_falsification':False,
          }
          pathlib.Path('lane_result/normalization_audit.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-normalization-audit
          path: lane_result/
          retention-days: 90

  build_regression:
    name: lane-A build/null-Pk regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch two independent exact-pin worktrees
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git baseline
          git clone -q https://github.com/lesgourg/class_public.git patched
          git -C baseline checkout -q "$CLASS_PIN"
          git -C patched checkout -q "$CLASS_PIN"
          test "$(git -C baseline rev-parse HEAD)" = "$CLASS_PIN"
          test "$(git -C patched rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p lane_result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter.py patched --manifest lane_result/patch_manifest.json
      - name: Build baseline and patched CLASS independently
        shell: bash
        run: |
          set -euo pipefail
          make -C baseline -j2 class > lane_result/baseline_build.log 2>&1
          make -C patched -j2 class > lane_result/patched_build.log 2>&1
      - name: Run identical frozen LambdaCDM controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/out/base_"
          cat > lane_result/base.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.12
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          overwrite_root = yes
          root = $ROOT
          EOF
          ROOT="$GITHUB_WORKSPACE/out/patched_"
          sed "s|root = .*|root = $ROOT|" lane_result/base.ini > lane_result/patched.ini
          (cd baseline && ./class "$GITHUB_WORKSPACE/lane_result/base.ini") > lane_result/baseline_stdout.txt 2> lane_result/baseline_stderr.txt
          (cd patched && ./class "$GITHUB_WORKSPACE/lane_result/patched.ini") > lane_result/patched_stdout.txt 2> lane_result/patched_stderr.txt
          test -s out/base_pk.dat
          test -s out/patched_pk.dat
      - name: Frozen normalized-L2 regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,pathlib
          def read(path):
              rows=[]
              for line in pathlib.Path(path).read_text().splitlines():
                  if not line.strip() or line.lstrip().startswith('#'): continue
                  vals=[float(x) for x in line.split()]
                  rows.append(vals)
              assert rows
              return rows
          a=read('out/base_pk.dat'); b=read('out/patched_pk.dat')
          assert len(a)==len(b),(len(a),len(b))
          max_k_rel=0.0; num=0.0; den=0.0
          for ra,rb in zip(a,b):
              ka,pa=ra[:2]; kb,pb=rb[:2]
              max_k_rel=max(max_k_rel,abs(ka-kb)/max(abs(ka),abs(kb),1e-300))
              num+=(pa-pb)**2; den+=pa**2
              assert all(math.isfinite(x) for x in (ka,pa,kb,pb))
          l2=math.sqrt(num/max(den,1e-300))
          checks={
            'baseline_pk_finite':True,
            'patched_pk_finite':True,
            'common_grid':max_k_rel<=1e-14,
            'normalized_L2_le_1e_10':l2<=1e-10,
          }
          assert all(checks.values()),(checks,l2,max_k_rel)
          out={
            'schema':'KMDSB.W03.M13b.K3D2ABuildRegression.v0.1',
            'lane':'A_build_null_pk_regression',
            'provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa',
            'baseline_rows':len(a),'patched_rows':len(b),
            'max_k_symmetric_relative_difference':max_k_rel,
            'normalized_L2':l2,
            'frozen_threshold':1e-10,
            'checks':checks,
            'all_required_checks_pass':all(checks.values()),
          }
          pathlib.Path('lane_result/build_regression.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: k3d2a-build-regression
          path: lane_result/
          retention-days: 90

  aggregate:
    name: aggregate frozen K3D2-A result
    needs: [source_audit, normalization_audit, build_regression]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: k3d2a-source-audit
          path: aggregate/source
      - uses: actions/download-artifact@v4
        with:
          name: k3d2a-normalization-audit
          path: aggregate/norm
      - uses: actions/download-artifact@v4
        with:
          name: k3d2a-build-regression
          path: aggregate/build
      - name: Compose canonical result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          def load(p): return json.loads(pathlib.Path(p).read_text())
          s=load('aggregate/source/source_audit.json')
          n=load('aggregate/norm/normalization_audit.json')
          b=load('aggregate/build/build_regression.json')
          passed=all(x['all_required_checks_pass'] for x in (s,n,b))
          assert passed
          result={
            'schema':'KMDSB.W03.M13b.K3D2ClassTwoFieldSpeciesAdapter.v0.1',
            'model_id':'M13b','family_id':'F13','gate':'K3D2-A',
            'protocol':'protocol/W03_M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_PREREGISTRATION_v0.1.md',
            'architecture_amendment':'protocol/W03_M13B_K3D2_PREEXECUTION_ARCHITECTURE_AMENDMENT_v0.1.md',
            'provider':'lesgourg/class_public','provider_commit':'64bbab707faf4de4779a9e04edd180fef18d98fa',
            'classification':'M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_BUILD_AND_REDUCTION_PASS_WITH_SCOPE',
            'all_required_checks_pass':True,
            'lanes':{'A_build_regression':b,'B_source_audit':s,'C_normalization_audit':n},
            'independent_two_field_realization':['qcf','qpf'],
            'upstream_scf_role':'protected_regression_control_only',
            'runtime_gauge_scope':'synchronous_only_when_qcf_or_qpf_enabled',
            'published_V0_reproduced':False,'author_normalization_map_claimed':False,'original_provider_reproduced':False,
            'K3_state_ceiling':'PARTIAL','K4_promoted':False,'K5_promoted':False,'physical_falsification':False,
            'actions_run':int(os.environ['GITHUB_RUN_ID']),
            'next_authorized_gate':'K3D2-B_TWO_FIELD_COSMOLOGY_REGRESSION_PREREGISTRATION',
          }
          out=pathlib.Path('waves/wave_03_expanded_dark_energy/M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_RESULT.json')
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist canonical PASS result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add waves/wave_03_expanded_dark_energy/M13B_K3D2_CLASS_TWO_FIELD_SPECIES_ADAPTER_RESULT.json
          git commit -m 'record M13b K3D2-A CLASS qcf qpf adapter pass'
          git pull --rebase origin main
          git push origin HEAD:main
