name: W03 M08 local step stability audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m08-step-stability.yml'
      - 'code/w03_m08_step_stability.py'

jobs:
  step-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      H1: '0.001'
      H2: '0.0005'
      DIRECTION_REL_MAX: '0.01'
      DIRECTION_ANGLE_MAX_DEG: '0.25'
      SIGMA_RATIO_REL_CHANGE_MAX: '0.05'
      ABSORPTION_RESIDUAL_ABS_CHANGE_MAX: '0.005'
      ABSORPTION_COEFF_REL_CHANGE_MAX: '0.05'
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Fetch and build pinned CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2
      - name: Write matched two-step CPL configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg out logs
          cat > cfg/common.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_Lambda = 0
          fluid_equation_of_state = CLP
          cs2_fld = 1
          use_ppf = yes
          reio_parametrization = reio_none
          output = mPk
          modes = s
          ic = ad
          gauge = synchronous
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          write background = yes
          headers = yes
          format = class
          tol_perturbations_integration = 1e-8
          perturbations_sampling_stepsize = 0.01
          EOF
          make_case () {
            local tag="$1"; local w0="$2"; local wa="$3"
            cp cfg/common.ini cfg/${tag}.ini
            cat >> cfg/${tag}.ini <<EOF
          w0_fld = ${w0}
          wa_fld = ${wa}
          root = ${GITHUB_WORKSPACE}/out/${tag}_
          EOF
          }
          make_case ref -1.0 0.0
          make_case e0p1 -0.999 0.0
          make_case e0m1 -1.001 0.0
          make_case wap1 -1.0 0.001
          make_case wam1 -1.0 -0.001
          make_case e0p2 -0.9995 0.0
          make_case e0m2 -1.0005 0.0
          make_case wap2 -1.0 0.0005
          make_case wam2 -1.0 -0.0005
      - name: Run all two-step cases
        shell: bash
        run: |
          set +e
          for tag in ref e0p1 e0m1 wap1 wam1 e0p2 e0m2 wap2 wam2; do
            ./class_public/class cfg/${tag}.ini > logs/${tag}.log 2>&1
            echo "$?" > logs/${tag}.exit
          done
          exit 0
      - name: Analyze step stability
        shell: bash
        run: |
          set -euo pipefail
          for tag in ref e0p1 e0m1 wap1 wam1 e0p2 e0m2 wap2 wam2; do test "$(cat logs/${tag}.exit)" = "0"; done
          python3 code/w03_m08_step_stability.py \
            --directory out --h1 "$H1" --h2 "$H2" \
            --m07 waves/wave_03_expanded_dark_energy/M07_LOCAL_Q_DIRECTION.json \
            --json m08_step_stability.json
      - name: Enforce preregistered stability gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$DIRECTION_REL_MAX" "$DIRECTION_ANGLE_MAX_DEG" "$SIGMA_RATIO_REL_CHANGE_MAX" "$ABSORPTION_RESIDUAL_ABS_CHANGE_MAX" "$ABSORPTION_COEFF_REL_CHANGE_MAX" <<'PY'
          import json,sys
          rmax,amax,smax,xmax,cmax=map(float,sys.argv[1:])
          d=json.load(open('m08_step_stability.json'))
          for key in ('epsilon0_combined','wa_combined'):
              m=d['direction_stability'][key]
              print(key,m)
              if m['relative_l2_difference']>rmax: raise SystemExit(f'{key} rel gate fail')
              if m['angle_deg']>amax: raise SystemExit(f'{key} angle gate fail')
          if d['basis']['sigma_ratio_relative_change']>smax: raise SystemExit('sigma ratio stability fail')
          if d['m07_absorption']['combined_residual_absolute_change']>xmax: raise SystemExit('M07 absorption residual stability fail')
          if d['m07_absorption']['coefficient_relative_change']>cmax: raise SystemExit('M07 absorption coefficient stability fail')
          print('M08_STEP_STABILITY=PASS')
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo "H1=${H1}"
            echo "H2=${H2}"
            echo "DIRECTION_REL_MAX=${DIRECTION_REL_MAX}"
            echo "DIRECTION_ANGLE_MAX_DEG=${DIRECTION_ANGLE_MAX_DEG}"
            echo "SIGMA_RATIO_REL_CHANGE_MAX=${SIGMA_RATIO_REL_CHANGE_MAX}"
            echo "ABSORPTION_RESIDUAL_ABS_CHANGE_MAX=${ABSORPTION_RESIDUAL_ABS_CHANGE_MAX}"
            echo "ABSORPTION_COEFF_REL_CHANGE_MAX=${ABSORPTION_COEFF_REL_CHANGE_MAX}"
          } > m08_step_stability_provenance.txt
      - name: Upload immutable step stability bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m08-step-stability
          path: |
            m08_step_stability.json
            m08_step_stability_provenance.txt
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
