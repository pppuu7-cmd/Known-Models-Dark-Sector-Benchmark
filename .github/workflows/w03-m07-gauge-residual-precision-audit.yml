name: W03 M07 gauge residual precision convergence audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w03-m07-gauge-residual-precision-audit.yml'
      - 'code/w03_m07_gauge_bookkeeping_audit.py'

jobs:
  gauge-residual-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMEGA_SCF_TARGET: '0.682686955086854'
      SHOOT_REL_TOL: '1.0e-13'
      RAW_GAUGE_REL_MAX: '1.0e-4'
      REQUIRED_RESIDUAL_IMPROVEMENT_FACTOR: '0.50'
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Fetch and build pinned official CLASS
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/lesgourg/class_public.git class_public
          cd class_public
          git checkout e85808324f51fc694d12e3ed7439552a3c3f9540
          test "$(git rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
          make -j2
      - name: Write baseline and tight paired-gauge configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cfg logs out_baseline_sync out_baseline_newt out_tight_sync out_tight_newt
          Aseed=$(python3 -c 'import math; Om=0.682686955086854; h=.67; H0=100*h/299792.458; lam=.075; phi=1.; print(f"{3*Om*H0*H0*math.exp(lam*phi)-1:.17g}")')
          for tier in baseline tight; do
            if [ "$tier" = baseline ]; then ptol=1.0e-8; pstep=0.01; else ptol=1.0e-10; pstep=0.002; fi
            for gauge in sync newt; do
              if [ "$gauge" = sync ]; then g=synchronous; else g=newtonian; fi
              out="out_${tier}_${gauge}"
              cat > cfg/${tier}_${gauge}_common.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.1200
          Omega_k = 0
          Omega_fld = 0
          reio_parametrization = reio_none
          output = mPk,mTk
          modes = s
          ic = ad
          gauge = ${g}
          non linear = none
          z_pk = 0.295,0.51,0.706,0.934,1.317,1.491,2.33
          P_k_max_h/Mpc = 0.2
          headers = yes
          format = class
          tol_shooting_deltax_rel = ${SHOOT_REL_TOL}
          tol_perturbations_integration = ${ptol}
          perturbations_sampling_stepsize = ${pstep}
          matter_source_in_current_gauge = no
          get_perturbations_in_current_gauge = no
          EOF
              cp cfg/${tier}_${gauge}_common.ini cfg/${tier}_${gauge}_ref.ini
              cat >> cfg/${tier}_${gauge}_ref.ini <<EOF
          Omega_scf = 0
          root = ${GITHUB_WORKSPACE}/${out}/ref_
          EOF
              cp cfg/${tier}_${gauge}_common.ini cfg/${tier}_${gauge}_m07.ini
              cat >> cfg/${tier}_${gauge}_m07.ini <<EOF
          Omega_scf = ${OMEGA_SCF_TARGET}
          scf_parameters = 0.075,0.0,${Aseed},0.0,1.0,0.0
          attractor_ic_scf = no
          scf_tuning_index = 2
          root = ${GITHUB_WORKSPACE}/${out}/m07_
          EOF
            done
          done
      - name: Run all precision/gauge cases
        shell: bash
        run: |
          set +e
          for tier in baseline tight; do
            for gauge in sync newt; do
              for case in ref m07; do
                ./class_public/class cfg/${tier}_${gauge}_${case}.ini > logs/${tier}_${gauge}_${case}.log 2>&1
                echo "$?" > logs/${tier}_${gauge}_${case}.exit
              done
            done
          done
          exit 0
      - name: Analyze baseline and tight gauge residuals
        shell: bash
        run: |
          set -euo pipefail
          python3 code/w03_m07_gauge_bookkeeping_audit.py --sync out_baseline_sync --newt out_baseline_newt --json baseline_gauge_result.json
          python3 code/w03_m07_gauge_bookkeeping_audit.py --sync out_tight_sync --newt out_tight_newt --json tight_gauge_result.json
          python3 - <<'PY'
          import json
          b=json.load(open('baseline_gauge_result.json'))
          t=json.load(open('tight_gauge_result.json'))
          rb=b['comparisons']['response_lnP']
          rt=t['comparisons']['response_lnP']
          out={
            'schema':'KMDSB-W03-M07-gauge-residual-precision-v0.1',
            'baseline':rb,
            'tight':rt,
            'baseline_common_mode':b.get('gauge_error_common_mode'),
            'tight_common_mode':t.get('gauge_error_common_mode'),
            'l2_relative_improvement_ratio':rt['l2_relative_difference']/rb['l2_relative_difference'],
            'absolute_mismatch_improvement_ratio':rt['l2_absolute_difference']/rb['l2_absolute_difference']
          }
          open('gauge_residual_precision_result.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Enforce preregistered convergence gate
        shell: bash
        run: |
          set -euo pipefail
          for tier in baseline tight; do for gauge in sync newt; do for case in ref m07; do test "$(cat logs/${tier}_${gauge}_${case}.exit)" = "0"; done; done; done
          python3 - "$RAW_GAUGE_REL_MAX" "$REQUIRED_RESIDUAL_IMPROVEMENT_FACTOR" <<'PY'
          import json,sys
          rawmax,fac=map(float,sys.argv[1:])
          t=json.load(open('tight_gauge_result.json'))['comparisons']
          for key in ('ref_P','m07_P','ref_d_m','m07_d_m','ref_phi','m07_phi','ref_psi','m07_psi'):
              x=t[key]['max_symmetric_relative_difference']
              print(key,x)
              if x>rawmax: raise SystemExit(f'{key} raw gauge gate {x}>{rawmax}')
          q=json.load(open('gauge_residual_precision_result.json'))
          ratio=q['l2_relative_improvement_ratio']
          print('residual l2-relative improvement ratio=',ratio)
          if ratio>fac: raise SystemExit(f'residual mismatch failed to improve by required factor: {ratio}>{fac}')
          print('M07_GAUGE_RESIDUAL_PRECISION_CONVERGENCE=PASS')
          PY
      - name: Record provenance
        if: always()
        run: |
          {
            echo "KMDSB_HEAD=$(git rev-parse HEAD)"
            echo "CLASS_HEAD=$(git -C class_public rev-parse HEAD)"
            echo 'lambda=0.075'
            echo 'baseline_tol_perturbations_integration=1e-8'
            echo 'baseline_perturbations_sampling_stepsize=0.01'
            echo 'tight_tol_perturbations_integration=1e-10'
            echo 'tight_perturbations_sampling_stepsize=0.002'
            echo "REQUIRED_RESIDUAL_IMPROVEMENT_FACTOR=${REQUIRED_RESIDUAL_IMPROVEMENT_FACTOR}"
          } > gauge_residual_precision_provenance.txt
      - name: Upload immutable precision bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-m07-gauge-residual-precision-audit
          path: |
            baseline_gauge_result.json
            tight_gauge_result.json
            gauge_residual_precision_result.json
            gauge_residual_precision_provenance.txt
            cfg/
            logs/
          if-no-files-found: error
          retention-days: 90
