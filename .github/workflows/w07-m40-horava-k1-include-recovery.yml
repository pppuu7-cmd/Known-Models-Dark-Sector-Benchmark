name: W07 M40 Horava K1 include recovery

on:
  push:
    paths:
      - '.github/workflows/w07-m40-horava-k1-include-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EFTCAMB_PIN: '16d9c4e9f85751e30efd0a53b177941713078904'

jobs:
  recover-k1:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install and build exact pinned EFTCAMB
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libblas-dev liblapack-dev python3-numpy >/dev/null
          git clone -q https://github.com/EFTCAMB/EFTCAMB.git provider
          git -C provider checkout -q --detach "$EFTCAMB_PIN"
          git -C provider submodule update --init --recursive
          test "$(git -C provider rev-parse HEAD)" = "$EFTCAMB_PIN"
          (cd provider/fortran && make clean >/dev/null 2>&1 || true; make camb >/dev/null)
          git -C provider rev-parse HEAD > provider_commit.txt
      - name: Freeze original preregistered ladder with corrected linked include
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40recovery"; mkdir -p "$BASE"
          python3 - "$BASE" <<'PY'
          import pathlib,re,sys
          b=pathlib.Path(sys.argv[1]); p=pathlib.Path('provider/fortran/eftcamb_test/parameters').resolve()
          src=(p/'5_Horava_eta_3.ini').read_text(); gr=(p/'1_EFT_GR.ini').read_text()
          include=str((p/'base_params.ini').resolve())
          base=(-0.001,0.001,0.021)
          def pin_include(t):
              return re.sub(r'(?m)^\s*DEFAULT\(base_params\.ini\)\s*$', f'DEFAULT({include})', t)
          for label,s in [('ref',0.0),('s1',1.0),('s01',0.1),('s001',0.01),('s0001',0.001)]:
              t=pin_include(src)
              for key,val in zip(('Horava_xi','Horava_lambda','Horava_eta'),base):
                  t=re.sub(rf'(?m)^\s*{key}\s*=.*$', f'{key} = {val*s:.16g}', t)
              t=re.sub(r'(?m)^\s*output_root\s*=.*$', f'output_root = {b}/{label}_', t)
              (b/f'{label}.ini').write_text(t)
          gr=pin_include(gr)
          gr=re.sub(r'(?m)^\s*output_root\s*=.*$', f'output_root = {b}/gr_', gr)
          (b/'gr.ini').write_text(gr)
          (b/'HARNESS_RECOVERY.txt').write_text('Only DEFAULT(base_params.ini) was rewritten to the exact absolute pinned-provider include path. Frozen Hořava coefficients and scaling ladder are unchanged.\n')
          PY
          grep -H -E '^(Horava_xi|Horava_lambda|Horava_eta|output_root|DEFAULT)' "$BASE"/*.ini | tee "$BASE/frozen_config_extract.txt"
      - name: Execute reference, ladder, and explicit GR control
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40recovery"
          set +e
          for label in ref s1 s01 s001 s0001 gr; do
            (cd provider/fortran && ./camb "$BASE/${label}.ini" > "$BASE/${label}.stdout" 2> "$BASE/${label}.stderr")
            echo $? > "$BASE/${label}.exit"
          done
          set -e
      - name: Analyze unchanged K1 scientific rule after harness recovery
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/m40recovery"
          python3 - "$BASE" <<'PY'
          import json,pathlib,sys
          b=pathlib.Path(sys.argv[1]); arms=[]
          for label,x in [('s1',1.0),('s01',0.1),('s001',0.01),('s0001',0.001)]:
              arms.append({'label':label,'x':x,'cl':str(b/f'{label}_scalCls.dat'),'pk':str(b/f'{label}_matterpower.dat'),'exit':int((b/f'{label}.exit').read_text())})
          pathlib.Path('m40_arms.json').write_text(json.dumps(arms))
          PY
          python3 verification/k1/decoupling_ladder.py \
            --model M40 --provider-commit "$(cat provider_commit.txt)" --expected-commit "$EFTCAMB_PIN" \
            --reference-cl "$BASE/ref_scalCls.dat" --reference-pk "$BASE/ref_matterpower.dat" \
            --arms-json m40_arms.json --out M40_K1_INCLUDE_RECOVERY_RESULT.json \
            --scope 'pinned EFTCAMB native Hořava mapping; original preregistered joint xi/lambda/eta scaling; include-path harness recovery only; explicit EFT-GR endpoint control'
          python3 - "$BASE" <<'PY'
          import json,pathlib,sys,numpy as np
          b=pathlib.Path(sys.argv[1]); p=pathlib.Path('M40_K1_INCLUDE_RECOVERY_RESULT.json'); r=json.loads(p.read_text())
          r['source_blocked_run']=34656276938; r['source_blocked_artifact']=10286391289
          r['harness_recovery']='DEFAULT(base_params.ini) rewritten to exact absolute pinned-provider path only'
          exits={x:int((b/f'{x}.exit').read_text()) for x in ['ref','s1','s01','s001','s0001','gr']}; r['exits']=exits
          def tab(path):
              rows=[]
              for line in pathlib.Path(path).read_text(errors='replace').splitlines():
                  s=line.strip()
                  if not s or s.startswith('#'): continue
                  try: rows.append([float(x) for x in s.split()])
                  except ValueError: pass
              a=np.asarray(rows,float)
              if a.ndim!=2 or a.shape[0]<5 or a.shape[1]<2 or not np.isfinite(a).all(): raise RuntimeError(f'bad table {path}')
              return a
          def dist(a,c):
              lo=max(a[:,0].min(),c[:,0].min()); hi=min(a[:,0].max(),c[:,0].max()); aa=a[(a[:,0]>=lo)&(a[:,0]<=hi)]
              x=aa[:,0]; y=aa[:,1]; z=np.interp(x,c[:,0],c[:,1]); sc=np.maximum(np.maximum(abs(y),abs(z)),1e-30)
              return float(np.sqrt(np.mean(((y-z)/sc)**2)))
          try:
              if exits['ref']!=0 or exits['gr']!=0: raise RuntimeError('nonzero native-zero or GR exit')
              tt=dist(tab(b/'ref_scalCls.dat'),tab(b/'gr_scalCls.dat')); pk=dist(tab(b/'ref_matterpower.dat'),tab(b/'gr_matterpower.dat')); D=max(tt,pk)
              endpoint={'tt_normalized_l2':tt,'pk_normalized_l2':pk,'D':D,'threshold':1e-4,'pass':D<=1e-4}
              r['native_zero_vs_explicit_GR']=endpoint
              if r.get('K1_scoped_pass') and endpoint['pass']:
                  r['classification']='M40_K1_PASS_WITH_SCOPE_AFTER_INCLUDE_PATH_RECOVERY'; r['K1']='PASS_WITH_SCOPE'
              else:
                  r['K1_scoped_pass']=False; r['K1']='PARTIAL'; r['classification']='M40_K1_NOT_ESTABLISHED_REFERENCE_LIMIT_OR_ENDPOINT_IDENTITY'
          except Exception as e:
              r['K1_scoped_pass']=False; r['K1']='BLOCKED_IMPLEMENTATION'; r['classification']='M40_K1_BLOCKED_AFTER_INCLUDE_PATH_RECOVERY'; r['endpoint_error']=repr(e)
          r['physical_falsification']=False; r['K2_K9']='OPEN'
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(p.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m40-k1-include-recovery
          path: |
            M40_K1_INCLUDE_RECOVERY_RESULT.json
            m40_arms.json
            provider_commit.txt
            m40recovery/
