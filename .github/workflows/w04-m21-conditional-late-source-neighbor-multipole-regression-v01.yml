name: W04 M21 conditional late-source neighbor-multipole regression v0.1
on:
  workflow_run:
    workflows: ['W04 M21 l400 conditional flat-identity predicate counterfactual v0.1']
    types: [completed]
permissions: {actions: read, contents: read}
env: {CLEAN_RECOVERY_RUN: '34907528331'}
jobs:
  route:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    outputs: {active: '${{ steps.r.outputs.active }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m21-l400-flat-identity-predicate-counterfactual-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: r
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('parent/M21_L400_FLAT_IDENTITY_PREDICATE_COUNTERFACTUAL_RESULT.json'))
          a=d.get('classification')=='M21_L400_FLAT_IDENTITY_PREDICATE_BRANCH_CAUSAL_WITH_SCOPE'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+('true' if a else 'false')+'\n')
          PY
  case:
    needs: route
    if: needs.route.outputs.active == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {case_id: [ref, f2, f3, f4], lane_id: [native, flat_identity_predicate]}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m21-l400-conv-case-${{ matrix.case_id }}-v01
          path: clean
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ env.CLEAN_RECOVERY_RUN }}
      - id: x
        continue-on-error: true
        run: bash verification/m21/run_late_source_neighbor_multipole_case_v01.sh '${{ matrix.case_id }}' '${{ matrix.lane_id }}' clean
      - if: always()
        env: {CASE: '${{ matrix.case_id }}', LANE: '${{ matrix.lane_id }}', OUT: '${{ steps.x.outcome }}'}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('case_meta.json')
          if not p.exists():p.write_text(json.dumps({'case':os.environ['CASE'],'lane':os.environ['LANE'],'authority_clean':False,'execution_outcome':os.environ['OUT']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-neighbor-${{ matrix.case_id }}-${{ matrix.lane_id }}-v01
          path: |
            case_meta.json
            neighbor_${{ matrix.case_id }}_${{ matrix.lane_id }}.dat
            neighbor_patch_manifest.json
            neighbor_profile_manifest.json
            output/*_cl.dat
          retention-days: 90
  aggregate:
    needs: [route,case]
    if: ${{ always() && needs.route.outputs.active == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'm21-neighbor-*-v01', path: components}
      - uses: actions/download-artifact@v4
        with:
          name: m21-l400-flat-identity-predicate-counterfactual-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: a
        continue-on-error: true
        run: python3 verification/m21/late_source_neighbor_multipole_regression.py components parent/M21_L400_FLAT_IDENTITY_PREDICATE_COUNTERFACTUAL_RESULT.json M21_LATE_SOURCE_NEIGHBOR_MULTIPOLE_REGRESSION_RESULT.json
      - if: always()
        env: {OUT: '${{ steps.a.outcome }}'}
        run: |
          if [ ! -f M21_LATE_SOURCE_NEIGHBOR_MULTIPOLE_REGRESSION_RESULT.json ]; then python3 -c "import json,os;open('M21_LATE_SOURCE_NEIGHBOR_MULTIPOLE_REGRESSION_RESULT.json','w').write(json.dumps({'classification':'M21_LATE_SOURCE_NEIGHBOR_MULTIPOLE_REGRESSION_BLOCKED','analysis_outcome':os.environ['OUT']},indent=2)+'\\n')"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: m21-late-source-neighbor-multipole-regression-v01, path: M21_LATE_SOURCE_NEIGHBOR_MULTIPOLE_REGRESSION_RESULT.json, retention-days: 90}
