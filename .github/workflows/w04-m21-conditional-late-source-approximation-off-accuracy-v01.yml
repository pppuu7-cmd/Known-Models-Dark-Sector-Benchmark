name: W04 M21 conditional late-source approximation-off accuracy v0.1
on:
  workflow_run:
    workflows: ['W04 M21 late-source cross-cosmology provider regression v0.1']
    types: [completed]
permissions: {actions: read, contents: read}
jobs:
  route:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    outputs: {active: '${{ steps.r.outputs.active }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m21-late-source-cross-cosmology-provider-regression-v01
          path: parent_agg
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: r
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('parent_agg/M21_LATE_SOURCE_CROSS_COSMOLOGY_PROVIDER_REGRESSION_RESULT.json'))
          allowed={'M21_LATE_SOURCE_THRESHOLD_MECHANISM_GENERALIZES_WITH_BOUNDARY_CROSSINGS_WITH_SCOPE','M21_LATE_SOURCE_THRESHOLD_MECHANISM_GENERALIZES_STRUCTURALLY_WITH_SCOPE'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+('true' if d.get('classification') in allowed else 'false')+'\n')
          PY
  case:
    needs: route
    if: needs.route.outputs.active == 'true'
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        provider_label: [P0, P1]
        cosmology_id: [base, h95, h105, ob95, ob105, odm95, odm105]
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m21-cross-${{ matrix.provider_label }}-${{ matrix.cosmology_id }}-v01
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: x
        continue-on-error: true
        run: bash verification/m21/run_late_source_approximation_off_case_v01.sh '${{ matrix.provider_label }}' '${{ matrix.cosmology_id }}' parent
      - if: always()
        env: {P: '${{ matrix.provider_label }}', C: '${{ matrix.cosmology_id }}', OUT: '${{ steps.x.outcome }}'}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('case_meta.json')
          if not p.exists():p.write_text(json.dumps({'provider_label':os.environ['P'],'cosmology_id':os.environ['C'],'authority_clean':False,'execution_outcome':os.environ['OUT']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-approx-off-${{ matrix.provider_label }}-${{ matrix.cosmology_id }}-v01
          path: |
            case_meta.json
            off.dat
            off.ini
            off.pre
            off_patch_manifest.json
            off_output/*_cl.dat
            run_off.log
            build.log
          if-no-files-found: warn
          retention-days: 90
      - if: always()
        run: "python3 -c \"import json;assert json.load(open('case_meta.json')).get('authority_clean') is True\""
  aggregate:
    needs: [route,case]
    if: ${{ always() && needs.route.outputs.active == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'm21-approx-off-*-v01', path: off_components}
      - uses: actions/download-artifact@v4
        with:
          pattern: m21-cross-*-v01
          path: parent_components
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v4
        with:
          name: m21-late-source-cross-cosmology-provider-regression-v01
          path: parent_agg
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: ${{ github.event.workflow_run.id }}
      - id: a
        continue-on-error: true
        run: python3 verification/m21/late_source_approximation_off_accuracy_reference.py off_components parent_components parent_agg/M21_LATE_SOURCE_CROSS_COSMOLOGY_PROVIDER_REGRESSION_RESULT.json M21_LATE_SOURCE_APPROXIMATION_OFF_ACCURACY_REFERENCE_RESULT.json
      - if: always()
        env: {OUT: '${{ steps.a.outcome }}'}
        run: |
          if [ ! -f M21_LATE_SOURCE_APPROXIMATION_OFF_ACCURACY_REFERENCE_RESULT.json ]; then python3 -c "import json,os;open('M21_LATE_SOURCE_APPROXIMATION_OFF_ACCURACY_REFERENCE_RESULT.json','w').write(json.dumps({'classification':'M21_LATE_SOURCE_APPROXIMATION_OFF_ACCURACY_REFERENCE_BLOCKED','analysis_outcome':os.environ['OUT']},indent=2)+'\\n')"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: m21-late-source-approximation-off-accuracy-reference-v01, path: M21_LATE_SOURCE_APPROXIMATION_OFF_ACCURACY_REFERENCE_RESULT.json, retention-days: 90}
