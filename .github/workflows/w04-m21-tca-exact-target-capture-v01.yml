name: W04 M21 TCA exact-target capture v0.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m21-tca-exact-target-capture-v01.yml']
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  lane:
    strategy:
      fail-fast: false
      matrix: {case: [ref, f2, f3, f4]}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user numpy
      - uses: actions/download-artifact@v4
        with: {name: 'm21-l400-conv-case-${{ matrix.case }}-v01', path: component, github-token: '${{ github.token }}', repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark, run-id: 34907528331}
      - name: Exact-target provider TCA capture
        env: {CASE: '${{ matrix.case }}', OMP_NUM_THREADS: '1'}
        run: |
          set -euo pipefail
          PIN=e85808324f51fc694d12e3ed7439552a3c3f9540
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$PIN"
          test "$(git -C class rev-parse HEAD)" = "$PIN"
          python3 verification/m21/mixed_cold_warm_k1_reference.py prepare m21_cases
          python3 verification/m21/build_l_grid_phase_profile.py P400_ON_TAIL_OFF class/cl_permille.pre verification/m21/m21_ncdm_tight.pre l400_diag.pre profile_manifest.json
          python3 - <<'PY'
          import os,pathlib
          c=os.environ['CASE']; fs=list(pathlib.Path('component').rglob(f'conv_{c}.dat')); assert len(fs)==1
          rows=[]
          for raw in fs[0].read_text().splitlines():
            z=raw.split()
            if len(z)==12:
              q=int(round(float(z[0])))
              if 261<=q<=333: rows.append((q,int(z[2]),float(z[3]),float(z[1])))
          assert rows and len({q for q,_,_,_ in rows})==73
          arr=',\n'.join('{%d,%d,%.17g,%.17g}'%r for r in rows)
          p=pathlib.Path('class/source/perturbations.c'); s=p.read_text(); marker='int perturbations_init('; assert s.count(marker)==1
          helper='''static int kmdsb_tca_exact_target_probe(struct precision *ppr, struct background *pba, struct thermodynamics *pth, struct perturbations *ppt, int index_md, struct perturbations_workspace *pw) {\n  struct {int q; int j; double tau; double k;} km_targets[] = {\n'''+arr+'''\n  };\n  int km_i;\n  for (km_i=0; km_i<(int)(sizeof(km_targets)/sizeof(km_targets[0])); km_i++) {\n    class_call(perturbations_approximations(ppr,pba,pth,ppt,index_md,km_targets[km_i].k,km_targets[km_i].tau,pw),ppt->error_message,ppt->error_message);\n    fprintf(stderr,"KMDSB_TCA_TARGET q=%d j=%d tau=%.17g k=%.17g tca=%d\\n",km_targets[km_i].q,km_targets[km_i].j,km_targets[km_i].tau,km_targets[km_i].k,pw->approx[pw->index_ap_tca]);\n  }\n  return _SUCCESS_;\n}\n\n'''
          s=s.replace(marker,helper+marker)
          needle='''          class_call(perturbations_solve(ppr,\n                                         pba,\n                                         pth,\n                                         ppt,\n                                         index_md,\n                                         index_ic,\n                                         index_k,\n                                         &pw),\n                     ppt->error_message,\n                     ppt->error_message);'''; assert s.count(needle)==1
          probe=needle+'''\n          if ((index_ic == 0) && (index_k == 0) && (index_md == ppt->index_md_scalars)) {\n            class_call(kmdsb_tca_exact_target_probe(ppr,pba,pth,ppt,index_md,&pw),ppt->error_message,ppt->error_message);\n          }'''
          p.write_text(s.replace(needle,probe))
          PY
          make -C class -j2 >/dev/null
          mkdir -p output
          rc=0
          timeout 2700 ./class/class "m21_cases/${CASE}.ini" l400_diag.pre > "stdout_${CASE}.log" 2> "target_${CASE}.log" || rc=$?
          python3 - "$rc" <<'PY'
          import json,os,pathlib,re,sys
          c=os.environ['CASE']; rc=int(sys.argv[1]); text=pathlib.Path(f'target_{c}.log').read_text(errors='replace')
          pat=re.compile(r'^KMDSB_TCA_TARGET q=(\d+) j=(\d+) tau=([^ ]+) k=([^ ]+) tca=([+-]?\d+)\s*$',re.M)
          done=pat.findall(text); qs={int(x[0]) for x in done}
          pathlib.Path(f'tca_exact_{c}.tsv').write_text('q\tj\ttau\tk\ttca\n'+''.join('\t'.join(x)+'\n' for x in done))
          data_complete=(bool(done) and qs==set(range(261,334)))
          runtime_clean=(rc==0)
          ok=(data_complete and runtime_clean)
          nonprobe=[ln for ln in text.splitlines() if not ln.startswith('KMDSB_TCA_TARGET ')]
          meta={'schema':'KMDSB.W04.M21.TCAExactTargetCapture.v0.1','case':c,'provider_commit':'e85808324f51fc694d12e3ed7439552a3c3f9540','class_exit_code':rc,'rows':len(done),'q_count':len(qs),'q_min':min(qs) if qs else None,'q_max':max(qs) if qs else None,'data_complete':data_complete,'runtime_clean':runtime_clean,'capture_complete':ok,'nonprobe_stderr_tail':'\n'.join(nonprobe[-120:]),'scientific_classifier_executed':False,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          pathlib.Path(f'tca_exact_{c}.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'm21-tca-exact-target-${{ matrix.case }}-v01'
          path: |
            tca_exact_${{ matrix.case }}.*
            target_${{ matrix.case }}.log
            stdout_${{ matrix.case }}.log
          retention-days: 90
          if-no-files-found: warn
  barrier:
    needs: lane
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'm21-tca-exact-target-*-v01', path: lanes}
      - run: |
          python3 - <<'PY'
          import json,pathlib
          ds={d['case']:d for p in pathlib.Path('lanes').rglob('tca_exact_*.json') for d in [json.load(open(p))]}
          complete=(set(ds)=={'ref','f2','f3','f4'} and all(d.get('capture_complete') for d in ds.values()))
          out={'schema':'KMDSB.W04.M21.TCAExactTargetCaptureBarrier.v0.1','classification':'M21_TCA_EXACT_TARGET_CAPTURE_PASS' if complete else 'M21_TCA_EXACT_TARGET_CAPTURE_TECHNICAL_INCOMPLETE','lanes':ds,'scientific_classifier_executed':False,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          pathlib.Path('M21_TCA_EXACT_TARGET_CAPTURE_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not complete: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: m21-tca-exact-target-capture-v01, path: M21_TCA_EXACT_TARGET_CAPTURE_RESULT.json, retention-days: 90, if-no-files-found: warn}
