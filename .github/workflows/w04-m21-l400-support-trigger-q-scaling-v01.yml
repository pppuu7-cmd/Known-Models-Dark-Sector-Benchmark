name: W04 M21 l400 support trigger q scaling v0.1
on:
  push:
    paths:
      - '.github/workflows/w04-m21-l400-support-trigger-q-scaling-v01.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable topology parent
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-native-grid-topology-v01
          path: topology
          github-token: ${{ github.token }}
          run-id: 34972611076
      - name: Download immutable support-domain parent
        uses: actions/download-artifact@v4
        with:
          name: m21-l400-support-domain-decomposition-v01
          path: support
          github-token: ${{ github.token }}
          run-id: 34978980507
      - name: Frozen authority barrier
        run: |
          python3 - <<'PY'
          import json,glob
          t=json.load(open(glob.glob('topology/*.json')[0])); s=json.load(open(glob.glob('support/*.json')[0]))
          assert t['classification']=='M21_L400_F3_NATIVE_GRID_SUPPORT_AND_DENSITY_CHANGE_WITH_SCOPE'
          assert s['classification']=='M21_L400_F3_EXTENDED_SUPPORT_AMPLITUDE_SUFFICIENT_WITH_SCOPE'
          assert s['R_cf'] <= 0.5
          PY
      - name: Run frozen q-scaling analyzer
        run: |
          python3 verification/m21/l400_support_trigger_q_scaling.py \
            "$(find topology -name '*.json' | head -1)" \
            "$(find support -name '*.json' | head -1)" \
            M21_L400_SUPPORT_TRIGGER_Q_SCALING_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: m21-l400-support-trigger-q-scaling-v01
          path: M21_L400_SUPPORT_TRIGGER_Q_SCALING_RESULT.json
          if-no-files-found: error