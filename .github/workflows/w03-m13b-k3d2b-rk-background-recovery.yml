name: W03 M13b K3D2-B RK background recovery audit

on:
  push:
    paths:
      - '.github/workflows/w03-m13b-k3d2b-rk-background-recovery.yml'

env:
  CLASS_PIN: 64bbab707faf4de4779a9e04edd180fef18d98fa

permissions:
  contents: write

jobs:
  enabled_background:
    name: R1 enabled hard-handoff background with RK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-pin recovered adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run background-only frozen realization with CLASS RK
        shell: bash
        run: |
          set -euo pipefail
          cat > result/enabled_rk.ini <<EOF
          h = 0.6715
          omega_b = 0.0224
          Omega_cdm = 0.26172292868512664
          Omega_g = 5.4572897176151613e-05
          Omega_ur = 3.772710282384838e-05
          N_ncdm = 0
          Omega_Lambda = 0
          Omega_fld = 0
          Omega_scf = 0
          Omega_k = 0
          qcf_U0 = 0.3362232603714306
          qcf_phi_ini = 0.92
          qcf_phi_prime_ini = 0
          qpf_U0 = 0.3362232603714306
          qpf_psi_ini = 1.02
          qpf_psi_prime_ini = 0
          background_evolver = 0
          gauge = synchronous
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          write_background = yes
          root = $GITHUB_WORKSPACE/out/rk_
          EOF
          set +e
          (cd provider && ./class "$GITHUB_WORKSPACE/result/enabled_rk.ini") > result/stdout.txt 2> result/stderr.txt
          rc=$?
          set -e
          echo "$rc" > result/provider_rc.txt
          find out -maxdepth 1 -type f -printf '%f\n' | sort > result/output_files.txt
          if [ "$rc" -ne 0 ]; then echo STDERR; cat result/stderr.txt; echo STDOUT; cat result/stdout.txt; exit "$rc"; fi
      - name: Evaluate unchanged frozen B1 gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,math,os
          files=sorted(Path('out').glob('rk*_background.dat')); assert len(files)==1,files
          p=files[0]; lines=p.read_text().splitlines()
          hs=[l for l in lines if l.lstrip().startswith('#') and 'phi_qcf' in l and 'psi_qpf' in l]; assert len(hs)==1,hs
          t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}
          need=['z','H [1/Mpc]','phi_qcf',"phi'_qcf",'psi_qpf',"psi'_qpf",'(.)rho_qcf','(.)rho_qpf']; assert all(k in t for k in need),(need,t)
          rr=[[float(x) for x in l.split()] for l in lines if l.strip() and not l.lstrip().startswith('#')]
          H0=67.15/299792.458; pts=[]
          for r in rr:
            z=r[t['z']]; a=1/(1+z); H=r[t['H [1/Mpc]']]; pv=r[t["phi'_qcf"]]/(a*H); qv=r[t["psi'_qpf"]]/(a*H)
            pts.append({'a':a,'z':z,'H':H,'E':H/H0,'x':r[t['phi_qcf']],'p':pv,'y':r[t['psi_qpf']],'q':qv,'D':pv*pv-qv*qv,'rqcf':r[t['(.)rho_qcf']],'rqpf':r[t['(.)rho_qpf']]})
          assert pts and all(all(math.isfinite(v) for v in d.values()) and d['H']>0 for d in pts)
          pts.sort(key=lambda d:d['a'])
          def ai(a,key):
            for u,v in zip(pts[:-1],pts[1:]):
              if u['a']<=a<=v['a']:
                f=(a-u['a'])/(v['a']-u['a']) if v['a']!=u['a'] else 0.; return u[key]+f*(v[key]-u[key])
            if abs(a-pts[-1]['a'])<1e-10:return pts[-1][key]
            raise AssertionError((a,pts[0]['a'],pts[-1]['a']))
          z5={k:ai(1/6,k) for k in ['x','p','y','q','D','E']}; d49=ai(1/5.9,'D'); today=min(pts,key=lambda d:abs(d['a']-1))
          evo=[d for d in pts if 1/6<=d['a']<=1]; crosses=[]
          for u,v in zip(evo[:-1],evo[1:]):
            if u['D']<0<=v['D']:
              f=-u['D']/(v['D']-u['D']); ac=u['a']+f*(v['a']-u['a']); crosses.append(1/ac-1)
          omega=(today['rqcf']+today['rqpf'])/(today['H']**2)
          ref={'zx':1.1978720736725847,'x':1.3910277872721561,'p':0.3117003532815687,'y':0.7979144626637236,'q':-0.02751848184245475,'OmegaDE':0.6885076999845492}
          checks={
            'provider_rc_zero':Path('result/provider_rc.txt').read_text().strip()=='0','finite_positive_background':True,
            'z5_x':abs(z5['x']-.92)<=2e-4,'z5_y':abs(z5['y']-1.02)<=2e-4,'z5_p':abs(z5['p'])<=2e-3,'z5_q':abs(z5['q'])<=2e-3,
            'one_crossing':len(crosses)==1,'crossing_match':len(crosses)==1 and abs(crosses[0]-ref['zx'])<=.02,
            'today_x':abs(today['x']-ref['x'])<=5e-3,'today_y':abs(today['y']-ref['y'])<=5e-3,'today_p':abs(today['p']-ref['p'])<=5e-3,'today_q':abs(today['q']-ref['q'])<=2e-3,
            'E0':abs(today['E']-1)<=3e-3,'OmegaDE0':abs(omega-ref['OmegaDE'])<=3e-3,'phantom_after_start':d49<0,'quintessence_today':today['D']>0
          }
          result={'schema':'KMDSB.W03.M13b.K3D2BRKBackgroundRecovery.v0.1','provider_commit':os.environ['CLASS_PIN'],'background_evolver':'rk','checks':checks,'all_required_checks_pass':all(checks.values()),'failed':[k for k,v in checks.items() if not v],'z5':z5,'today':today,'crossings_z':crosses,'Omega_DE0':omega}
          Path('result/B1_rk_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); assert result['all_required_checks_pass'],result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-rk-enabled-background
          path: |
            result/
            out/
          retention-days: 90

  solver_control:
    name: R0 RK-vs-NDF15 disabled-adapter numerical control
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build patched CLASS with adapter disabled by input
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3 >/dev/null
          git clone -q https://github.com/lesgourg/class_public.git provider
          git -C provider checkout -q "$CLASS_PIN"
          mkdir -p result out
          python3 verification/m13b/k3d2_apply_class_two_field_adapter_entry.py provider --manifest result/adapter_manifest.json
          make -C provider -j2 class > result/build.log 2>&1
      - name: Run identical LambdaCDM with NDF15 and RK backgrounds
        shell: bash
        run: |
          set -euo pipefail
          for mode in ndf rk; do
            ev=1; [ "$mode" = rk ] && ev=0
            cat > result/${mode}.ini <<EOF
          h = 0.67
          omega_b = 0.0224
          omega_cdm = 0.12
          A_s = 2.1e-9
          n_s = 0.965
          tau_reio = 0.054
          output = mPk
          P_k_max_1/Mpc = 1.0
          z_pk = 0
          background_evolver = $ev
          write_background = yes
          root = $GITHUB_WORKSPACE/out/${mode}_
          EOF
            (cd provider && ./class "$GITHUB_WORKSPACE/result/${mode}.ini") > result/${mode}_stdout.txt 2> result/${mode}_stderr.txt
          done
      - name: Frozen solver-equivalence gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math,re,json,bisect
          def one(pat):
            a=sorted(Path('out').glob(pat)); assert len(a)==1,(pat,a); return a[0]
          def rows(p): return [[float(x) for x in l.split()] for l in p.read_text().splitlines() if l.strip() and not l.lstrip().startswith('#')]
          n=rows(one('ndf*_pk.dat')); r=rows(one('rk*_pk.dat')); rxs=[x[0] for x in r]; rys=[x[1] for x in r]
          def li(x):
            i=bisect.bisect_left(rxs,x)
            if i==0:return rys[0]
            if i>=len(rxs):return rys[-1]
            x0,x1=rxs[i-1],rxs[i]; y0,y1=rys[i-1],rys[i]; f=(math.log(x)-math.log(x0))/(math.log(x1)-math.log(x0)); return math.exp(math.log(y0)+f*(math.log(y1)-math.log(y0)))
          common=[x for x in n if rxs[0]<=x[0]<=rxs[-1]]; num=sum((x[1]-li(x[0]))**2 for x in common); den=sum(x[1]**2 for x in common); l2=math.sqrt(num/max(den,1e-300))
          def H0(path):
            ls=path.read_text().splitlines(); hs=[l for l in ls if l.lstrip().startswith('#') and 'H [1/Mpc]' in l and 'z' in l]; assert len(hs)==1
            t={m.group(2).strip():int(m.group(1))-1 for m in re.finditer(r'(\d+):(.+?)(?=\s+\d+:|$)',hs[0].lstrip('#').strip())}; rr=rows(path); last=min(rr,key=lambda row:abs(row[t['z']])); return last[t['H [1/Mpc]']]
          hn=H0(one('ndf*_background.dat')); hr=H0(one('rk*_background.dat')); hrel=abs(hn-hr)/max(abs(hn),abs(hr),1e-300)
          checks={'pk_L2_le_1e_8':l2<=1e-8,'H0_relative_le_1e_10':hrel<=1e-10}
          res={'schema':'KMDSB.W03.M13b.K3D2BBackgroundSolverControl.v0.1','checks':checks,'all_required_checks_pass':all(checks.values()),'pk_normalized_L2':l2,'H0_ndf15':hn,'H0_rk':hr,'H0_relative_difference':hrel,'qcf_qpf_enabled':False}
          Path('result/solver_control.json').write_text(json.dumps(res,indent=2,sort_keys=True)+'\n'); assert res['all_required_checks_pass'],res
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3d2b-rk-vs-ndf-control
          path: |
            result/
            out/
          retention-days: 90
