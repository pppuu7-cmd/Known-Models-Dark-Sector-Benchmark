name: Sync M27 provider boundary ledgers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-m27-provider-boundary-ledgers.yml']
permissions:
  contents: write
jobs:
  sync-ledgers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Synchronize M27 terminal provider-capability evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          stamp='''\n### 2026-09-11 — M27 stock CLASS multi-parent provider boundary\nValidated Actions run `34568316761` (head `5b303e0198150cb1cbfa4d0b263da33ff372e7e8`; jobs source-audit `103164884425`, provider-control `103164884629`, aggregate `103165079604`) completed successfully. The exact pinned stock provider `lesgourg/class_public@e85808324f51fc694d12e3ed7439552a3c3f9540` exposes one scalar `Gamma_dcdm`/one DCDM parent and no native vector/list/indexed multi-parent decay semantics, while the frozen one-species DCDM control executes with finite background, P(k), and C_ell outputs. Canonical result commit `8beb946378b3cf5795288e66e600ffdc3aa74add`: `M27_STOCK_CLASS_MULTI_DCDM_PROVIDER_UNAVAILABLE`. This is a provider capability boundary, not physical DDM falsification and does not promote K1/K3/K4. Allowed continuation: another pinned public multi-parent provider, or a separately preregistered independent covariant implementation with N=1 stock-CLASS regression.\n'''
          for fn in ['recovery/STATE.md','recovery/RESTORE_FROM_NEW_CHAT.md','logs/research_log.md']:
            p=Path(fn); txt=p.read_text()
            if '34568316761' not in txt:
              p.write_text(txt.rstrip()+'\n'+stamp+'\n')
          p=Path('matrices/model_family_census.csv'); txt=p.read_text()
          old='F27,dynamical dark matter ensemble,dark_matter,B,M27,HIGH_L_HIERARCHY_PASS_SELF_CONSISTENT_METRIC_OPEN,W04,mass-lifetime-abundance ensemble and distributed temporal response,"Independent M27 verification has distributed-decay geometry/background/source/hierarchy work. Parent L17->L32 hierarchy gate remained NOT_ESTABLISHED, but prospectively frozen L32->L64 refinement passed 27/27 with max amplitude-normalized residual 1.806015929192509e-06. This localizes the earlier failure to insufficient hierarchy depth under prescribed metric forcing; K1/K3/K4 are not globally promoted. Self-consistent Einstein/metric closure and later gates remain open."'
          new='F27,dynamical dark matter ensemble,dark_matter,B,M27,HIGH_L_HIERARCHY_PASS_SELF_CONSISTENT_METRIC_PROVIDER_OPEN,W04,mass-lifetime-abundance ensemble and distributed temporal response,"Independent M27 verification has distributed-decay geometry/background/source/hierarchy work. Parent L17->L32 hierarchy gate remained NOT_ESTABLISHED, but prospectively frozen L32->L64 refinement passed 27/27 with max amplitude-normalized residual 1.806015929192509e-06. Stock CLASS provider-capability run 34568316761 establishes that the pinned official provider supports one-species DCDM but does not expose native independently decaying multi-parent DCDM semantics. This is a provider boundary, not physical falsification; K1/K3/K4 are not globally promoted. Self-consistent Einstein/metric closure remains open via another pinned provider or preregistered independent covariant implementation."'
          if old in txt: txt=txt.replace(old,new)
          p.write_text(txt)
          p=Path('matrices/mandatory_properties_matrix.csv'); txt=p.read_text()
          old='F27,M27,PASS_WITH_SCOPE_INDEPENDENT_VERIFICATION,NOT_ESTABLISHED,PASS_WITH_SCOPE_DISTRIBUTED_DECAY_GEOMETRY,PARTIAL_PRESCRIBED_METRIC_SOURCE_AND_HIERARCHY_ONLY,PASS_WITH_SCOPE_L32_TO_L64_HIERARCHY_TRUNCATION,PARTIAL_RESPONSE_GEOMETRY_ONLY,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,HIGH_L_HIERARCHY_PASS_SELF_CONSISTENT_METRIC_OPEN,"M27 prescribed-metric dark-radiation hierarchy: initial L17->L32 gate failed on 7/27 branches (max 0.004003933161124123), preserved as parent evidence. Prospectively frozen L32->L64 refinement passed all 27 branches; max residual 1.806015929192509e-06. Classification M27_DDM_DR_HIGH_L_HIERARCHY_CONVERGENCE_PASS_WITH_PRESCRIBED_METRIC_SCOPE. No K1/K3/K4 global promotion and no physical falsification; self-consistent Einstein/metric closure remains open."'
          new='F27,M27,PASS_WITH_SCOPE_INDEPENDENT_VERIFICATION,NOT_ESTABLISHED,PASS_WITH_SCOPE_DISTRIBUTED_DECAY_GEOMETRY,PARTIAL_PRESCRIBED_METRIC_SOURCE_AND_HIERARCHY_ONLY,PASS_WITH_SCOPE_L32_TO_L64_HIERARCHY_TRUNCATION,PARTIAL_RESPONSE_GEOMETRY_ONLY,NOT_TESTED,NOT_TESTED,NOT_TESTED,NOT_TESTED,HIGH_L_HIERARCHY_PASS_SELF_CONSISTENT_METRIC_PROVIDER_OPEN,"M27 prescribed-metric dark-radiation hierarchy: initial L17->L32 gate failed on 7/27 branches (max 0.004003933161124123), preserved as parent evidence. Prospectively frozen L32->L64 refinement passed all 27 branches; max residual 1.806015929192509e-06. Stock CLASS multi-parent capability run 34568316761: source audit finds no native multi-parent DCDM semantics, while one-species DCDM provider control passes. Classification M27_STOCK_CLASS_MULTI_DCDM_PROVIDER_UNAVAILABLE is a provider boundary only. No K1/K3/K4 global promotion and no physical falsification; self-consistent Einstein/metric closure remains open through another pinned provider or preregistered independent implementation."'
          if old in txt: txt=txt.replace(old,new)
          p.write_text(txt)
          PY
      - name: Commit synchronized ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/STATE.md recovery/RESTORE_FROM_NEW_CHAT.md logs/research_log.md matrices/model_family_census.csv matrices/mandatory_properties_matrix.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Sync M27 stock CLASS provider boundary into ledgers'
          git pull --rebase origin main
          git push origin HEAD:main
