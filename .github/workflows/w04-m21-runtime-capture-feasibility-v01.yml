name: W04 M21 runtime capture feasibility v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m21-runtime-capture-feasibility-v01.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  lane:
    strategy:
      fail-fast: false
      matrix:
        case: [ref, f2, f3, f4]
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user numpy
      - name: Enforce frozen authorities
        run: |
          grep -F 'e85808324f51fc694d12e3ed7439552a3c3f9540' protocol/W04_M21_L400_APPROX_STATE_SOURCE_ZERO_TRANSITION_AUDIT_v0.1.md
          grep -F 'normalized L2 <=1e-12' protocol/W04_M21_L400_APPROX_STATE_SOURCE_ZERO_TRANSITION_AUDIT_v0.1.md
      - uses: actions/download-artifact@v4
        with:
          name: m21-lphase-P400_ON_TAIL_OFF
          path: parent
          github-token: ${{ github.token }}
          repository: pppuu7-cmd/Known-Models-Dark-Sector-Benchmark
          run-id: 34887488405
      - name: Compile and execute read-only runtime state capture
        env:
          CASE: ${{ matrix.case }}
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          PIN=e85808324f51fc694d12e3ed7439552a3c3f9540
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$PIN"
          test "$(git -C class rev-parse HEAD)" = "$PIN"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('class/source/perturbations.c'); s=p.read_text()
          needle='_set_source_(ppt->index_tp_p) = sqrt(6.) * g * P;'
          assert s.count(needle)>=1
          probe=needle+'\n        fprintf(stderr,"KMDSB_CAP tau=%.17g k=%.17g rsa=%d tca=%d g=%.17g P=%.17g SE=%.17g\\n",tau,k,ppw->approx[ppw->index_ap_rsa],ppw->approx[ppw->index_ap_tca],g,P,_set_source_(ppt->index_tp_p));'
          p.write_text(s.replace(needle,probe))
          PY
          python3 verification/m21/mixed_cold_warm_k1_reference.py prepare m21_cases
          python3 verification/m21/build_l_grid_phase_profile.py P400_ON_TAIL_OFF class/cl_permille.pre verification/m21/m21_ncdm_tight.pre l400_diag.pre profile_manifest.json
          mkdir -p output
          make -C class -j2 > build.log 2>&1
          timeout 2700 ./class/class "m21_cases/${CASE}.ini" l400_diag.pre > "stdout_${CASE}.log" 2> "capture_${CASE}.log"
          python3 - <<'PY'
          import glob,json,os,pathlib,re,numpy as np
          c=os.environ['CASE']; cap=pathlib.Path(f'capture_{c}.log').read_text(errors='replace').splitlines()
          pat=re.compile(r'KMDSB_CAP tau=([^ ]+) k=([^ ]+) rsa=(\d+) tca=(\d+) g=([^ ]+) P=([^ ]+) SE=([^ ]+)')
          rows=[]
          for line in cap:
            m=pat.search(line)
            if m: rows.append([float(m.group(1)),float(m.group(2)),int(m.group(3)),int(m.group(4)),float(m.group(5)),float(m.group(6)),float(m.group(7))])
          cand=glob.glob(f'output/*{c}*_cl.dat')+glob.glob('output/*_cl.dat'); assert cand
          pc=[pathlib.Path(x) for x in glob.glob('parent/**/*_cl.dat',recursive=True) if c in pathlib.Path(x).name]
          if not pc: pc=[pathlib.Path(x) for x in glob.glob('parent/**/*_cl.dat',recursive=True)]
          assert pc
          def load(p): a=np.loadtxt(p); return a[:,0],a[:,1:]
          lf,yf=load(cand[0]); lp,yp=load(pc[0]); common=np.intersect1d(lf,lp); assert len(common)>10
          fi=np.searchsorted(lf,common); pi=np.searchsorted(lp,common); a=yf[fi].ravel(); b=yp[pi].ravel()
          r=float(np.linalg.norm(a-b)/max(np.linalg.norm(b),1e-300))
          finite=bool(all(np.isfinite([x for row in rows for x in (row[0],row[1],row[4],row[5],row[6])])))
          recon=float(max((abs(row[6]-np.sqrt(6.)*row[4]*row[5])/max(abs(row[6]),abs(np.sqrt(6.)*row[4]*row[5]),1e-300) for row in rows),default=float('inf')))
          passed=bool(rows) and finite and r<=1e-12 and recon<=1e-10
          out={'schema':'KMDSB.W04.M21.RuntimeCaptureFeasibilityLane.v0.1','case':c,'provider_commit':'e85808324f51fc694d12e3ed7439552a3c3f9540','capture_rows':len(rows),'normalized_l2':r,'reconstruction_max_relative_error':recon,'finite':finite,'pass':passed,'scope':'runtime feasibility for tau,k,RSA,TCA,g,P,S_E; primitive-P decomposition remains required before frozen scientific classifier','scientific_classifier_executed':False,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          pathlib.Path(f'capture_feasibility_{c}.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2))
          if not passed: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-runtime-capture-feasibility-${{ matrix.case }}
          path: |
            capture_feasibility_${{ matrix.case }}.json
            capture_${{ matrix.case }}.log
            build.log
            stdout_${{ matrix.case }}.log
          if-no-files-found: warn
          retention-days: 90

  barrier:
    needs: lane
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m21-runtime-capture-feasibility-*
          path: lanes
      - name: Fail closed on 4/4 runtime capture feasibility
        run: |
          python3 - <<'PY'
          import json,pathlib
          ds=[json.load(open(p)) for p in pathlib.Path('lanes').rglob('capture_feasibility_*.json')]
          req={'ref','f2','f3','f4'}; ok={d['case'] for d in ds if d.get('pass')}==req
          out={'schema':'KMDSB.W04.M21.RuntimeCaptureFeasibilityBarrier.v0.1','classification':'M21_L400_RUNTIME_CAPTURE_FEASIBILITY_PASS' if ok else 'M21_L400_RUNTIME_CAPTURE_FEASIBILITY_BLOCKED','lanes':{d['case']:{'rows':d['capture_rows'],'normalized_l2':d['normalized_l2'],'reconstruction_max_relative_error':d['reconstruction_max_relative_error']} for d in ds},'primitive_P_decomposition_still_required':True,'scientific_classifier_executed':False,'K1_promoted':False,'K3_promoted':False,'K4_promoted':False,'physical_falsification':False}
          pathlib.Path('M21_RUNTIME_CAPTURE_FEASIBILITY_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          if not ok: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m21-runtime-capture-feasibility-v01
          path: M21_RUNTIME_CAPTURE_FEASIBILITY_RESULT.json
          retention-days: 90
