name: W04 M19 axionCAMB2 independent zero probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m19-axioncamb2-zero-probe.yml'
      - 'verification/m19/axioncamb2_zero_probe.py'
      - 'protocol/W04_M19_AXIONCAMB2_K1_INDEPENDENT_ZERO_PROBE_v0.1.md'
permissions:
  contents: write
jobs:
  zero-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIN: 891e779cc0bd422e49f97533e6c2fc761149737d
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Pin and prepare
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/dgrin1/axionCAMB.git external_axioncamb
          git -C external_axioncamb checkout -q --detach "$PIN"
          test "$(git -C external_axioncamb rev-parse HEAD)" = "$PIN"
          python3 verification/m19/axioncamb2_zero_probe.py prepare external_axioncamb/params.ini m19_axc_cases
      - name: Build and execute
        shell: bash
        run: |
          set +e
          cd external_axioncamb
          make -j1 FFLAGS='-O3 -ffree-line-length-none -fallow-argument-mismatch' > ../m19_axc_build.log 2>&1
          be=$?
          r0f=999; r0d=999; p1=999
          if [ "$be" -eq 0 ]; then
            ./camb ../m19_axc_cases/r0f.ini > ../m19_axc_r0f.log 2>&1; r0f=$?
            ./camb ../m19_axc_cases/r0d.ini > ../m19_axc_r0d.log 2>&1; r0d=$?
            ./camb ../m19_axc_cases/p1.ini > ../m19_axc_p1.log 2>&1; p1=$?
          fi
          cd ..
          printf '{"build_exit":%d,"r0f":%d,"r0d":%d,"p1":%d}\n' "$be" "$r0f" "$r0d" "$p1" > m19_axc_status.json
          exit 0
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/m19/axioncamb2_zero_probe.py analyze external_axioncamb m19_axc_status.json m19_axc_result.json
          cat m19_axc_result.json
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          cp m19_axc_result.json /tmp/result.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main; git reset --hard origin/main
          mkdir -p models/fuzzy_ultralight_axion waves/wave_04_dark_matter
          cp /tmp/result.json models/fuzzy_ultralight_axion/M19_AXIONCAMB2_ZERO_PROBE_RESULT.json
          cp /tmp/result.json waves/wave_04_dark_matter/M19_AXIONCAMB2_ZERO_PROBE_RESULT.json
          git add models/fuzzy_ultralight_axion/M19_AXIONCAMB2_ZERO_PROBE_RESULT.json waves/wave_04_dark_matter/M19_AXIONCAMB2_ZERO_PROBE_RESULT.json
          git diff --cached --quiet || { git commit -m 'Record M19 axionCAMB2 zero probe'; git pull --rebase origin main; git push origin HEAD:main; }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-m19-axioncamb2-zero-probe
          path: |
            m19_axc_cases/
            m19_axc_build.log
            m19_axc_*.log
            m19_axc_status.json
            m19_axc_result.json
            external_axioncamb/r0f_scalCls.dat
            external_axioncamb/r0f_matterpower.dat
            external_axioncamb/r0f_transfer_out.dat
            external_axioncamb/r0d_scalCls.dat
            external_axioncamb/r0d_matterpower.dat
            external_axioncamb/r0d_transfer_out.dat
            external_axioncamb/p1_scalCls.dat
            external_axioncamb/p1_matterpower.dat
            external_axioncamb/p1_transfer_out.dat
          retention-days: 90
