name: W04 M20 SIDM K4 weighted independent grid axes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w04-m20-k4-weighted-grid-axes.yml'
      - 'verification/m20/k4_weighted_grid_axes.py'
      - 'protocol/W04_M20_K4_WEIGHTED_GRID_AXES_PREREGISTRATION_v0.1.md'
permissions:
  contents: read
jobs:
  axis:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        axis: [mass, redshift]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROVIDER_PIN: e17d3664dac677b604fd4ff02fb2af105a6937fa
    steps:
      - uses: actions/checkout@v4
      - name: Pin provider and environment
        run: |
          set -euo pipefail
          git clone -q https://github.com/shinichiroando/sashimi-si.git sashimi
          git -C sashimi checkout -q --detach "$PROVIDER_PIN"
          test "$(git -C sashimi rev-parse HEAD)" = "$PROVIDER_PIN"
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3 scipy==1.16.1 numexpr==2.11.0 tqdm==4.67.1
      - name: Run preregistered weighted grid axis
        env:
          AXIS: ${{ matrix.axis }}
        run: |
          set -euo pipefail
          python3 verification/m20/k4_weighted_grid_axes.py sashimi "$AXIS" "M20_K4_WEIGHTED_GRID_${AXIS}.json"
          cat "M20_K4_WEIGHTED_GRID_${AXIS}.json"
      - name: Guardrails
        env:
          AXIS: ${{ matrix.axis }}
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open(f"M20_K4_WEIGHTED_GRID_{os.environ['AXIS']}.json"))
          assert r['K4_promoted'] is False and r['scientific_fail'] is False and r['physical_falsification'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m20-k4-weighted-grid-${{ matrix.axis }}
          path: M20_K4_WEIGHTED_GRID_${{ matrix.axis }}.json
          retention-days: 30
