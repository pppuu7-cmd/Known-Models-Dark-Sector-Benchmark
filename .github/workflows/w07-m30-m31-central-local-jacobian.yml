name: W07 M30 M31 central local Jacobian

on:
  push:
    paths:
      - '.github/workflows/w07-m30-m31-central-local-jacobian.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HICLASS_PIN: '0009f51d89e6465c79e570b496c66fc90058fa77'

jobs:
  central-jacobian:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [M30, M31]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build exact pinned provider
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential python3-numpy >/dev/null
          git clone -q https://github.com/hiclass-code/hi_class_public.git provider
          git -C provider checkout -q --detach "$HICLASS_PIN"
          test "$(git -C provider rev-parse HEAD)" = "$HICLASS_PIN"
          make -C provider -j2 >/dev/null
          git -C provider rev-parse HEAD > provider_commit.txt
      - name: Generate frozen symmetric stencil
        shell: bash
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'; BASE="$GITHUB_WORKSPACE/central_${MODEL}"; mkdir -p "$BASE"
          python3 - "$MODEL" "$BASE" <<'PY'
          import pathlib,re,sys
          model=sys.argv[1]; b=pathlib.Path(sys.argv[2]); src=pathlib.Path('provider/gravity_models/propto_omega_bh.ini').read_text()
          specs={
            'base':(0.100,0.000),
            'rp2':(0.102,0.000),'rm2':(0.098,0.000),
            'rp1':(0.101,0.000),'rm1':(0.099,0.000),
            'tp2':(0.100,0.002),'tm2':(0.100,-0.002),
            'tp1':(0.100,0.001),'tm1':(0.100,-0.001),
          }
          for tag,(q,ct) in specs.items():
              ch=0.0 if model=='M30' else 0.3*q
              vals=[q,0.5*q,0.2*q,ct,ch,1.0]
              t=re.sub(r'(?m)^parameters_smg\s*=.*$', 'parameters_smg = '+', '.join(f'{v:.16g}' for v in vals), src)
              t=re.sub(r'(?m)^root\s*=.*$', f'root = {b}/{tag}_', t)
              (b/f'{tag}.ini').write_text(t)
          PY
          grep -H -E '^(gravity_model|parameters_smg|root|expansion_model|Omega_smg|background_Nloga|kineticity_safe_smg)' "$BASE"/*.ini | tee "$BASE/frozen_parameters.txt"
      - name: Execute all symmetric arms
        shell: bash
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'; BASE="$GITHUB_WORKSPACE/central_${MODEL}"
          for tag in base rp2 rm2 rp1 rm1 tp2 tm2 tp1 tm1; do
            set +e
            ./provider/class "$BASE/${tag}.ini" > "$BASE/${tag}.stdout" 2> "$BASE/${tag}.stderr"
            rc=$?
            set -e
            echo "$rc" > "$BASE/${tag}.exit"
          done
      - name: Analyze frozen central differences on one global support
        shell: bash
        run: |
          set -euo pipefail
          MODEL='${{ matrix.model }}'; BASE="$GITHUB_WORKSPACE/central_${MODEL}"
          python3 - "$MODEL" "$BASE" <<'PY'
          import json,math,pathlib,sys
          import numpy as np
          model=sys.argv[1]; b=pathlib.Path(sys.argv[2]); expected='0009f51d89e6465c79e570b496c66fc90058fa77'; pin=pathlib.Path('provider_commit.txt').read_text().strip()
          tags=['base','rp2','rm2','rp1','rm1','tp2','tm2','tp1','tm1']; exits={t:int((b/f'{t}.exit').read_text()) for t in tags}
          out={'schema':'m30_m31_central_local_jacobian_v0.1','model_id':model,'family_id':'F30' if model=='M30' else 'F31',
               'protocol':'protocol/W07_M30_M31_CENTRAL_LOCAL_JACOBIAN_PREREGISTRATION_v0.1.md','provider_commit':pin,'expected_commit':expected,'exits':exits,
               'base_q':0.1,'coarse_h':0.002,'fine_h':0.001,'K2_promoted':False,'physical_falsification':False,'complete_covariant_family_claim':False}
          if pin!=expected or exits['base']!=0:
              out['classification']=f'{model}_CENTRAL_LOCAL_CONTROL_BLOCKED'
          elif any(exits[t]!=0 for t in tags[1:]):
              out['classification']=f'{model}_CENTRAL_LOCAL_PROVIDER_BLOCKED'; out['failed_arms']=[t for t in tags[1:] if exits[t]!=0]
          else:
              def load(path):
                  rows=[]
                  for line in pathlib.Path(path).read_text(errors='replace').splitlines():
                      s=line.strip()
                      if not s or s.startswith('#'): continue
                      try: rows.append([float(x) for x in s.split()])
                      except ValueError: pass
                  a=np.asarray(rows,float)
                  if a.ndim!=2 or len(a)<5 or a.shape[1]<2: raise RuntimeError(f'bad table {path}')
                  return a
              # hi_class output root appends 00; use exact frozen provider naming.
              cls={t:load(b/f'{t}_00_cl.dat') for t in tags}; pks={t:load(b/f'{t}_00_pk.dat') for t in tags}
              maps={t:{int(r[0]):np.asarray(r[1:],float) for r in cls[t] if np.isfinite(r[0])} for t in tags}
              common_ell=sorted(set.intersection(*(set(maps[t]) for t in tags)))
              cmb={t:[] for t in tags}
              for ell in common_ell:
                  n=min(len(maps[t][ell]) for t in tags)
                  for j in range(n):
                      vals=[maps[t][ell][j] for t in tags]
                      if all(np.isfinite(v) for v in vals):
                          for t,v in zip(tags,vals): cmb[t].append(v)
              cmb={t:np.asarray(cmb[t],float) for t in tags}
              if len(cmb['base'])<5 or any(len(cmb[t])!=len(cmb['base']) for t in tags): raise RuntimeError('global CMB support invalid')
              cnorm=float(np.linalg.norm(cmb['base']));
              if cnorm==0: raise RuntimeError('zero CMB norm')
              lo=max(float(np.nanmin(pks[t][:,0])) for t in tags); hi=min(float(np.nanmax(pks[t][:,0])) for t in tags)
              bp=pks['base']; mask=(bp[:,0]>=lo)&(bp[:,0]<=hi)&np.isfinite(bp[:,0])&np.isfinite(bp[:,1]); x=bp[mask,0]
              pk={t:(bp[mask,1] if t=='base' else np.interp(x,pks[t][:,0],pks[t][:,1])) for t in tags}
              pmask=np.ones(len(x),dtype=bool)
              for t in tags: pmask &= np.isfinite(pk[t])
              x=x[pmask]; pk={t:np.asarray(pk[t][pmask],float) for t in tags}; pnorm=float(np.linalg.norm(pk['base']))
              if len(x)<5 or pnorm==0: raise RuntimeError('global P(k) support invalid')
              out['global_support']={'cmb_values':int(len(cmb['base'])),'pk_values':int(len(x)),'ell_count':int(len(common_ell)),'pk_k_min':float(x.min()),'pk_k_max':float(x.max())}
              def central(plus,minus,h):
                  c=(cmb[plus]-cmb[minus])/(2*h*cnorm); p=(pk[plus]-pk[minus])/(2*h*pnorm)
                  return np.concatenate([c,p]),{'cmb_block_norm':float(np.linalg.norm(c)),'pk_block_norm':float(np.linalg.norm(p))}
              rc,rcm=central('rp2','rm2',0.002); rf,rfm=central('rp1','rm1',0.001); tc,tcm=central('tp2','tm2',0.002); tf,tfm=central('tp1','tm1',0.001)
              def geom(a,b):
                  na=float(np.linalg.norm(a)); nb=float(np.linalg.norm(b))
                  if na==0 or nb==0: raise RuntimeError('zero derivative norm')
                  c=float(np.dot(a,b)/(na*nb)); c=max(-1.0,min(1.0,c)); ang=float(math.degrees(math.acos(abs(c))))
                  return {'cosine':c,'absolute_cosine':abs(c),'principal_angle_deg':ang,'relative_norm_mismatch':abs(na-nb)/max(na,nb),'norm_a':na,'norm_b':nb}
              rg=geom(rc,rf); tg=geom(tc,tf); cross=geom(rf,tf); cross['sin_principal_angle']=float(math.sin(math.radians(cross['principal_angle_deg'])))
              rp=rg['principal_angle_deg']<=5.0 and rg['relative_norm_mismatch']<=0.25; tp=tg['principal_angle_deg']<=5.0 and tg['relative_norm_mismatch']<=0.25; sep=cross['principal_angle_deg']>=10.0
              out.update({'radial_central_convergence':rg,'cT_central_convergence':tg,'fine_cross_direction_geometry':cross,
                          'radial_coarse_meta':rcm,'radial_fine_meta':rfm,'cT_coarse_meta':tcm,'cT_fine_meta':tfm,
                          'radial_derivative_converged':rp,'cT_derivative_converged':tp,'cross_direction_separated':sep})
              if not (rp and tp): out['classification']=f'{model}_CENTRAL_LOCAL_DERIVATIVE_NOT_CONVERGED'
              elif not sep: out['classification']=f'{model}_CENTRAL_LOCAL_2D_RESPONSE_NEAR_COLLINEAR'
              else: out['classification']=f'{model}_CENTRAL_LOCAL_2D_RESPONSE_RANK_EVIDENCE'
          pathlib.Path(f'{model}_CENTRAL_LOCAL_JACOBIAN.json').write_text(json.dumps(out,indent=2)+'\n')
          with open(f'{model}_CENTRAL_LOCAL_JACOBIAN.md','w') as f:
              f.write(f'# {model} central-difference local Jacobian\n\nClassification: `{out["classification"]}`  \n')
              if 'radial_central_convergence' in out:
                  f.write(f"Radial central coarse/fine: angle={out['radial_central_convergence']['principal_angle_deg']:.6g} deg, mismatch={out['radial_central_convergence']['relative_norm_mismatch']:.6g}  \n")
                  f.write(f"c_T central coarse/fine: angle={out['cT_central_convergence']['principal_angle_deg']:.6g} deg, mismatch={out['cT_central_convergence']['relative_norm_mismatch']:.6g}  \n")
                  f.write(f"Fine radial-vs-c_T angle: {out['fine_cross_direction_geometry']['principal_angle_deg']:.6g} deg  \n")
              f.write('\nPrior forward-difference failure remains part of the record. No K2 promotion or physical-family claim is assigned.\n')
          print(pathlib.Path(f'{model}_CENTRAL_LOCAL_JACOBIAN.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.model }}-central-local-jacobian
          path: |
            ${{ matrix.model }}_CENTRAL_LOCAL_JACOBIAN.json
            ${{ matrix.model }}_CENTRAL_LOCAL_JACOBIAN.md
            provider_commit.txt
            central_${{ matrix.model }}/
