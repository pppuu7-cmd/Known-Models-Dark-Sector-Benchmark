name: W05 M32 K0k UMUSCL compiler phase localization

on:
  push:
    paths:
      - '.github/workflows/w05-m32-k0k-umuscl-compiler-phase-localization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PIN: 849ddb716041316d0e223ba22badc0d630b72435
  CHECKPOINT_ARTIFACT: '10283774354'
  OMP_NUM_THREADS: '1'

jobs:
  preprocess:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Intel compiler family
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpg-agent wget ca-certificates >/dev/null
          key=$(mktemp)
          wget -qO "$key" https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          gpg --dearmor <"$key" | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          rm -f "$key"
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq intel-oneapi-compiler-fortran intel-oneapi-mpi-devel >/dev/null
      - name: Verify exact provider and preprocess exact UMUSCL source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          git clone -q https://github.com/nat-woodcock/EFT-Ramses.git provider
          git -C provider checkout -q --detach "$PIN"
          test "$(git -C provider rev-parse HEAD)" = "$PIN"
          sha256sum provider/hydro/umuscl.f90 > result/source_sha256.txt
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          set -u
          ifx --version > result/ifx_version.txt 2>&1
          set +e
          mpiifx -E -cpp -DNVECTOR=64 -DNDIM=3 -DNPRE=8 -DNVAR=5 -DSOLVERhydro provider/hydro/umuscl.f90 > result/umuscl.pp.f90 2> result/preprocess_stderr.log
          rc=$?
          set -e
          echo "$rc" > result/preprocess_exit_code.txt
          nonempty=false; test -s result/umuscl.pp.f90 && nonempty=true
          python3 - "$rc" "$nonempty" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); nonempty=sys.argv[2].lower()=='true'
          err=pathlib.Path('result/preprocess_stderr.log').read_text(errors='replace')
          low=err.lower()
          explicit=[ln for ln in err.splitlines() if any(x in ln.lower() for x in ['error #','catastrophic error','fatal error','cannot open'])]
          if rc==0 and nonempty: cls='M32_K0K_PREPROCESS_PASS'
          elif rc in (124,130,137,143) or 'shutdown signal' in low or 'cancel' in low: cls='M32_K0K_PREPROCESS_HOSTED_INFRA_BLOCKED'
          else: cls='M32_K0K_PREPROCESS_SOURCE_BLOCKED'
          out={'schema':'m32_k0k_preprocess_v0.1','model_id':'M32','provider_commit':'849ddb716041316d0e223ba22badc0d630b72435','source':'hydro/umuscl.f90','runner_image':'ubuntu-24.04','exit_code':rc,'preprocessed_nonempty':nonempty,'explicit_diagnostics':explicit[-20:],'classification':cls,'K0_promoted':False,'physical_falsification':False,'scientific_fail':False}
          pathlib.Path('result/M32_K0K_PREPROCESS_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m32-k0k-preprocess
          path: result/
          retention-days: 30

  o0-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Intel-family toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpg-agent wget ca-certificates >/dev/null
          key=$(mktemp)
          wget -qO "$key" https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          gpg --dearmor <"$key" | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          rm -f "$key"
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq intel-oneapi-compiler-fortran intel-oneapi-mpi-devel >/dev/null
      - name: Restore exact checkpoint and compile UMUSCL at O0 diagnostic level
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work result
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHECKPOINT_ARTIFACT}/zip" > stage1.zip
          sha256sum stage1.zip > result/parent_zip_sha256.txt
          unzip -q stage1.zip -d work/stage1
          git clone -q https://github.com/nat-woodcock/EFT-Ramses.git work/provider
          git -C work/provider checkout -q --detach "$PIN"
          test "$(git -C work/provider rev-parse HEAD)" = "$PIN"
          sha256sum work/provider/hydro/umuscl.f90 > result/source_sha256.txt
          cd work/provider/bin
          rm -f -- *.o *.mod ramses3d
          tar -xf "$GITHUB_WORKSPACE/work/stage1/checkpoint.tar" -C .
          find . -maxdepth 1 -type f \( -name '*.o' -o -name '*.mod' \) -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/result/hashes_before_touch.txt"
          find . -maxdepth 1 -type f \( -name '*.o' -o -name '*.mod' \) -exec touch {} +
          find . -maxdepth 1 -type f \( -name '*.o' -o -name '*.mod' \) -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/result/hashes_after_touch.txt"
          cmp "$GITHUB_WORKSPACE/result/hashes_before_touch.txt" "$GITHUB_WORKSPACE/result/hashes_after_touch.txt"
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          set -u
          ifx --version > "$GITHUB_WORKSPACE/result/ifx_version.txt" 2>&1
          mpiifx -v > "$GITHUB_WORKSPACE/result/mpiifx_version.txt" 2>&1 || true
          rm -f umuscl.o
          set +e
          make umuscl.o F90='mpiifx' FFLAGS='-O0 -g -mcmodel=large -traceback -fpe0 -ftrapuv -cpp $(DEFINES)' > "$GITHUB_WORKSPACE/result/build_stdout.log" 2> "$GITHUB_WORKSPACE/result/build_stderr.log" &
          PID=$!
          echo "$PID" > "$GITHUB_WORKSPACE/result/compiler_pid.txt"
          while kill -0 "$PID" 2>/dev/null; do
            printf '%s compiler_pid=%s alive\n' "$(date -u +%FT%TZ)" "$PID"
            sleep 5
          done
          wait "$PID"
          rc=$?
          set -e
          exists=false; test -f umuscl.o && exists=true
          test "$exists" = false || cp umuscl.o "$GITHUB_WORKSPACE/result/umuscl.o"
          echo "$rc" > "$GITHUB_WORKSPACE/result/build_exit_code.txt"
          cd "$GITHUB_WORKSPACE"
          python3 - "$rc" "$exists" <<'PY'
          import json,pathlib,sys
          rc=int(sys.argv[1]); exists=sys.argv[2].lower()=='true'
          stderr=pathlib.Path('result/build_stderr.log').read_text(errors='replace')
          stdout=pathlib.Path('result/build_stdout.log').read_text(errors='replace')
          low=(stderr+'\n'+stdout).lower()
          diagnostics=[ln for ln in (stderr+'\n'+stdout).splitlines() if any(x in ln.lower() for x in ['error #','catastrophic error','undefined reference','cannot open module file','severe (','fatal error:'])]
          if rc==0 and exists: cls='M32_K0K_O0_OBJECT_COMPILED_DIAGNOSTIC_ONLY'
          elif diagnostics: cls='M32_K0K_O0_COMPILER_OR_SOURCE_BLOCKED'
          elif rc in (124,130,137,143) or 'shutdown signal' in low or 'cancel' in low: cls='M32_K0K_O0_HOSTED_INFRASTRUCTURE_BLOCKED'
          else: cls='M32_K0K_O0_COMPILER_OR_SOURCE_BLOCKED'
          out={'schema':'m32_k0k_o0_compile_v0.1','model_id':'M32','provider_commit':'849ddb716041316d0e223ba22badc0d630b72435','parent_artifact':10283774354,'runner_image':'ubuntu-24.04','optimization':'O0','exit_code':rc,'target_object_exists':exists,'explicit_diagnostics':diagnostics[-20:],'classification':cls,'diagnostic_only':True,'K0_promoted':False,'physical_falsification':False,'scientific_fail':False}
          pathlib.Path('result/M32_K0K_O0_COMPILE_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m32-k0k-o0-compile
          path: result/
          retention-days: 30
