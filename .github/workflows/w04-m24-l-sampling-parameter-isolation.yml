name: W04 M24 l-sampling parameter isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/w04-m24-l-sampling-parameter-isolation.yml']
permissions:
  contents: write
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parameter: [l_logstep_only, l_linstep_only]
    env:
      CLASS_PIN: e85808324f51fc694d12e3ed7439552a3c3f9540
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned CLASS and prepare cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.3
          git clone -q https://github.com/lesgourg/class_public.git class
          git -C class checkout -q --detach "$CLASS_PIN"
          make -C class -j2 > build.log 2>&1
          python3 verification/m24/global_numerical_precision_diagnostic.py prepare cases cl_ref
          printf 'idr_streaming_trigger_tau_over_tau_k = 49\n' > control.pre
          cp control.pre parameter.pre
          if [ '${{ matrix.parameter }}' = 'l_logstep_only' ]; then
            printf 'l_logstep = 1.026\n' >> parameter.pre
          else
            printf 'l_linstep = 25\n' >> parameter.pre
          fi
          cat parameter.pre
      - name: Execute ten cases four-at-a-time
        shell: bash
        run: |
          mkdir -p class/output logs parts
          printf '%s\n' default_ref default_zero default_a18k default_a6k default_a1p8k profile_ref profile_zero profile_a18k profile_a6k profile_a1p8k | xargs -P 4 -I{} bash -c '
            t="$1"; set +e
            if [[ "$t" == profile_* ]]; then pre=../parameter.pre; else pre=../control.pre; fi
            (cd class && ./class "../cases/${t}.ini" "$pre" > "../logs/${t}.log" 2>&1)
            printf "%d\n" "$?" > "parts/${t}.status"
          ' _ {}
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('status.json').write_text(json.dumps({p.stem:int(p.read_text()) for p in Path('parts').glob('*.status')},sort_keys=True)+'\n')
          PY
      - name: Analyze isolated l-sampling parameter
        shell: bash
        env:
          PARAMETER: ${{ matrix.parameter }}
        run: |
          python3 verification/m24/global_numerical_precision_diagnostic.py analyze class/output status.json cl_ref result.json
          python3 - <<'PY'
          import json,os
          p='result.json'; r=json.load(open(p)); r['schema']='KMDSB.M24.LSamplingParameterIsolation.v1'; r['l_sampling_parameter']=os.environ['PARAMETER']; r['preregistration']='protocol/W04_M24_L_SAMPLING_PARAMETER_ISOLATION_PREREGISTRATION_v0.1.md'; r['parent_l_sampling_run_id']=34555463958; r['K1_promoted']=False; r['K4_promoted']=False; r['physical_falsification']=False; open(p,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          cat result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m24-l-sampling-${{ matrix.parameter }}
          path: |
            control.pre
            parameter.pre
            build.log
            status.json
            result.json
            logs/
            class/output/
          retention-days: 90
  aggregate:
    needs: isolate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: m24-l-sampling-*
          path: collected
      - name: Persist l-sampling attribution summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rs=[json.loads(p.read_text()) for p in Path('collected').glob('*/result.json')]
          s={'schema':'KMDSB.M24.LSamplingParameterIsolation.Summary.v1','preregistration':'protocol/W04_M24_L_SAMPLING_PARAMETER_ISOLATION_PREREGISTRATION_v0.1.md','parent_l_sampling_run_id':34555463958,'children':{r['l_sampling_parameter']:r['classification'] for r in rs},'Emax':{r['l_sampling_parameter']:{'control':r.get('default',{}).get('Emax'),'parameter':r.get('profile',{}).get('Emax')} for r in rs},'localized_parameters':[r['l_sampling_parameter'] for r in rs if r['classification']=='M24_GLOBAL_PRECISION_EXCURSION_LOCALIZED'],'K1_promoted':False,'K4_promoted':False,'physical_falsification':False}
          Path('summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n'); print(Path('summary.json').read_text())
          PY
          cp summary.json /tmp/summary.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main && git reset --hard origin/main
          mkdir -p waves/wave_04_dark_matter models/ethos_like_dark_sector
          cp /tmp/summary.json waves/wave_04_dark_matter/M24_L_SAMPLING_PARAMETER_ISOLATION_SUMMARY.json
          cp /tmp/summary.json models/ethos_like_dark_sector/M24_L_SAMPLING_PARAMETER_ISOLATION_SUMMARY.json
          git add waves/wave_04_dark_matter models/ethos_like_dark_sector
          git diff --cached --quiet || { git commit -m 'Record M24 l-sampling parameter isolation'; git pull --rebase origin main; git push origin HEAD:main; }
